nimus: ekstensor dan abduktor panggul. Piriformis, obturator internus, gemelli, quadratus femoris: eksorotator. Suntikan intragluteal harus menghindari n. ischiadicus yang keluar lewat foramen ischiadicum majus.","s":"Anatomi Muskuloskeletal sl. 97"},{"t":"ana","f":"Otot hamstring","b":"M. semitendinosus, m. semimembranosus, m. biceps femoris: ekstensor panggul dan fleksor lutut. Sering robek di perlekatan tuber ischiadicum pada olahraga dengan start cepat.","s":"Anatomi Muskuloskeletal sl. 99"},{"t":"ana","f":"Kompartemen tungkai bawah","b":"Anterior (dorsofleksi): tibialis anterior, extensor hallucis longus, extensor digitorum longus, peroneus tertius. Lateral: peroneus longus dan brevis. Posterior superfisial: gastrocnemius, soleus (triceps surae → tendon Achilles), plantaris.","s":"Anatomi Muskuloskeletal sl. 102–105"},{"t":"ana","f":"Vena saphena magna dan parva","b":"Magna: terpanjang, dari arcus venosus dorsalis pedis di depan malleolus medialis, masuk hiatus saphenus ke v. femoralis. Parva: di belakang malleolus lateralis, naik ke fossa poplitea dan bermuara ke v. poplitea.","s":"Anatomi Muskuloskeletal sl. 114"},{"t":"fis","f":"Komponen sistem muskuloskeletal","b":"Otot, tulang, sendi, tendon (menghubungkan otot–tulang), ligamen (menghubungkan tulang–tulang), bursa (kantong jaringan ikat), dan fasia (pembungkus otot, saraf, pembuluh darah).","s":"Sistem Muskuloskeletal sl. 4"},{"t":"fis","f":"Otot sebagai bagian tubuh","b":"Otot membentuk ±43% berat badan; lebih dari 1/3-nya protein tubuh dan setengahnya menjadi tempat aktivitas metabolik saat istirahat.","s":"Sistem Muskuloskeletal sl. 5"},{"t":"fis","f":"Empat sifat fisik otot","b":"Eksitabilitas (merespons rangsang), kontraktilitas (memendek dan menghasilkan tegangan), ekstensibilitas (memanjang tanpa rusak), elastisitas (kembali ke bentuk semula).","s":"Sistem Muskuloskeletal sl. 7"},{"t":"fis","f":"Ciri otot polos","b":"1 inti di tengah, dipersarafi saraf otonom (involunter), tidak berserat lintang, di organ viseral, Ca2+ dari CES, energi terutama aerob, kontraksi lambat, tahan lelah.","s":"Sistem Muskuloskeletal sl. 8"},{"t":"fis","f":"Ciri otot rangka","b":"Banyak inti, dipersarafi saraf motorik somatik (volunter), melekat pada tulang, Ca2+ dari retikulum sarkoplasma, energi aerob dan anaerob, kontraksi cepat, dapat tetani, cepat lelah.","s":"Sistem Muskuloskeletal sl. 9"},{"t":"fis","f":"Ciri otot jantung","b":"1 inti di tengah, dipersarafi saraf otonom (involunter), berserat lintang, hanya di jantung, Ca2+ dari CES dan RS, energi aerob, kontraksi lambat, tidak mengalami tetani, tahan lelah.","s":"Sistem Muskuloskeletal sl. 9"},{"t":"fis","f":"Fungsi sistem otot rangka","b":"Menghasilkan gerakan, mempertahankan sikap tubuh, menyokong jaringan lunak, menjaga pintu masuk–keluar saluran tubuh, mempertahankan suhu tubuh (energi kontraksi menjadi panas).","s":"Sistem Muskuloskeletal sl. 10"},{"t":"fis","f":"Hierarki struktur otot rangka","b":"Otot (epimisium) → fasikulus (perimisium) → serat otot/miosit → miofibril → sarkomer (dibatasi garis Z) → filamen tebal (miosin) dan tipis (aktin).","s":"Sistem Muskuloskeletal sl. 11"},{"t":"fis","f":"Susunan filamen dalam sarkomer","b":"Tiap 1 filamen tipis dikelilingi 3 filamen tebal; tiap 1 filamen tebal dikelilingi 6 filamen tipis.","s":"Sistem Muskuloskeletal sl. 13"},{"t":"fis","f":"Cross bridge vs power stroke","b":"Cross bridge: melekatnya kepala miosin ke binding site di aktin. Power stroke: gerakan fleksi cross bridge yang menarik filamen tipis ke tengah sarkomer; memerlukan energi.","s":"Sistem Muskuloskeletal sl. 13"},{"t":"fis","f":"Komponen serat otot rangka","b":"Sarkolema (membran plasma), retikulum sarkoplasma, sisterna terminalis (tempat Ca2+), tubulus T (invaginasi sarkolema), triad (tubulus T di antara dua sisterna terminalis), mitokondria (sintesis ATP).","s":"Sistem Muskuloskeletal sl. 14"},{"t":"fis","f":"Pelepasan asetilkolin di NMJ","b":"Potensial aksi tiba di terminal akson → kanal Ca2+ terbuka → Ca2+ masuk → vesikel sinaps melekat ke membran → asetilkolin keluar secara eksositosis ke celah sinaps.","s":"Sistem Muskuloskeletal sl. 17–18"},{"t":"fis","f":"Tiga peran ATP pada kontraksi","b":"1) Energi untuk power stroke. 2) Memutus ikatan miosin–aktin setelah power stroke. 3) Energi transpor aktif Ca2+ kembali ke retikulum sarkoplasma.","s":"Sistem Muskuloskeletal sl. 21"},{"t":"fis","f":"Tiga cara resintesis ATP otot","b":"Hidrolisis kreatin fosfat (tercepat, 1 ATP per molekul, cepat habis), glikolisis (2 ATP + piruvat; tanpa O2 → laktat), dan siklus Krebs (asetil-KoA → 36 ATP, butuh O2).","s":"Sistem Muskuloskeletal sl. 22–25"},{"t":"fis","f":"Periode satu kali kontraksi otot","b":"Laten: 0,005–0,01 detik (potensial aksi di tubulus T sampai cross bridge). Kontraksi: 0,04 detik (sarkomer memendek). Relaksasi: 0,05 detik (Ca2+ diserap kembali, cross bridge lepas).","s":"Sistem Muskuloskeletal sl. 26"},{"t":"fis","f":"Intensitas rangsang otot","b":"Subambang: tidak ada kontraksi. Ambang: 1 unit motorik aktif. Di atas ambang: makin banyak unit motorik direkrut. Maksimal: semua unit aktif. Supramaksimal: kekuatan tidak bertambah lagi.","s":"Sistem Muskuloskeletal sl. 29"},{"t":"fis","f":"Gangguan otot dan penyebabnya","b":"Kram: kurang cairan/elektrolit, lelah, ATP tidak cukup. Strain: peregangan berlebih/robekan serat. Tendinitis: pemakaian berulang. Atrofi: tidak dipakai, kerusakan saraf, penuaan.","s":"Sistem Muskuloskeletal sl. 31"},{"t":"fis","f":"Fungsi tulang","b":"Kerangka, sendi, perlekatan otot, pengungkit, menyokong berat badan, proteksi organ, hemopoesis (sumsum merah), imunologi (limfosit B, makrofag), simpanan mineral dan lemak (sumsum kuning).","s":"Sistem Muskuloskeletal sl. 33"},{"t":"fis","f":"Osteoklas","b":"Sel raksasa (20–100 µm) berinti 5–10, berasal dari monosit/makrofag, bertugas meresorpsi tulang sehingga tulang berongga untuk diisi sumsum.","s":"Sistem Muskuloskeletal sl. 35"},{"t":"fis","f":"Osteoblas","b":"Sel pembentuk tulang muda dari osteoprogenitor, berjajar seperti epitel di permukaan tulang; membentuk dan memineralisasi tulang, mengeluarkan kolagen dan garam kalsium, ikut memperbaiki kerusakan tulang.","s":"Sistem Muskuloskeletal sl. 36"},{"t":"fis","f":"Osteosit","b":"Sel tulang dewasa dari osteoblas yang terperangkap dalam lakuna; tonjolannya di kanalikuli terhubung lewat gap junction. Menghasilkan alkali fosfatase untuk melepaskan gugus fosfat.","s":"Sistem Muskuloskeletal sl. 37"},{"t":"fis","f":"Matriks tulang","b":"Organik: glikosaminoglikan (kondroitin, keratan sulfat, asam hialuronat) dan serat kolagen. Anorganik: kalsium, fosfat, sitrat, karbonat, fluorida, hidroksida, magnesium, natrium.","s":"Sistem Muskuloskeletal sl. 38"},{"t":"fis","f":"Pengaruh hormon pada pembentukan sel tulang","b":"Osteoklas dari osteoprogenitor: dipicu hormon tiroid, PTH, GH, ion kalsium. Osteoblas: dipicu kalsitonin, GH, ion fosfor, stres mekanis. Osteosit terbentuk dari osteoblas selama beberapa bulan.","s":"Sistem Muskuloskeletal sl. 40–41"},{"t":"fis","f":"Metabolisme tulang","b":"Dipengaruhi vitamin D, PTH, kalsitonin, GH, hormon tiroid, kadar Ca dan P darah. Aliran darah ke tulang 200–400 ml/menit.","s":"Sistem Muskuloskeletal sl. 42"},{"t":"fis","f":"Membuat preparat saraf-otot katak","b":"Bebaskan n. ischiadicus secara tumpul tanpa terjepit, tertarik, atau terpotong; ikat tendon Achilles, pertahankan m. gastrocnemius utuh. Basahi terus dengan larutan Ringer agar tidak kering.","s":"Praktikum Muskuloskeletal sl. 4–6"},{"t":"fis","f":"Pembungkus jaringan ikat otot","b":"Epimisium membungkus seluruh otot, perimisium membungkus fasikulus, endomisium membungkus tiap serat otot.","s":"Praktikum Muskuloskeletal sl. 20–21"},{"t":"fis","f":"Pemecahan asetilkolin","b":"Kolinesterase mengubah asetilkolin menjadi kolin dan asam asetat. Kolin berdifusi kembali ke akson, asam asetat masuk ke sirkulasi darah.","s":"Praktikum Muskuloskeletal sl. 33"},{"t":"fis","f":"Empat jenis stimulus otot","b":"Mekanis (memijit, memukul, menarik, mencubit), thermis (panas, dingin), khemis (asam, basa, garam), elektris (arus listrik). Elektris terbaik karena intensitas, frekuensi, dan durasinya dapat diatur.","s":"Praktikum Muskuloskeletal sl. 48"},{"t":"fis","f":"Istilah intensitas rangsang","b":"Subminimal/subliminal: belum menimbulkan respons. Minimal/liminal/threshold: rangsang terkecil yang menimbulkan respons. Submaksimal: antara minimal dan maksimal. Maksimal: respons terbesar. Supramaksimal: lebih kuat tapi respons sama dengan maksimal.","s":"Praktikum Muskuloskeletal sl. 49"},{"t":"fis","f":"Hukum all or none","b":"Berlaku untuk satu serabut otot, serta otot jantung dan polos. Tidak berlaku untuk otot rangka secara keseluruhan karena terdiri dari banyak serabut (unit motorik direkrut bertahap).","s":"Praktikum Muskuloskeletal sl. 50"},{"t":"fis","f":"Sumasi: kapan rangsang kedua diberikan?","b":"Saat periode laten: tidak ada respons tambahan. Tepat setelah kontraksi selesai: dua kontraksi tunggal berturut-turut. Saat relaksasi: kontraksi tambahan yang lebih tinggi, sama, atau lebih rendah (sumasi).","s":"Praktikum Muskuloskeletal sl. 51"},{"t":"fis","f":"Treppe, tetanus inkomplet, tetanus komplet","b":"Rangsang berulang dengan intensitas sama: treppe (kontraksi makin kuat, relaksasi masih ada). >30 kali dengan relaksasi masih terlihat: tetanus inkomplet (klonus). >50 kali tanpa relaksasi: tetanus komplet.","s":"Praktikum Muskuloskeletal sl. 52"},{"t":"bio","f":"Otot sebagai mesin biokimia","b":"Mengubah energi kimia menjadi energi mekanis. Massa otot ±25% massa tubuh saat lahir, >40% pada dewasa muda, <30% pada lansia; tersusun dari 75% air dan >20% protein.","s":"Biokimia Otot sl. 3"},{"t":"bio","f":"Isi sarkoplasma","b":"Glikogen, ATP, fosfokreatin, dan enzim-enzim glikolisis.","s":"Biokimia Otot sl. 5"},{"t":"bio","f":"Letak filamen dalam sarkomer","b":"Filamen tebal (miosin) terbatas di pita A. Filamen tipis (aktin, tropomiosin, troponin) di pita I dan memanjang ke pita A, tetapi tidak sampai zona H.","s":"Biokimia Otot sl. 7"},{"t":"bio","f":"Tiga subunit troponin","b":"Troponin T: mengikat tropomiosin dan dua troponin lain. Troponin I: menghambat interaksi F-aktin–miosin. Troponin C: polipeptida pengikat kalsium.","s":"Biokimia Otot sl. 8"},{"t":"bio","f":"Struktur miosin","b":"Ekor fibrosa (α-heliks) dan kepala globular (S-1) yang memiliki situs pengikat aktin dan situs ATPase, disertai rantai ringan (light chain). Dipotong menjadi meromiosin berat (HMM) dan ringan (LMM).","s":"Biokimia Otot sl. 9"},{"t":"bio","f":"Siklus kontraksi–relaksasi (Harper)","b":"Relaksasi: S-1 menghidrolisis ATP → ADP + Pi tetap terikat. Kontraksi: S-1 mengikat aktin → aktin-miosin-ADP-Pi → Pi lepas → power stroke (aktin ditarik ±10 nm) → ADP lepas → aktin-miosin. ATP baru mengikat → miosin-ATP lepas dari aktin.","s":"Biokimia Otot sl. 11"},{"t":"bio","f":"Kontraksi otot polos","b":"Ca2+ (dari CES dan RS) berikatan dengan kalmodulin → mengaktifkan myosin light chain kinase (MLCK) → fosforilasi rantai ringan miosin → aktivitas ATPase miosin naik → cross bridge bergeser.","s":"Biokimia Otot sl. 14"},{"t":"bio","f":"Kontraksi otot jantung","b":"Adrenalin → reseptor β1 → Gs → adenilat siklase → cAMP naik → PKA → Ca2+ masuk lewat kanal tipe L dan dilepas dari RS → kontraksi lebih kuat. Asetilkolin (parasimpatis) memicu relaksasi.","s":"Biokimia Otot sl. 17–18"},{"t":"bio","f":"Protein transmembran pengatur Ca2+","b":"Kanal Ca2+, penukar Na+–Ca2+ (1 Ca2+ keluar untuk 3 Na+ masuk; rute utama pengeluaran Ca2+ miosit), dan Ca2+-ATPase sarkolema.","s":"Biokimia Otot sl. 19"},{"t":"bio","f":"Kreatin dan kreatin fosfat","b":"Kreatin disintesis dari arginin, glisin/lisin, dan metionin, atau dari protein hewani. ±90% disimpan di otot: 40% kreatin bebas, 60% kreatin fosfat. Otot istirahat mengandung kreatin fosfat 5× ATP.","s":"Biokimia Otot sl. 22–23"},{"t":"bio","f":"Reaksi kreatin kinase","b":"Kreatin fosfat + ADP ⇌ kreatin + ATP, dikatalisis kreatin kinase, bersifat reversibel dan berlangsung dalam sepersekian detik. Sebagian kreatin terdegradasi menjadi kreatinin.","s":"Biokimia Otot sl. 23"},{"t":"bio","f":"Fosforilasi oksidatif vs glikolisis","b":"Fosforilasi oksidatif butuh O2 (dibawa Hb, disimpan mioglobin), sumber glukosa dan asam lemak, 1 glukosa → 32 ATP, tapi lambat. Bila tidak mencukupi → glikolisis: 8 ATP aerob, 2 ATP anaerob.","s":"Biokimia Otot sl. 24"},{"t":"bio","f":"Enzim utama aktivitas otot","b":"Kreatin kinase (fosfat dari kreatin fosfat ke ADP), ATPase miosin (memecah ATP untuk kontraksi), laktat dehidrogenase (piruvat ⇌ laktat), asetilkolinesterase (memecah asetilkolin di celah sinaps).","s":"Biokimia Otot sl. 25"},{"t":"bio","f":"Distribusi kalsium tubuh","b":">99% di tulang sebagai hidroksiapatit [3Ca3(PO4)2·Ca(OH)2]; 1% intra- dan ekstrasel. Sumber: sayuran hijau, daging, kuning telur, ikan, udang, olahan susu.","s":"Biokimia Otot sl. 26"},{"t":"bio","f":"Kalbindin","b":"Protein pengikat kalsium intrasel di usus yang sintesisnya diinduksi vitamin D aktif (1,25-dihidroksikolekalsiferol); diperlukan untuk absorpsi kalsium.","s":"Biokimia Otot sl. 28"},{"t":"osp","f":"Osteoporosis: definisi","b":"Berkurangnya massa tulang dan rusaknya mikroarsitektur tulang sehingga tulang berpori dan mudah patah. Dikenal sebagai \"silent disease\": tanpa gejala tapi progresif.","s":"Osteoporosis sl. 2, 17"},{"t":"osp","f":"Puncak pembentukan massa tulang","b":"Usia 20–25 tahun pembentukan tulang mencukupi untuk mengganti tulang yang rusak. Usia 30 tahun adalah masa puncak pembentukan tulang; setelah >30 tahun pembentukan tulang menurun.","s":"Osteoporosis sl. 2"},{"t":"osp","f":"Kadar kalsium darah normal","b":"Dewasa: 8,8–10,4 mg/dl. Anak-anak: 6,7–10,7 mg/dl.","s":"Osteoporosis sl. 10"},{"t":"osp","f":"Kebutuhan kalsium harian (FAO/WHO)","b":"Remaja 10–18 tahun: 1.300 mg. Perempuan 19 tahun–menopause: 1.000 mg; setelah menopause: 1.300 mg; hamil 1.200 mg; menyusui 1.000 mg. Laki-laki 19–65 tahun: 1.000 mg; >65 tahun: 1.300 mg.","s":"Osteoporosis sl. 7"},{"t":"osp","f":"Faktor risiko osteoporosis (daftar)","b":"Merokok, kurang aktivitas, berat badan rendah, herediter, asupan kalsium rendah, alkohol, perempuan > laki-laki, usia >70 tahun, ras Asia/kulit putih, obat (kortikosteroid, barbiturat).","s":"Osteoporosis sl. 11"},{"t":"osp","f":"Penggolongan faktor risiko osteoporosis","b":"Risiko tinggi: imobilitas jangka lama (misalnya kelumpuhan pascastroke). Risiko sedang: badan kurus, alkohol, steroid/suntik KB jangka lama, amenore laktasi, kortison dan obat OA jangka lama. Risiko rendah: rokok, kurang aktivitas fisik, kurang kalsium.","s":"Osteoporosis sl. 13"},{"t":"osp","f":"Efek steroid pada tulang","b":"Pembentukan tulang menurun (osteoblas terhambat, testosteron dan androgen adrenal turun), resorpsi osteoklas meningkat, absorpsi kalsium usus menurun, ekskresi kalsium urin meningkat → kalsium turun → PTH naik → osteoporosis.","s":"Osteoporosis sl. 12"},{"t":"osp","f":"Osteoporosis pascamenopause (tipe I)","b":"Terjadi 5–20 tahun setelah menopause (usia 55–75 tahun) akibat defisiensi estrogen. Fraktur khas: vertebra, Colles, dan berkurangnya gigi geligi.","s":"Osteoporosis sl. 14"},{"t":"osp","f":"Osteoporosis senilis (tipe II)","b":"Akibat kekurangan kalsium terkait usia dan ketidakseimbangan resorpsi dengan pembentukan tulang. Pada pria dan wanita usia ≥70 tahun. Fraktur khas: panggul.","s":"Osteoporosis sl. 15"},{"t":"osp","f":"Osteoporosis sekunder dan juvenil","b":"Sekunder (±5%): GGK, Paget, osteomalasia, hipertiroid, hiperparatiroid, gangguan adrenal, kortikosteroid, barbiturat. Juvenil idiopatik: penyebab tidak diketahui, pada anak dan dewasa muda.","s":"Osteoporosis sl. 16"},{"t":"osp","f":"Gejala dan tanda osteoporosis","b":"Tinggi badan berkurang, postur bungkuk (kifosis torakal/dowager hump), nyeri punggung, leher, dan tulang. Sering baru diketahui setelah fraktur: Colles, kolum femur, atau vertebra.","s":"Osteoporosis sl. 17–18"},{"t":"osp","f":"Pemeriksaan laboratorium osteoporosis","b":"Serum puasa: Ca, PO4, alkali fosfatase; fungsi tiroid, hati, ginjal; kalsium urin 24 jam. PTH diperiksa bila dicurigai hiperparatiroidisme.","s":"Osteoporosis sl. 19"},{"t":"osp","f":"Foto X-ray pada osteoporosis","b":"Kelainan baru terlihat jelas bila osteoporosis sudah lanjut (BMD < −2,5). Tampak densitas berkurang dan korteks menipis.","s":"Osteoporosis sl. 20"},{"t":"osp","f":"Alat ukur densitas tulang (BMD)","b":"SXA, DEXA (DXA, baku emas), SPA, DPA, QCT, dan QUS (USG, misalnya Sonost di tulang calcaneus).","s":"Osteoporosis sl. 21, 24–25"},{"t":"osp","f":"Interpretasi T-score","b":"≥ −1: normal. Antara −1 dan −2,5: osteopenia. ≤ −2,5: osteoporosis. ≤ −4: osteoporosis berat.","s":"Osteoporosis sl. 23"},{"t":"osp","f":"Tujuan terapi osteoporosis","b":"Simptomatis (mengurangi nyeri), menghambat resorpsi tulang, dan meningkatkan pembentukan tulang untuk memperkuat tulang.","s":"Osteoporosis sl. 26"},{"t":"osp","f":"Terapi osteoporosis","b":"Nonmedikamentosa: hindari rokok dan alkohol, olahraga. Hormonal: estrogen (masih pro-kontra), estrogen + progesteron, testosteron. Nonhormonal: bisfosfonat, kalsium, vitamin D/kalsitriol.","s":"Osteoporosis sl. 28"},{"t":"osp","f":"Edukasi pasien osteoporosis","b":"Jangan membungkuk atau mengangkat berat; cegah jatuh (lantai, penerangan, tata perabot, pintu kamar mandi); keluar rumah sebaiknya ditemani.","s":"Osteoporosis sl. 29"},{"t":"osp","f":"Tiga sel tulang utama","b":"Osteoklas: sel raksasa yang meresorpsi tulang. Osteoblas: mensintesis matriks baru (osteoid) yang kemudian dimineralisasi. Osteosit: osteoblas yang terperangkap di matriks, sensor tekanan mekanis.","s":"Farmakologi Homeostasis Tulang sl. 5"},{"t":"osp","f":"Siklus remodeling tulang","b":"Istirahat → aktivasi (osteosit merekrut osteoklas) → resorpsi → pembalikan (osteoklas apoptosis) → pembentukan (osteoblas mengisi rongga). Ketidakseimbangan resorpsi–formasi menyebabkan osteoporosis.","s":"Farmakologi Homeostasis Tulang sl. 6"},{"t":"osp","f":"Tiga hormon pengatur kalsium","b":"PTH (paratiroid): menaikkan Ca darah lewat osteoklas, reabsorpsi ginjal, aktivasi vitamin D. Kalsitriol: terutama meningkatkan absorpsi Ca usus. Kalsitonin (tiroid): menurunkan Ca darah dengan menghambat osteoklas.","s":"Farmakologi Homeostasis Tulang sl. 7"},{"t":"osp","f":"Umpan balik kalsium darah","b":"Ca rendah → PTH → resorpsi tulang dan aktivasi vitamin D → Ca naik. Ca tinggi → kalsitonin → PTH turun → Ca disimpan di tulang atau diekskresi ginjal.","s":"Farmakologi Homeostasis Tulang sl. 8"},{"t":"osp","f":"RANKL, RANK, dan OPG","b":"RANKL memicu diferensiasi dan aktivasi osteoklas lewat reseptor RANK pada prekursor osteoklas. OPG (osteoprotegerin) adalah reseptor umpan yang menghambat RANKL. Rasio RANKL/OPG menentukan laju resorpsi.","s":"Farmakologi Homeostasis Tulang sl. 9"},{"t":"oml","f":"Sumber vitamin D3 dan D2","b":"D3 (kolekalsiferol): dibuat di kulit dari 7-dehidrokolesterol oleh UV-B, atau dari makanan hewani (ikan berlemak, kuning telur). D2 (ergokalsiferol): dari ergosterol tanaman dan jamur.","s":"Farmakologi Homeostasis Tulang sl. 10"},{"t":"oml","f":"Aktivasi vitamin D","b":"Hati (25-hidroksilase, CYP2R1/CYP27A1) → 25(OH)D/kalsidiol, bentuk sirkulasi dan penanda status. Ginjal (1α-hidroksilase, CYP27B1) → 1,25(OH)2D/kalsitriol, bentuk aktif. Inaktivasi oleh 24-hidroksilase (CYP24A1).","s":"Farmakologi Homeostasis Tulang sl. 11"},{"t":"oml","f":"Mekanisme kerja kalsitriol","b":"Genomik: kalsitriol + VDR inti → heterodimer dengan RXR → berikatan dengan VDRE di DNA → mengatur transkripsi. Non-genomik: lewat VDR membran, cepat (misalnya masuknya Ca lewat kanal ion).","s":"Farmakologi Homeostasis Tulang sl. 13"},{"t":"oml","f":"Efek kalsitriol","b":"Meningkatkan absorpsi Ca dan fosfat di usus, menjaga homeostasis mineral, mendukung mineralisasi tulang bersama PTH, dan meningkatkan reabsorpsi Ca dan fosfat di ginjal.","s":"Farmakologi Homeostasis Tulang sl. 14"},{"t":"oml","f":"Status vitamin D dan dosis","b":"Optimal: 25(OH)D ≥32 ng/ml; insufisiensi <32 ng/ml. Dosis pemeliharaan 1.000–5.000 IU/hari. Defisiensi berat: 10.000–60.000 IU (dengan fosfat).","s":"Farmakologi Homeostasis Tulang sl. 15"},{"t":"oml","f":"Toksisitas vitamin D","b":"Menyebabkan hiperkalsemia: ringan 10,5–11,9; sedang 12–13,9; berat ≥14 mg/dl (darurat). Komplikasi: kalsifikasi jaringan lunak dan pembuluh darah, batu ginjal, gagal ginjal, aritmia.","s":"Farmakologi Homeostasis Tulang sl. 16"},{"t":"oa","f":"Osteoartritis: definisi","b":"Penyakit sendi degeneratif yang berkaitan dengan kerusakan kartilago (rawan) sendi.","s":"Osteoartritis sl. 2"},{"t":"oa","f":"Prevalensi OA lutut di Indonesia","b":"OA lutut radiologis: 15,5% pada pria dan 12,7% pada wanita usia 40–60 tahun.","s":"Osteoartritis sl. 3"},{"t":"oa","f":"Sumber nyeri pada OA","b":"Multifaktorial: regangan saraf periosteum, hipertensi intraoseus dan intraartikular, regangan kapsul dan ligamen, mikrofraktur subkondral, entesopati, bursitis, spasme otot.","s":"Osteoartritis sl. 4"},{"t":"oa","f":"Gejala khas OA (anamnesis)","b":"Mulai usia dewasa: kaku sendi pagi atau setelah istirahat (singkat), pembengkakan tulang, krepitus saat digerakkan, keterbatasan gerak. Peradangan tidak ada atau sangat ringan.","s":"Osteoartritis sl. 8"},{"t":"oa","f":"Faktor risiko OA","b":"Bertambahnya usia, riwayat keluarga OA generalisata, aktivitas fisik berat, obesitas, trauma sebelumnya, deformitas sendi.","s":"Osteoartritis sl. 9"},{"t":"oa","f":"Pemeriksaan fisik OA","b":"BMI, gaya berjalan, atrofi otot, efusi, ROM, nyeri gerak, krepitus, deformitas, nyeri tekan, nodus Bouchard (PIP) dan Heberden (DIP), instabilitas sendi.","s":"Osteoartritis sl. 10"},{"t":"oa","f":"Laboratorium pada OA","b":"Tidak ada pemeriksaan darah khusus untuk OA. Darah dipakai untuk menyingkirkan diagnosis lain dan memantau terapi.","s":"Osteoartritis sl. 12"},{"t":"oa","f":"Gambaran radiologis OA","b":"Penyempitan celah sendi asimetris, sklerosis subkondral, kista tulang, osteofit, perubahan struktur sendi.","s":"Osteoartritis sl. 13"},{"t":"oa","f":"Klasifikasi OA","b":"Etiologi: primer (idiopatik) dan sekunder (metabolik, kelainan anatomi, trauma, inflamasi). Lokasi: tangan, lutut, panggul, kaki, vertebra, dan sendi lain (glenohumeral, akromioklavikular, sakroiliaka, TMJ).","s":"Osteoartritis sl. 16–18"},{"t":"oa","f":"Kriteria ACR OA lutut (klinis + radiologis)","b":"Nyeri lutut + osteofit + minimal 1 dari: kaku sendi <30 menit, usia ≥50 tahun, krepitus pada gerakan aktif. Sensitivitas 91%, spesifisitas 86%.","s":"Osteoartritis sl. 21"},{"t":"oa","f":"Kriteria ACR OA lutut (klinis + laboratoris)","b":"Nyeri lutut + ≥5 dari 9: usia ≥50, kaku <30 menit, krepitus, nyeri tekan tepi tulang, pembesaran tulang, sinovium tidak hangat, LED <40 mm/jam, RF <1:40, cairan sinovium sesuai OA.","s":"Osteoartritis sl. 22"},{"t":"oa","f":"Kriteria ACR OA panggul (klinis, lab, radiologis)","b":"Nyeri panggul + ≥2 dari 3: LED <20 mm/jam, osteofit femoral dan/atau asetabular, penyempitan celah sendi (superior, aksial, dan/atau medial).","s":"Osteoartritis sl. 24"},{"t":"oa","f":"Derajat OA (Kellgren–Lawrence)","b":"0: normal. 1: osteofit minimal. 2: osteofit di 2 tempat, tanpa sklerosis/kista, celah baik. 3: osteofit moderat, deformitas ujung tulang, celah sempit. 4: osteofit besar, celah hilang, sklerosis dan kista subkondral.","s":"Osteoartritis sl. 25–26"},{"t":"oa","f":"Tujuan tatalaksana OA","b":"Mengendalikan nyeri, mengoptimalkan fungsi sendi, mengurangi keterbatasan aktivitas, meningkatkan kualitas hidup, menghambat progresivitas, mencegah komplikasi. Belum ada terapi yang menyembuhkan OA.","s":"Osteoartritis sl. 27–28"},{"t":"oa","f":"Terapi nonfarmakologis OA","b":"Edukasi, modifikasi gaya hidup, turunkan BB minimal 5% bila BMI >25 (target 18,5–25), aerobik low impact, terapi fisik (ROM, penguatan quadriceps), tongkat di sisi sehat, terapi okupasi (proteksi sendi, splint).","s":"Osteoartritis sl. 29"},{"t":"oa","f":"Terapi farmakologis OA","b":"Asetaminofen (<4 g/hari), OAINS, penghambat COX-2, injeksi glukokortikoid intraartikular, hialuronan intraartikular. Bila ada efusi atau bursitis: pungsi/aspirasi.","s":"Osteoartritis sl. 30"},{"t":"oa","f":"Kapan OA dirujuk ke ortopedi?","b":"Gagal terapi konvensional (nyeri menetap/memberat), keluhan progresif mengganggu aktivitas dan tidur, deformitas varus/valgus >15–20° pada lutut, subluksasi atau dislokasi.","s":"Osteoartritis sl. 31"},{"t":"oa","f":"OA pada foto polos (radiologi)","b":"OA adalah penyakit rawan sendi hialin: penyempitan celah sendi tidak seragam (lutut: medial > lateral; panggul: superior), asimetris, progresif, dengan sklerosis subkortikal dan osteofit.","s":"Musculoskeletal Imaging sl. 35–47"},{"t":"rem","f":"Artritis reumatoid: definisi","b":"Penyakit autoimun dengan inflamasi sistemik kronik dan progresif yang terutama menyerang sendi. Diagnosis dan terapi sedini mungkin menurunkan progresivitas.","s":"Penyakit Tulang & Sendi sl. 4"},{"t":"rem","f":"Kompetensi SKDI: RA dan gout","b":"RA: 3A. Artritis gout akut: 4A (tuntas oleh dokter umum). Artritis gout kronik: 3A.","s":"Penyakit Tulang & Sendi sl. 2"},{"t":"rem","f":"Faktor risiko RA","b":"Meningkatkan risiko: perempuan, riwayat keluarga, usia lebih tua, merokok, paparan silika, gingivitis. Menurunkan risiko: berhenti merokok, hindari silika, cegah radang gusi.","s":"Penyakit Tulang & Sendi sl. 6"},{"t":"rem","f":"Mengapa RA membaik saat hamil?","b":"1) Aloantibodi maternal menyerang HLA-DR. 2) CRH plasenta merangsang sekresi DHEA (androgen utama wanita) yang bersifat imunosupresif.","s":"Penyakit Tulang & Sendi sl. 6"},{"t":"rem","f":"Patogenesis RA","b":"Interaksi genetik dan lingkungan; berhubungan dengan HLA-DR4. Infiltrasi limfosit, sel plasma, sel dendritik, makrofag di sinovium. Sel T CD4+ (Th1, Th17) berperan sentral → sitokin TNF, IL-1, IL-6, dan autoantibodi (RF).","s":"Penyakit Tulang & Sendi sl. 9"},{"t":"rem","f":"Gejala klinis RA","b":"Poliartritis simetris dengan nyeri >6 minggu, bengkak dan hangat, morning stiffness >1 jam. Sendi tersering: MCP, pergelangan tangan, PIP, siku, bahu, panggul, lutut. DIP, sakroiliaka, dan vertebra jarang terkena, kecuali C1–C2.","s":"Penyakit Tulang & Sendi sl. 13"},{"t":"rem","f":"Komplikasi vertebra pada RA","b":"Subluksasi atlantoaksial (C1–C2) sering terjadi dan dapat menyebabkan mielopati.","s":"Penyakit Tulang & Sendi sl. 13"},{"t":"rem","f":"Deformitas swan-neck vs boutonnière","b":"Swan-neck: hiperekstensi PIP + fleksi DIP. Boutonnière: fleksi PIP + hiperekstensi DIP.","s":"Penyakit Tulang & Sendi sl. 14"},{"t":"rem","f":"Deformitas lain pada RA","b":"Deviasi ulnar (MCP dan jari ke ulnar), piano-key (styloid ulna naik-turun), Z-thumb, artritis mutilans (opera-glass hand), hallux valgus.","s":"Penyakit Tulang & Sendi sl. 14"},{"t":"rem","f":"Manifestasi ekstraartikular RA (1)","b":"Konstitusional: demam, lemah, limfadenopati. Kulit: nodul reumatoid, vaskulitis. Mata: Sjögren, skleritis, episkleritis. Jantung: perikarditis. Paru: pleuritis, fibrosis interstisial, sindrom Caplan.","s":"Penyakit Tulang & Sendi sl. 21"},{"t":"rem","f":"Manifestasi ekstraartikular RA (2)","b":"Hematologi: anemia penyakit kronik, trombositosis, eosinofilia, sindrom Felty. Saraf: entrapment neuropati, mielopati. Ginjal: amiloidosis, RTA. Metabolik: osteoporosis.","s":"Penyakit Tulang & Sendi sl. 22"},{"t":"rem","f":"Kriteria ACR/EULAR 2010: skor sendi","b":"1 sendi besar = 0; 2–10 sendi besar = 1; 1–3 sendi kecil = 2; 4–10 sendi kecil = 3; >10 sendi (minimal 1 kecil) = 5.","s":"Penyakit Tulang & Sendi sl. 23"},{"t":"rem","f":"Kriteria ACR/EULAR 2010: serologi, APR, durasi","b":"Serologi: RF dan ACPA negatif 0; positif rendah 2; positif tinggi (>3× BAN) 3. LED/CRP abnormal = 1. Sakit ≥6 minggu = 1. Skor ≥6 = RA definitif.","s":"Penyakit Tulang & Sendi sl. 23"},{"t":"rem","f":"RF vs anti-CCP","b":"RF negatif pada 30% RA dini dan bisa positif palsu (SLE, skleroderma, keganasan, sarkoidosis, infeksi). Anti-CCP lebih spesifik, berkorelasi dengan perburukan, dan lebih sensitif bila dikombinasi RF. Bila keduanya negatif: anti-RA33.","s":"Penyakit Tulang & Sendi sl. 24"},{"t":"rem","f":"Radiologi RA","b":"Awal: pembengkakan jaringan lunak, penyempitan celah sendi, osteopenia periartikular. Lanjut: erosi periartikular (MCP, PIP, MTP, pergelangan tangan). MRI dan USG lebih sensitif untuk erosi dan sinovitis.","s":"Penyakit Tulang & Sendi sl. 25"},{"t":"rem","f":"Prinsip pengobatan RA","b":"Kurangi nyeri dan inflamasi, pertahankan fungsi, kendalikan progresivitas. Pendekatan piramid terbalik: DMARD sedini mungkin.","s":"Penyakit Tulang & Sendi sl. 27"},{"t":"rem","f":"Peran OAINS dan steroid pada RA","b":"OAINS: terapi awal nyeri dan bengkak, tidak mengubah perjalanan penyakit sehingga tidak boleh dipakai tunggal. Steroid dosis rendah (<10 mg/hari ekuivalen prednison) sebagai bridging, lalu dihentikan perlahan.","s":"Penyakit Tulang & Sendi sl. 28"},{"t":"rem","f":"Prediktor prognosis buruk RA","b":"Skor fungsional rendah, sosioekonomi rendah, riwayat keluarga, banyak sendi terlibat, CRP/LED tinggi di awal, RF/anti-CCP positif, perubahan radiologis dini, manifestasi ekstraartikular.","s":"Penyakit Tulang & Sendi sl. 29"},{"t":"rem","f":"Hiperurisemia: batas","b":"Asam urat >7 mg/dl pada pria dan >6 mg/dl pada wanita. Deposit kristal monosodium urat (MSU) berbentuk jarum menimbulkan artritis gout, tofus, dan nefropati.","s":"Penyakit Tulang & Sendi sl. 30"},{"t":"rem","f":"Gout akut: gambaran klinis","b":"Onset sangat cepat (tidur tanpa gejala, bangun dengan nyeri hebat). Monoartikular di MTP-1 (podagra): nyeri, bengkak, merah, hangat, bisa demam. Pencetus: trauma, diet tinggi purin, alkohol.","s":"Penyakit Tulang & Sendi sl. 30"},{"t":"rem","f":"Diagnosis gout (ACR)","b":"Kristal MSU di cairan sendi, atau kristal MSU di tofus, atau ≥6 dari 12 kriteria klinis-laboratoris-radiologis (misalnya inflamasi maksimal hari pertama, MTP-1, hiperurisemia, tofus).","s":"Penyakit Tulang & Sendi sl. 31"},{"t":"rem","f":"Edukasi dan diet gout","b":"Turunkan BB, hidrasi cukup, stop alkohol, stop obat yang menaikkan asam urat (tiazid, etambutol, pirazinamid, asetosal, siklosporin). Diet rendah purin: hindari jeroan, seafood, minuman bersoda.","s":"Penyakit Tulang & Sendi sl. 32"},{"t":"rem","f":"Terapi gout akut","b":"Pilihan pertama bila onset <12 jam: kolkisin. Alternatif: OAINS (indometasin), kortikosteroid oral atau injeksi intraartikular. Obat penurun asam urat tidak dimulai saat serangan akut, tetapi dilanjutkan bila sudah rutin.","s":"Penyakit Tulang & Sendi sl. 32–33"},{"t":"rem","f":"Gout interkritikal dan kronik","b":"Profilaksis kolkisin 0,5–1 mg/hari selama 6 bulan saat memulai penurun asam urat. Target asam urat <6 mg/dl; <5 mg/dl pada gout berat (tofus, artropati kronik). Dosis penurun asam urat dimulai rendah lalu dititrasi.","s":"Penyakit Tulang & Sendi sl. 34"},{"t":"rem","f":"RA pada foto polos (radiologi)","b":"RA adalah penyakit sinovium: penyempitan celah sendi seragam, erosi marginal dan sentral, osteopenia periartikular, distribusi simetris (mirror image).","s":"Musculoskeletal Imaging sl. 48–51"},{"t":"rem","f":"Gout dan CPPD pada foto polos","b":"Gout: celah sendi relatif terjaga, erosi tegas bertepi sklerotik dengan tepi menggantung (\"rat bite\"), tersering di MTP-1, muncul setelah 6–10 tahun. CPPD: kondrokalsinosis (lutut, simfisis, TFC pergelangan).","s":"Musculoskeletal Imaging sl. 52–57"},{"t":"rem","f":"Osteofit vs sindesmofit","b":"Osteofit: dari sudut korpus vertebra, arah horizontal (penyakit degeneratif). Sindesmofit: tipis, vertikal sepanjang anulus fibrosus, multilevel → bamboo spine pada ankilosing spondilitis.","s":"Musculoskeletal Imaging sl. 39–42"},{"t":"neo","f":"Jaringan parenkim vs mesenkimal","b":"Parenkim: sel fungsional utama organ (hepatosit, epitel kelenjar, neuron). Mesenkimal: jaringan penunjang dari mesenkim (tulang, otot, lemak, pembuluh darah, saraf perifer). Tumor ganas mesenkimal disebut sarkoma.","s":"Neoplasma sl. 2–3"},{"t":"neo","f":"Kista epidermal","b":"Nodul bulat, kenyal, berbatas tegas, melekat di kulit tapi bisa digerakkan, di wajah/leher/badan. Histologi: epitel skuamosa berkeratin dengan lapisan granular, lumen berisi keratin lamelar.","s":"Neoplasma sl. 5–6"},{"t":"neo","f":"Kista ganglion","b":"Lesi tumor-like di sekitar sendi atau tendon, transiluminasi positif, ukurannya berhubungan dengan aktivitas.","s":"Neoplasma sl. 7"},{"t":"neo","f":"Kista popliteal (Baker)","b":"Kista berisi cairan di fossa poplitea yang berhubungan dengan kelainan sendi lutut (misalnya OA). Tegang saat lutut ekstensi, lunak saat fleksi. Diagnosis banding penting: DVT.","s":"Neoplasma sl. 8, 24"},{"t":"neo","f":"Lipoma","b":"Tumor jinak tersering, dari jaringan adiposa. Benjolan lunak, berbatas tegas, mobile, tidak nyeri, tumbuh lambat (leher, bahu, punggung, ekstremitas). Histologi: adiposit matur berlobus dengan septa tipis, tanpa atipia.","s":"Neoplasma sl. 9–10"},{"t":"neo","f":"Liposarkoma","b":"Tumor ganas dengan diferensiasi lemak, usia 40–60 tahun, di jaringan lunak dalam (paha, retroperitoneum). Subtipe WHO: well-differentiated (ALT), dedifferentiated, miksoid, pleomorfik, miksoid pleomorfik. Ciri histologi: lipoblas.","s":"Neoplasma sl. 11–12"},{"t":"neo","f":"Fibroma jaringan lunak","b":"Tumor jinak fibroblas dan kolagen; massa tumbuh lambat, tegas, kenyal-padat, putih keabuan, potongan berserat. Sel spindel seragam di antara berkas kolagen padat.","s":"Neoplasma sl. 13"},{"t":"neo","f":"Fibrosarkoma","b":"Tumor ganas fibroblastik, usia 30–60 tahun (ada tipe infantil), di jaringan lunak dalam paha dan tungkai. Makroskopis fish-flesh; mikroskopis sel spindel ganas berpola herringbone.","s":"Neoplasma sl. 14"},{"t":"neo","f":"Rhabdomyoma vs rhabdomyosarcoma","b":"Rhabdomyoma: jinak, diferensiasi otot rangka, di kepala-leher dan jantung (bayi/anak). Rhabdomyosarcoma: ganas, terutama anak dan remaja, di kepala-leher (orbita, nasofaring), traktus genitourinarius, dan ekstremitas.","s":"Neoplasma sl. 15–16"},{"t":"neo","f":"Osteoma","b":"Tumor jinak dari tulang matur (kompak atau spongiosa), usia 20–50 tahun, terutama di tulang kraniofasial (sinus frontal dan etmoid, mandibula). Tumbuh lambat, tidak nyeri, sering insidental.","s":"Neoplasma sl. 17"},{"t":"neo","f":"Osteosarkoma","b":"Tumor ganas primer tulang yang membentuk osteoid; usia 10–25 tahun (puncak kedua usia lanjut), di metafisis distal femur, proksimal tibia, proksimal humerus. Radiologi: litik-sklerotik, sunburst, segitiga Codman; metastasis paru.","s":"Neoplasma sl. 18, 23"},{"t":"neo","f":"Sarkoma Ewing","b":"Tumor small round blue cell, usia 5–20 tahun, di diafisis/metadiafisis tulang panjang, pelvis, iga. Nyeri, bengkak, bisa demam dan LED tinggi. Radiologi: lesi litik dengan reaksi periosteal onion skin.","s":"Neoplasma sl. 19, 25"},{"t":"neo","f":"Kondroma (enkondroma)","b":"Tumor jinak dari tulang rawan hialin matur, usia 20–50 tahun, terutama di tulang kecil tangan dan kaki (falang, metakarpal). Umumnya asimtomatik; bisa menyebabkan fraktur patologis.","s":"Neoplasma sl. 20"},{"t":"neo","f":"Kondrosarkoma","b":"Tumor ganas penghasil matriks kondroid, usia 40–70 tahun, di pelvis, femur dan humerus proksimal, iga, skapula. Massa berlobus putih kebiruan, dapat berkalsifikasi.","s":"Neoplasma sl. 21"},{"t":"neo","f":"Schwannoma, hemangioma, angiosarkoma","b":"Schwannoma: tumor jinak selubung saraf dari sel Schwann. Hemangioma: tumor jinak pembuluh darah, merah-kebiruan. Angiosarkoma: tumor ganas endotel, infiltratif dengan perdarahan dan nekrosis.","s":"Neoplasma sl. 22"},{"t":"trm","f":"Fraktur: definisi","b":"Diskontinuitas jaringan tulang (korteks), tulang rawan sendi, atau tulang rawan epifisis; bisa parsial (inkomplet) atau total (komplet).","s":"Fraktur sl. 2"},{"t":"trm","f":"Fraktur stres (contoh)","b":"Akibat trauma berulang di satu tempat: fraktur metatarsal II (march fracture) pada tentara, fibula pada pelari, tibia pada penari balet, kolum femur pada aktivitas fisik berat.","s":"Fraktur sl. 4"},{"t":"trm","f":"Fraktur patologis: penyebab","b":"Tulang sudah lemah akibat osteoporosis, osteodistrofi paratiroid, penyakit Paget, tumor tulang, atau osteomalasia nutrisi.","s":"Fraktur sl. 5"},{"t":"trm","f":"Klasifikasi klinis fraktur","b":"Tertutup (simple): fragmen tidak berhubungan dengan lingkungan luar. Terbuka (compound): fragmen berhubungan dengan lingkungan luar. Dengan komplikasi: infeksi, malunion, delayed union, nonunion.","s":"Fraktur sl. 6"},{"t":"trm","f":"Klasifikasi Gustilo–Anderson","b":"I: luka <1 cm. II: luka >1 cm, kerusakan jaringan lunak minimal. IIIA: kerusakan luas, periosteum utuh. IIIB: kerusakan luas, periosteum rusak, kominutif. IIIC: disertai cedera arteri.","s":"Fraktur sl. 10"},{"t":"trm","f":"Klasifikasi fraktur berdasarkan garis","b":"Sederhana: 1 garis fraktur (transversal, oblik, spiral). Kompleks: >2 garis (kominutif, segmental).","s":"Fraktur sl. 13–15"},{"t":"trm","f":"Hubungan antarfragmen fraktur","b":"Shift to side (bergeser ke samping), overriding, distraksi, angulasi, rotasi, impaksi.","s":"Fraktur sl. 16"},{"t":"trm","f":"Pemeriksaan fisik fraktur","b":"Look: deformitas (angulasi, rotasi, pemendekan), bandingkan sisi sehat. Feel: nyeri tekan, krepitasi, NVD distal (sensorik, motorik, pulsasi). Move: gerakan berkurang.","s":"Fraktur sl. 18–19"},{"t":"trm","f":"Foto rontgen fraktur","b":"Minimal 2 proyeksi (AP dan lateral) dan harus terlihat 2 sendi.","s":"Fraktur sl. 20"},{"t":"trm","f":"Penatalaksanaan awal fraktur","b":"Primary survey ABCDE, pembidaian, analgesik, antibiotik bila perlu, lalu konsultasi untuk terapi lanjut: konservatif (gips), operasi (fiksasi internal/eksternal), rehabilitasi.","s":"Fraktur sl. 21"},{"t":"trm","f":"Lima fase penyembuhan fraktur","b":"Hematom (1–3 hari) → inflamasi/proliferasi (3 hari–2 minggu) → kalus (2–6 minggu) → konsolidasi (6 minggu–6 bulan) → remodeling (6 bulan–1 tahun).","s":"Fraktur sl. 22"},{"t":"trm","f":"Komplikasi fraktur menurut waktu","b":"Segera: cedera kulit, pembuluh darah, saraf, syok. Awal: nekrosis kulit, infeksi/osteomielitis, emboli, pneumonia, tetanus. Lanjut: kaku sendi, malunion, delayed union, nonunion, atrofi, tardy nerve palsy.","s":"Fraktur sl. 23–25"},{"t":"trm","f":"Fraktur klavikula","b":"Akibat trauma langsung atau jatuh bertumpu lengan terentang. Nonoperasi: arm sling, clavicle brace, elastic bandage; operasi: ORIF. Komplikasi dini: cedera a./v. subklavia, pleksus brakialis, pneumo-/hematotoraks.","s":"Fraktur sl. 27–30"},{"t":"trm","f":"Mekanisme fraktur pelvis","b":"Kompresi anteroposterior: simfisis robek (open book injury). Kompresi lateral: cincin panggul retak, ramus pubis patah. Vertikal: ramus pubis patah dan sendi sakroiliaka robek di sisi yang sama.","s":"Fraktur sl. 33–34"},{"t":"trm","f":"Pemeriksaan fraktur pelvis","b":"Keadaan umum dan syok, perdarahan subkutan perineum, stabilitas panggul, colok dubur, tanyakan miksi terakhir. Penunjang: urin, darah lengkap, foto pelvis AP.","s":"Fraktur sl. 36–38"},{"t":"trm","f":"Subluksasi vs dislokasi","b":"Subluksasi: permukaan sendi bergeser sebagian, masih ada kontak. Dislokasi (luksasi): pergeseran total tanpa kontak. Occult instability baru tampak bila sendi diregangkan.","s":"Fraktur sl. 45"},{"t":"trm","f":"Dislokasi bahu anterior","b":"Jatuh dengan lengan terentang (eksorotasi). Kontur bahu rata, lengan abduksi, rotasi eksternal, ekstensi; kaput humerus di depan-medial glenoid. Terapi: reposisi (Stimson, Kocher, Milch) + imobilisasi.","s":"Fraktur sl. 49–52"},{"t":"trm","f":"Dislokasi panggul posterior","b":"Trauma pada diafisis femur saat panggul fleksi (dashboard injury). Tungkai adduksi, fleksi, rotasi interna, dan memendek. Reposisi (Allis, Stimson, Bigelow), traksi kulit 4–6 minggu, tongkat ±3 bulan.","s":"Fraktur sl. 54–56"},{"t":"trm","f":"Dislokasi panggul anterior","b":"Lebih jarang dari posterior; akibat jatuh dari ketinggian atau trauma saat jongkok dengan abduksi paksa. Tungkai rotasi eksterna, abduksi, sedikit fleksi, tanpa pemendekan, benjolan di inguinal.","s":"Fraktur sl. 58–59"},{"t":"trm","f":"Kelompok otot yang sering cedera","b":"Rotator cuff (subscapularis, supraspinatus, infraspinatus, teres minor): jatuh atau olahraga tenis/badminton. Hamstring (semimembranosus, semitendinosus, biceps femoris) dan betis (gastrocnemius, soleus): atletik, kurang pemanasan.","s":"Fraktur sl. 67–70"},{"t":"trm","f":"Ruptur tendon Achilles: diagnosis","b":"Riwayat trauma, nyeri di belakang ankle, nyeri tekan, tidak mampu plantar fleksi dan berjinjit, tes Thompson (+). Pencitraan: MRI.","s":"Fraktur sl. 73–75"},{"t":"trm","f":"Penatalaksanaan strain fase akut (RICE)","b":"Rest/imobilisasi, Ice (kompres es 20 menit pertama), Compress (balut), Elevation (tungkai ditinggikan), ditambah analgesik. Robekan tendon: repair dan imobilisasi dengan gips.","s":"Fraktur sl. 75–76"},{"t":"trm","f":"Cedera ligamen lutut","b":"Ligamen: cruciatum anterior dan posterior, kolateral medial dan lateral. Klinis: bunyi \"pop\", bengkak, nyeri saat menumpu. Cruciatum: uji drawer dan Lachman; menurut slide, kolateral: uji McMurray.","s":"Fraktur sl. 78–79"},{"t":"trm","f":"Sprain pergelangan kaki","b":"Akibat terpelintir; mengenai ligamen talofibular anterior, talofibular posterior, dan calcaneofibular. Fase akut seperti strain; bila robek: repair, imobilisasi, rehabilitasi.","s":"Fraktur sl. 80–81"},{"t":"trm","f":"Aturan menggambarkan pergeseran fraktur","b":"Pergeseran dijelaskan sebagai posisi fragmen distal terhadap fragmen proksimal. Pengecualian: klavikula (fragmen proksimal ditarik ke atas oleh otot leher) dan spondilolistesis (vertebra atas terhadap vertebra bawah).","s":"Musculoskeletal Imaging sl. 9–12"},{"t":"trm","f":"Istilah orientasi garis fraktur","b":"Transversal (horizontal), longitudinal (vertikal), oblik (diagonal, tersering), spiral (akibat puntiran, perlu beberapa proyeksi), avulsi (ujung tulang). Toddler fracture: spiral di distal tibia anak <5 tahun.","s":"Musculoskeletal Imaging sl. 5–8"},{"t":"trm","f":"Impaksi, overriding, distraksi, diastasis","b":"Impaksi: fragmen saling masuk (memendek). Overriding: fragmen saling tumpang tindih. Distraksi: fragmen tertarik terpisah (khas fraktur patela, atau saat traksi). Diastasis: pelebaran sendi (misalnya simfisis pubis).","s":"Musculoskeletal Imaging sl. 13–18"},{"t":"trm","f":"Klasifikasi Salter–Harris","b":"I: hanya fisis. II: fisis + metafisis (tersering). III: fisis + epifisis (intraartikular). IV: epifisis + fisis + metafisis (triplane di distal tibia, dinilai dengan CT). V: crush fisis, jarang, sering menyebabkan penutupan dini.","s":"Musculoskeletal Imaging sl. 21–27"},{"t":"trm","f":"Fraktur greenstick dan torus","b":"Greenstick: tulang anak yang lunak patah hanya pada satu korteks (inkomplet). Torus/buckle: korteks menggembung keluar di perbatasan metafisis–diafisis radius anak yang jatuh bertumpu tangan.","s":"Musculoskeletal Imaging sl. 29–31"},{"t":"ort","f":"Osteomielitis: definisi dan klasifikasi","b":"Radang tulang oleh organisme piogenik yang dapat melibatkan sumsum, korteks, tulang kanselosa, dan periosteum. Berdasarkan perjalanan klinis: akut, subakut, kronik.","s":"Infeksi Tulang sl. 2, 4"},{"t":"ort","f":"Osteomielitis hematogen akut: etiologi","b":"Kuman dari fokus lain menyebar lewat darah; terutama pada anak. 90% oleh S. aureus; pada anak <4 tahun 50% oleh H. influenzae. Lainnya: streptokokus, E. coli, Salmonella, Pseudomonas, Proteus, Bacteroides.","s":"Infeksi Tulang sl. 5–6"},{"t":"ort","f":"Predisposisi osteomielitis hematogen akut","b":"Bayi dan anak, laki-laki > perempuan (4:1), trauma di metafisis, lokasi metafisis (zona pertumbuhan aktif), nutrisi dan imunitas buruk, fokus infeksi sebelumnya (bisul, tonsilitis).","s":"Infeksi Tulang sl. 7"},{"t":"ort","f":"Penyebaran lokal osteomielitis","b":"Abses subperiosteal, selulitis, artritis septik bila menyebar ke sendi, dan kematian tulang lokal membentuk sekuestrum. Tulang baru di bawah periosteum yang terangkat disebut involukrum.","s":"Infeksi Tulang sl. 9–10"},{"t":"ort","f":"Radiologi osteomielitis akut","b":"10 hari pertama: foto polos belum menunjukkan kelainan berarti (hanya bengkak jaringan lunak). >10 hari (±2 minggu): destruksi tulang difus di metafisis dan tulang baru subperiosteal. USG dapat menunjukkan efusi sendi.","s":"Infeksi Tulang sl. 14"},{"t":"ort","f":"Terapi osteomielitis akut","b":"Antibiotik 3–6 minggu, istirahat, analgesik. Bila tidak membaik setelah 24 jam antibiotik, pertimbangkan drainase bedah pus subperiosteal (bilas NaCl 0,9% dan antibiotik, kultur).","s":"Infeksi Tulang sl. 17–18"},{"t":"ort","f":"Osteomielitis subakut dan abses Brodie","b":"Biasanya oleh S. aureus di distal femur dan proksimal tibia pada anak dan remaja; suhu normal. Radiologi: kavitas 1–2 cm berbatas tegas dikelilingi sklerosis (abses Brodie). Terapi: antibiotik spektrum luas 6 minggu.","s":"Infeksi Tulang sl. 20–24"},{"t":"ort","f":"Osteomielitis kronik","b":"Lanjutan osteomielitis akut yang tidak terobati baik, atau setelah fraktur terbuka/operasi. S. aureus (75%). Klinis: sinus bernanah menahun, fistel, sekuestrum. Terapi: antibiotik, lalu operasi buang semua jaringan nekrotik (sekuestrektomi) dan drainase.","s":"Infeksi Tulang sl. 25–32"},{"t":"ort","f":"Diagnosis banding osteomielitis","b":"Osteosarkoma dan sarkoma Ewing.","s":"Infeksi Tulang sl. 34"},{"t":"ort","f":"Tenosinovitis supuratif fleksor: tanda Kanavel","b":"Jari bengkak, jari dalam posisi semifleksi, nyeri tekan sepanjang selubung tendon, nyeri hebat saat ekstensi pasif. Penyebab: luka tusuk atau laserasi, terutama S. aureus. Terapi: drainase lewat 2 insisi dan irigasi.","s":"Infeksi Tulang sl. 35–42"},{"t":"ort","f":"Tendinitis Achilles","b":"Akibat peregangan atau pemakaian berlebih tendon Achilles: nyeri kronik, nyeri saat dorsofleksi dan plantar fleksi melawan tahanan, bengkak ringan. Terapi: RICE, peregangan gastrocnemius–soleus bertahap, heel lift.","s":"Infeksi Tulang sl. 44–47"},{"t":"ort","f":"MRI vs CT pada kelainan tulang belakang","b":"MRI untuk membedakan mielopati dan radikulopati. CT dapat positif palsu dan menampilkan lesi asimtomatik; X-ray membantu menegakkan diagnosis. Riwayat dan pemeriksaan fisik tetap paling penting.","s":"Tulang Belakang sl. 4"},{"t":"ort","f":"Saraf spinal","b":"31 pasang: 8 servikal, 12 torakal, 5 lumbal, 5 sakral, 1 koksigeal. Serat motorik lewat radiks anterior (ventral), serat sensorik lewat radiks posterior (dorsal).","s":"Tulang Belakang sl. 8"},{"t":"ort","f":"Temuan inspeksi tulang belakang","b":"Garis rambut rendah dan leher pendek: Klippel-Feil. Skapula tinggi: Sprengel. Café au lait: neurofibromatosis. Hairy patch: spinal dysraphism. Gibbus: kolaps vertebra tuberkulosis. Round back: Scheuermann.","s":"Tulang Belakang sl. 12–15"},{"t":"ort","f":"Tes provokasi saraf","b":"Femoral nerve stretch (telungkup, fleksi lutut/ekstensi panggul): iritasi radiks femoralis. Straight leg raise/Lasègue dan bowstring test (terlentang): iritasi n. ischiadicus.","s":"Tulang Belakang sl. 22–24"},{"t":"ort","f":"Derajat kekuatan otot (MRC)","b":"0: paralisis total. 1: kontraksi ringan. 2: gerak tanpa melawan gravitasi. 3: melawan gravitasi. 4: melawan gravitasi dan tahanan. 5: normal.","s":"Tulang Belakang sl. 28"},{"t":"ort","f":"Miotom servikal","b":"Skapular: C4. Deltoid dan biseps: C5. Ekstensi pergelangan dan supinasi: C6. Fleksi pergelangan dan pronasi: C7.","s":"Tulang Belakang sl. 29"},{"t":"ort","f":"Istilah kelainan tulang belakang","b":"Spondilolistesis: vertebra bergeser ke depan. Spondilitis: infeksi tulang belakang. Skoliosis: lateralisasi dan rotasi. Kifosis: kurva bergeser ke anterior (bungkuk). Lordosis: kurva bergeser ke posterior.","s":"Tulang Belakang sl. 33–41"},{"t":"ort","f":"Terapi kelainan tulang belakang","b":"Konservatif: brace, fisioterapi, traksi, observasi. Operatif: laminektomi (dekompresi, dengan/tanpa fusi dan instrumentasi), penggantian diskus, rekonstruksi tulang belakang.","s":"Tulang Belakang sl. 38–39"},{"t":"ort","f":"Falsafah rehabilitasi medik","b":"Meningkatkan kemampuan fungsional sesuai potensi yang dimiliki untuk mempertahankan atau meningkatkan kualitas hidup, dengan mencegah atau mengurangi impairment, disability, dan handicap.","s":"Rehabilitasi Medik sl. 2"},{"t":"ort","f":"Impairment, disability, handicap","b":"Impairment (tingkat organ): masih bergantung perawatan aktif, belum mampu ADL. Disability (tingkat manusia): masa pemulihan, mulai bisa bekerja sesuai kesembuhan. Handicap (tingkat sosial): cacat menetap.","s":"Rehabilitasi Medik sl. 4"},{"t":"ort","f":"Tiga tingkat pencegahan rehabilitasi","b":"Primer: sehat, cegah jangan sakit. Sekunder: sakit (impairment), cegah jangan cacat. Tersier: cacat (disability), cegah jangan handicap.","s":"Rehabilitasi Medik sl. 8"},{"t":"ort","f":"Tingkat penilaian fungsi","b":"Basic ADL (BADL), Instrumental ADL (IADL: telepon, belanja, memasak, mengatur obat dan keuangan; nilai maksimal 27), dan Advanced ADL (AADL).","s":"Rehabilitasi Medik sl. 15, 20"},{"t":"ort","f":"Indeks Barthel","b":"10 kategori berbobot (BAB, BAK, membersihkan diri, jamban, makan, berpindah, berjalan, berpakaian, tangga, mandi), skor sempurna 100 atau 20. Mencatat apa yang pasien lakukan, bukan apa yang bisa ia lakukan.","s":"Rehabilitasi Medik sl. 16–19"},{"t":"ort","f":"Langkah rehabilitasi geriatri","b":"1) Atasi masalah medis utama. 2) Cegah komplikasi sekunder (kontraktur, dekubitus, pneumonia, trombosis, depresi). 3) Kembalikan fungsi yang hilang. 4) Adaptasi pasien. 5) Adaptasi lingkungan. 6) Adaptasi keluarga. Lalu reevaluasi dan reprogram.","s":"Rehabilitasi Medik sl. 24–30"},{"t":"far","f":"Golongan obat osteoporosis","b":"Antiresorpsi (menekan osteoklas): bisfosfonat, denosumab, SERM. Anabolik (merangsang osteoblas): teriparatid, abaloparatid, romosozumab.","s":"Farmakologi Homeostasis Tulang sl. 17"},{"t":"far","f":"Mekanisme bisfosfonat","b":"Analog pirofosfat yang berikatan kuat dengan hidroksiapatit. Ditelan osteoklas saat resorpsi; bisfosfonat bernitrogen menghambat farnesil pirofosfat sintase (jalur mevalonat) → prenilasi protein gagal → osteoklas apoptosis.","s":"Farmakologi Homeostasis Tulang sl. 18"},{"t":"far","f":"Farmakokinetik bisfosfonat","b":"Bioavailabilitas oral sangat rendah, ikatan dengan tulang sangat kuat, waktu paruh fungsional berbulan-bulan hingga bertahun-tahun. Efeknya menetap setelah dihentikan (drug holiday); efek kumulatif terkait ONJ dan fraktur femur atipik.","s":"Farmakologi Homeostasis Tulang sl. 19"},{"t":"far","f":"Dosis bisfosfonat osteoporosis","b":"Alendronat 10 mg/hari atau 70 mg/minggu. Risedronat 5 mg/hari, 35 mg/minggu, atau 150 mg/bulan. Ibandronat 150 mg/bulan oral atau 3 mg IV tiap 3 bulan. Asam zoledronat 5 mg IV setahun sekali.","s":"Farmakologi Homeostasis Tulang sl. 20"},{"t":"far","f":"Denosumab","b":"Antibodi monoklonal IgG2 terhadap RANKL: mencegah diferensiasi osteoklas, mempercepat apoptosisnya, dan menekan resorpsi dengan cepat. Tidak terikat tulang; bila dosis 6 bulanan dihentikan terjadi rebound dengan risiko fraktur vertebra multipel.","s":"Farmakologi Homeostasis Tulang sl. 21–22"},{"t":"far","f":"Raloksifen (SERM)","b":"Agonis reseptor estrogen di tulang (menekan osteoklas, meningkatkan BMD) dan antagonis di payudara dan endometrium. Indikasi: osteoporosis pascamenopause dan pencegahan kanker payudara invasif. Bioavailabilitas ±2%, waktu paruh 27 jam.","s":"Farmakologi Homeostasis Tulang sl. 23"},{"t":"far","f":"Romosozumab","b":"Antibodi monoklonal terhadap sklerostin (penghambat pembentukan tulang dari osteosit). Efek ganda: meningkatkan formasi tulang (jalur Wnt/β-catenin) dan menurunkan resorpsi. Injeksi subkutan bulanan, dibatasi 12 bulan.","s":"Farmakologi Homeostasis Tulang sl. 24"},{"t":"far","f":"Mengapa analog PTH bersifat anabolik?","b":"PTH yang dilepas terus-menerus merangsang osteoklas (resorpsi). Analog PTH yang diberikan intermiten (subkutan sekali sehari) justru dominan merangsang osteoblas sehingga pembentukan tulang jauh melebihi resorpsi.","s":"Farmakologi Homeostasis Tulang sl. 26–27"},{"t":"far","f":"Teriparatid dan abaloparatid","b":"Teriparatid: PTH(1–34) rekombinan (Forteo). Abaloparatid: analog PTHrP (Tymlos). Indikasi: osteoporosis berat, osteoporosis akibat glukokortikoid, gagal terapi antiresorpsi. Maksimal 18–24 bulan karena risiko osteosarkoma pada hewan.","s":"Farmakologi Homeostasis Tulang sl. 28–30"},{"t":"far","f":"Kontraindikasi analog PTH","b":"Riwayat kanker tulang (osteosarkoma, metastasis tulang), penyakit Paget, alkali fosfatase tinggi yang tidak jelas sebabnya, hiperkalsemia.","s":"Farmakologi Homeostasis Tulang sl. 32"},{"t":"far","f":"Kalsitonin: sumber dan kerja","b":"Dari sel C (parafolikular) tiroid, polipeptida 32 asam amino; sediaan farmasi memakai kalsitonin salmon. Antagonis PTH: menghambat osteoklas (efek utama) dan meningkatkan ekskresi Ca dan fosfat di ginjal (efek minor).","s":"Farmakologi Homeostasis Tulang sl. 34–37"},{"t":"far","f":"Kalsitonin: indikasi dan sediaan","b":"Penyakit Paget, hiperkalsemia (efek cepat), osteoporosis pascamenopause dengan nyeri fraktur. Tidak bisa oral karena peptida: suntikan SC/IM atau semprot hidung. Efek samping: flushing, mual, rinitis.","s":"Farmakologi Homeostasis Tulang sl. 38–40"},{"t":"far","f":"Penggolongan pelemas otot rangka","b":"Kerja perifer: penghambat neuromuskular (d-tubokurarin, vekuronium, atrakurium, suksinilkolin) dan dantrolen. Kerja sentral: baklofen, tizanidin, diazepam, metokarbamol, karisoprodol, klorzoksazon, eperison.","s":"Farmakologi Pelemas Otot sl. 5"},{"t":"far","f":"Penghambat neuromuskular vs spasmolitik","b":"Penghambat neuromuskular: dipakai saat operasi dan ICU untuk kelumpuhan otot dan ventilasi mekanis. Spasmolitik: meredakan kejang dan nyeri otot (cedera, fibromialgia, gangguan neurologis).","s":"Farmakologi Pelemas Otot sl. 6"},{"t":"far","f":"Spasme vs spastisitas","b":"Spasme: kontraksi mendadak, involunter, nyeri, akut, satu kelompok otot (lelah, dehidrasi, elektrolit). Spastisitas: tonus meningkat bergantung kecepatan (fenomena pisau lipat), kronik, akibat lesi SSP (stroke, MS, cerebral palsy).","s":"Farmakologi Pelemas Otot sl. 7–8"},{"t":"far","f":"Antispasmodik vs antispastik","b":"Antispasmodik: kejang otot akut, jangka pendek (2–3 minggu), contoh eperison, klorzoksazon, diazepam. Antispastik: spastisitas kronik akibat lesi SSP, jangka panjang, contoh baklofen, dantrolen, tizanidin.","s":"Farmakologi Pelemas Otot sl. 10, 13–14"},{"t":"far","f":"Mekanisme eperison","b":"Menekan refleks spinal mono- dan polisinaptik serta aktivitas motorik eferen α dan γ, efek antagonis kalsium yang menyebabkan vasodilatasi sehingga aliran darah ke otot membaik, dan menekan jalur nyeri.","s":"Farmakologi Pelemas Otot sl. 12"},{"t":"far","f":"d-tubokurarin vs suksinilkolin","b":"d-tubokurarin: penghambat kompetitif yang menstabilkan membran; menduduki reseptor nikotinik otot sehingga asetilkolin terhalang. Suksinilkolin: agonis yang menyebabkan depolarisasi persisten pada lempeng akhir saraf.","s":"Farmakologi Pelemas Otot sl. 15–17"},{"t":"far","f":"Baklofen","b":"Agonis GABA-B di SSP: menurunkan pelepasan neurotransmiter eksitatorik. Lini pertama spastisitas (terutama cedera medula spinalis). Dosis awal 5 mg 3×/hari, maksimal 80 mg/hari. Diekskresi utuh lewat ginjal, t½ 3–4 jam; jangan dihentikan mendadak (kejang, gangguan mental).","s":"Farmakologi Pelemas Otot sl. 19–20"},{"t":"far","f":"Tizanidin","b":"Agonis α2-adrenergik sentral yang mengurangi pelepasan norepinefrin. Efektif untuk spastisitas akibat cedera otak dan medula spinalis. Dimetabolisme CYP1A2, t½ 2–4 jam; dosis 2 mg 3×/hari, maksimal 36 mg/hari. Efek samping: sedasi, mulut kering, hipotensi, bradikardia.","s":"Farmakologi Pelemas Otot sl. 21–22"},{"t":"far","f":"Siklobenzaprin","b":"Relaksan otot sentral yang menghambat neuron di medula spinalis, dengan efek antikolinergik. Untuk kejang otot akut (strain). t½ ±18 jam; dosis 5 mg 3×/hari, maksimal 30 mg/hari. Efek samping: mulut kering, penglihatan kabur, retensi urin, takikardia.","s":"Farmakologi Pelemas Otot sl. 23–24"},{"t":"far","f":"Metokarbamol, karisoprodol, orfenadrin","b":"Ketiganya menghambat transmisi impuls saraf penyebab kejang otot. Metokarbamol: 1,5 g 4×/hari (maks 8 g). Karisoprodol: dimetabolisme menjadi meprobamat yang adiktif. Orfenadrin: efek antikolinergik, t½ 14 jam.","s":"Farmakologi Pelemas Otot sl. 25–30"},{"t":"far","f":"Status karisoprodol di Indonesia","b":"Karisoprodol dimetabolisme menjadi meprobamat yang adiktif. BPOM membatalkan izin edar seluruh obat yang mengandung karisoprodol pada 2013 karena penyalahgunaan (misalnya pil PCC).","s":"Farmakologi Pelemas Otot sl. 27, 33"},{"t":"far","f":"Prinsip pemakaian pelemas otot","b":"Mulai dosis terendah lalu titrasi, pantau sedasi, hipotensi, dan efek antikolinergik, waspadai interaksi dengan depresan SSP, dan hentikan bertahap (terutama baklofen). Bukan pilihan utama untuk nyeri muskuloskeletal.","s":"Farmakologi Pelemas Otot sl. 4, 31"}]}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const Q = DATA.questions;
const byN = new Map(Q.map(q => [q.n, q]));
const TOPICS = DATA.topics;
const TNAME = Object.fromEntries(TOPICS);
const CARDS = DATA.cards.map((c, i) => Object.assign({ id: i }, c));
const SIM_N = 100, SIM_MIN = 120;
const app = document.getElementById('app');

/* ---------- storage ---------- */
const SKEY = 'musk-bank-v1';
const MATERI = "materi/";
let storageOK = true;
function def(){ return { p:{}, sim:null, hist:[], fc:{} }; }
function load(){
  try { const s = localStorage.getItem(SKEY); if (s) return Object.assign(def(), JSON.parse(s)); }
  catch(e){ storageOK = false; }
  return def();
}
let store = load();
try { localStorage.setItem('__nb', '1'); localStorage.removeItem('__nb'); } catch(e){ storageOK = false; }
function save(){ try { localStorage.setItem(SKEY, JSON.stringify(store)); } catch(e){ storageOK = false; } }

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = l => l.toUpperCase();
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmtTime(ms){ ms = Math.max(0, ms); const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, '0'); return h ? h + ':' + String(m).padStart(2, '0') + ':' + ss : String(m).padStart(2, '0') + ':' + ss; }
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }
function accClass(p){ return p >= 75 ? 'hi' : p >= 50 ? 'mid' : 'lo'; }
function parseW(w){
  return w.split('|').map(part => {
    const m = part.match(/^\s*([a-e](?:\s*,\s*[a-e])*)\s*:\s*(.*)$/i);
    return m ? { L: m[1].toUpperCase().replace(/\s*,\s*/g, ', '), t: m[2] } : { L: '', t: part.trim() };
  });
}
const DL = ['A', 'B', 'C', 'D', 'E'];
const PIN = /^(semua|tidak ada yang) (benar|salah)/i;
function makeOrd(n){
  const q = byN.get(n);
  const pin = q.o.filter(o => PIN.test(o[1])).map(o => o[0]);
  return shuffle(q.o.filter(o => !PIN.test(o[1])).map(o => o[0])).concat(pin);
}
/* urutan opsi tetap selama satu sesi; sesi baru = urutan baru */
function ordOf(n){
  let bag;
  if (ui.view === 'sim' && store.sim) bag = store.sim;
  else if (ui.view === 'simresult' && store.lastSim) bag = store.lastSim;
  if (bag){ bag.ord = bag.ord || {}; if (!bag.ord[n]){ bag.ord[n] = makeOrd(n); save(); } return bag.ord[n]; }
  ui.ord = ui.ord || {}; if (!ui.ord[n]) ui.ord[n] = makeOrd(n); return ui.ord[n];
}
const dispL = (ord, l) => DL[ord.indexOf(String(l).toLowerCase())] || U(l);
const fillL = (txt, ord) => String(txt).replace(/\{([a-e])\}/g, (m, l) => dispL(ord, l));
function record(n, letter){
  const q = byN.get(n), p = store.p[n] || {};
  p.a = letter; p.ok = letter === q.k; p.c = (p.c || 0) + 1; p.t = Date.now();
  store.p[n] = p; save();
}
function toggleFlag(n){ const p = store.p[n] || {}; p.r = !p.r; store.p[n] = p; save(); return p.r; }
function isFlag(n){ return !!(store.p[n] && store.p[n].r); }
function stats(ids){
  let ans = 0, ok = 0;
  for (const n of ids){ const p = store.p[n]; if (p && p.a){ ans++; if (p.ok) ok++; } }
  return { ans, ok, total: ids.length };
}
function reviewIds(){ return Q.filter(q => { const p = store.p[q.n]; return p && ((p.a && !p.ok) || p.r); }).map(q => q.n); }
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function confirmBox(title, body, okLabel, onOk, danger){
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = '<div class="box"><h3>' + esc(title) + '</h3><p class="muted">' + esc(body) + '</p><div class="row"><button class="btn ghost" id="mNo">Batal</button><button class="btn primary" id="mYes">' + esc(okLabel) + '</button></div></div>';
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  m.querySelector('#mNo').onclick = close;
  m.querySelector('#mYes').onclick = () => { close(); onOk(); };
  m.addEventListener('click', e => { if (e.target === m) close(); });
  m.querySelector('#mYes').focus();
}

/* ---------- state ---------- */
let ui = { view: 'home', rnd: 20 };
let timerId = null;
function go(next){ ui = next; render(); window.scrollTo(0, 0); }

/* ---------- home ---------- */
const TRACE = '<svg class="trace" viewBox="0 0 800 56" preserveAspectRatio="none" aria-hidden="true">' +
  '<line class="base" x1="0" y1="46" x2="800" y2="46"></line>' +
  '<path class="stim" d="M40 50 V55 M200 50 V55 M236 50 V55 M420 50 V55 M432 50 V55 M444 50 V55 M456 50 V55 M468 50 V55 M480 50 V55 M492 50 V55 M504 50 V55 M516 50 V55 M528 50 V55 M540 50 V55 M552 50 V55 M564 50 V55 M576 50 V55 M588 50 V55 M600 50 V55 M612 50 V55 M624 50 V55 M636 50 V55"></path>' +
  '<path d="M0 46 H42 C50 46 54 22 64 22 C76 22 92 44 126 46 H202 C210 46 214 24 224 24 C232 24 236 31 239 31 C243 31 248 12 258 12 C272 12 292 44 332 46 H422 C428 46 431 27 437 27 C441 27 443 33 446 33 C449 33 452 19 458 19 C462 19 464 24 467 24 C470 24 473 13 479 13 C483 13 485 17 488 17 C491 17 494 9 500 9 C504 9 506 12 509 12 C512 12 515 7 521 7 C525 7 527 9 530 9 C533 9 536 6 542 6 H640 C652 6 668 42 708 46 H800"></path>' +
  '</svg><div class="trace-labels" aria-hidden="true"><span style="left:8%">twitch</span><span style="left:33%">sumasi</span><span class="opt-l" style="left:59%">tetanus inkomplet</span><span style="left:74%">tetanus</span></div>';

function renderHome(){
  stopTimer();
  const all = stats(Q.map(q => q.n));
  const flags = Q.filter(q => isFlag(q.n)).length;
  const wrong = Q.filter(q => store.p[q.n] && store.p[q.n].a && !store.p[q.n].ok).length;
  const rv = reviewIds().length;
  const known = Object.keys(store.fc).length;
  const sim = store.sim;
  const simLeft = sim ? sim.deadline - Date.now() : 0;
  let h = '';
  h += '<header class="hero"><p class="eyebrow">Modul Muskuloskeletal · FK UISU</p><h1>Bank Soal Muskuloskeletal</h1>' +
       '<p class="lede">' + Q.length + ' soal dengan kunci yang sudah dicocokkan ke 16 PPT kuliah. Setiap soal punya pembahasan, alasan opsi lain salah, dan sumber slidenya.</p>' +
       '<p class="credit">Disusun oleh <b>Jory Ganteng</b></p>' + TRACE +
       '<p class="xl"><a class="xlink" href="' + MATERI + '">Materi Muskuloskeletal: ringkasan per topik &amp; hafalan →</a></p></header>';
  h += '<section class="stats" aria-label="Ringkasan progres">' +
       stat(all.ans + '<small class="muted" style="font-size:15px"> / ' + Q.length + '</small>', 'soal sudah dijawab') +
       stat(all.ans ? pct(all.ok, all.ans) + '%' : '–', 'akurasi jawaban terakhir') +
       stat(wrong, 'soal masih salah') +
       stat(flags, 'soal ditandai ragu') + '</section>';
  h += '<section class="section"><h2>Mulai latihan</h2><p class="sub">Pilih cara belajar. Urutan pilihan A–E diacak setiap sesi, jadi hafalkan isinya, bukan hurufnya. Progres tersimpan otomatis di browser ini.</p><div class="modes">';
  h += '<article class="mode lead"><span class="tag">' + SIM_N + ' soal · ' + SIM_MIN + ' menit</span><h3>Simulasi ujian</h3>' +
       '<p>Soal diambil acak dari semua topik sesuai proporsinya. Jawaban dan pembahasan baru muncul setelah kamu mengumpulkan.</p><div class="row">' +
       (sim ? '<button class="btn primary" data-act="sim-resume">' + (simLeft > 0 ? 'Lanjutkan (sisa ' + fmtTime(simLeft) + ')' : 'Waktu habis, lihat hasil') + '</button><button class="btn ghost" data-act="sim-cancel">Batalkan</button>'
            : '<button class="btn primary" data-act="sim-start">Mulai simulasi</button>') + '</div></article>';
  h += '<article class="mode"><span class="tag">Semua topik</span><h3>Soal acak</h3><p>Campuran soal dari ' + TOPICS.length + ' topik. Pembahasan langsung muncul setelah menjawab.</p><div class="row">' +
       '<div class="seg" role="group" aria-label="Jumlah soal">' + [10, 20, 50, 0].map(k => '<button data-rnd="' + k + '" aria-pressed="' + (ui.rnd === k) + '">' + (k || 'Semua') + '</button>').join('') + '</div>' +
       '<button class="btn primary" data-act="rnd-start">Mulai</button></div></article>';
  h += '<article class="mode"><span class="tag">' + rv + ' soal</span><h3>Ulang yang salah &amp; ragu</h3><p>Soal yang jawaban terakhirnya salah atau yang kamu tandai ragu.</p><div class="row">' +
       (rv ? '<button class="btn primary" data-act="rev-start">Ulangi ' + rv + ' soal</button>' : '<span class="muted" style="font-size:15px">Belum ada soal salah atau ragu.</span>') + '</div></article>';
  h += '<article class="mode"><span class="tag">' + CARDS.length + ' kartu · ' + known + ' hafal</span><h3>Flashcard</h3><p>Fakta penting dari PPT, dikelompokkan per topik. Ketuk kartu untuk membaliknya.</p><div class="row">' +
       '<button class="btn primary" data-act="fc-open" data-topic="all">Buka flashcard</button></div></article>';
  h += '</div></section>';
  h += '<section class="section"><h2>Latihan per topik</h2><p class="sub">Batang hijau = benar, merah = salah, abu-abu = belum dijawab.</p><div class="topics">';
  for (const [code, name] of TOPICS){
    const ids = Q.filter(q => q.t === code).map(q => q.n);
    const s = stats(ids), nc = CARDS.filter(c => c.t === code).length;
    const p = pct(s.ok, s.ans);
    h += '<article class="topic"><div class="top"><h3>' + esc(name) + '</h3>' +
         (s.ans ? '<span class="acc ' + accClass(p) + '">' + p + '%</span>' : '<span class="acc muted">–</span>') + '</div>' +
         '<div class="meter" role="img" aria-label="' + s.ok + ' benar, ' + (s.ans - s.ok) + ' salah, dari ' + s.total + ' soal">' +
         '<i class="ok" style="width:' + (s.ok / s.total * 100) + '%"></i><i class="bad" style="width:' + ((s.ans - s.ok) / s.total * 100) + '%"></i></div>' +
         '<div class="meta">' + s.ans + ' dari ' + s.total + ' soal dijawab · ' + nc + ' kartu</div>' +
         '<div class="row"><button class="btn sm primary" data-act="topic-start" data-topic="' + code + '">Latihan</button>' +
         '<button class="btn sm" data-act="fc-open" data-topic="' + code + '">Kartu</button>' +
         '<a class="btn sm ghost" href="' + MATERI + '#topik-' + code + '">Materi</a></div></article>';
  }
  h += '</div></section>';
  if (store.hist.length){
    h += '<section class="section"><h2>Riwayat simulasi</h2><div class="tablewrap"><table class="hist"><thead><tr><th>Tanggal</th><th>Skor</th><th>Benar</th><th>Waktu</th></tr></thead><tbody>';
    for (const r of store.hist.slice().reverse()){
      const d = new Date(r.at);
      h += '<tr><td>' + d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + '</td>' +
           '<td class="num"><span class="acc ' + accClass(pct(r.ok, r.total)) + '">' + pct(r.ok, r.total) + '%</span></td><td class="num">' + r.ok + ' / ' + r.total + '</td><td class="num">' + fmtTime(r.used) + '</td></tr>';
    }
    h += '</tbody></table></div></section>';
  }
  h += '<footer class="foot"><p>Kunci jawaban mengikuti PPT dosen. Bila PPT dan buku teks berbeda, versi buku teks dicatat di pembahasan. Soal yang tidak dibahas di PPT (misalnya osteomalasia dan rakitis, SLE, sebagian tumor tulang, stadium AJCC, dan pelemas otot nondepolarisasi) dijawab dari buku standar (IPD, Robbins, Apley, Katzung, Nelson). Soal yang kuncinya bisa diperdebatkan ditandai "Soal ambigu" dan diberi catatan.</p>' +
       (storageOK ? '<p>Progres hanya tersimpan di browser ini. Kalau membuka dari perangkat lain, progres mulai dari nol.</p>' : '<p><b>Browser ini tidak mengizinkan penyimpanan.</b> Progres hilang saat halaman ditutup.</p>') +
       '<div><button class="btn sm ghost" data-act="reset">Hapus semua progres</button></div>' +
       '<p>Butuh materinya dulu? Buka <a href="' + MATERI + '">Materi Muskuloskeletal</a>: ringkasan 11 topik, gambar interaktif, dan hafalan.</p>' +
       '<p class="credit">Disusun oleh <b>Jory Ganteng</b> untuk teman-teman seangkatan. Semangat ujiannya!</p></footer>';
  app.innerHTML = h;
  function stat(v, l){ return '<div class="stat"><b>' + v + '</b><span>' + l + '</span></div>'; }
}

/* ---------- practice ---------- */
function startPractice(title, ids, origin){
  if (!ids.length){ toast('Tidak ada soal untuk dikerjakan.'); return; }
  go({ view: 'practice', title, ids, i: 0, ans: {}, ord: {}, origin: origin || 'home', rnd: ui.rnd });
}
function renderPractice(){
  stopTimer();
  const s = ui, n = s.ids[s.i], q = byN.get(n), chosen = s.ans[n];
  const done = Object.keys(s.ans).length, okCount = s.ids.filter(x => s.ans[x] && s.ans[x] === byN.get(x).k).length;
  let h = '<div class="bar"><button class="btn sm ghost" data-act="home">← Beranda</button><div class="title">' + esc(s.title) + '</div>' +
          '<div class="count">' + (s.i + 1) + ' / ' + s.ids.length + '</div></div>';
  h += '<div class="thin"><i style="width:' + ((s.i + 1) / s.ids.length * 100) + '%"></i></div>';
  h += qcardHTML(q, chosen, !!chosen, 'practice');
  const last = s.i === s.ids.length - 1;
  h += '<div class="nav"><button class="btn" data-act="prev"' + (s.i ? '' : ' disabled') + '>← Sebelumnya</button>' +
       '<button class="btn flag" data-act="flag" aria-pressed="' + isFlag(n) + '">' + (isFlag(n) ? 'Ditandai ragu' : 'Tandai ragu') + '</button><span class="spacer"></span>' +
       (last ? '<button class="btn primary" data-act="finish-practice">Lihat hasil sesi</button>' : '<button class="btn primary" data-act="next">Berikutnya →</button>') + '</div>';
  h += '<p class="hint">Tombol keyboard: A–E untuk menjawab, ← → untuk pindah soal, R untuk tandai ragu.</p>';
  h += '<p class="hint mono">Sesi ini: ' + okCount + ' benar dari ' + done + ' dijawab</p>';
  app.innerHTML = h;
}
function qcardHTML(q, chosen, reveal, mode){
  let h = '<article class="qcard"><div class="qmeta"><span class="chip">' + esc(TNAME[q.t]) + '</span><span class="chip mono">No. ' + q.n + '</span>' +
          (q.amb && reveal ? '<span class="chip warn">Soal ambigu</span>' : '') + (q.ppt && reveal ? '<span class="chip info">PPT ≠ buku teks</span>' : '') + (isFlag(q.n) ? '<span class="chip flagged">Ragu</span>' : '') + '</div>';
  h += '<p class="stem">' + esc(q.q) + '</p>';
  if (q.img) h += '<img class="qimg" src="' + q.img + '" alt="Gambar untuk soal nomor ' + q.n + '" data-zoom="1"><p class="qimg-hint">Ketuk gambar untuk memperbesar.</p>';
  h += '<div class="opts">';
  const ord = ordOf(q.n), txt = Object.fromEntries(q.o);
  ord.forEach((l, i) => {
    const t = txt[l];
    let cls = 'opt';
    if (reveal){
      if (l === q.k) cls += ' right'; else if (l === chosen) cls += ' wrong'; else cls += ' dim';
    } else if (l === chosen) cls += ' sel';
    h += '<button class="' + cls + '" data-opt="' + l + '"' + (reveal ? ' disabled' : '') +
         ' aria-label="Opsi ' + DL[i] + ': ' + esc(t) + '"><span class="L">' + DL[i] + '</span><span>' + esc(t) + '</span></button>';
  });
  h += '</div>';
  if (reveal) h += feedbackHTML(q, chosen);
  h += '</article>';
  return h;
}
function feedbackHTML(q, chosen){
  const right = chosen === q.k, ord = ordOf(q.n), K = dispL(ord, q.k);
  const cls = !chosen ? 'neutral' : right ? '' : 'bad';
  const verdict = !chosen ? 'Tidak dijawab. Jawaban yang benar: ' + K + '.' : right ? 'Benar, jawabannya ' + K + '.' : 'Belum tepat. Jawaban yang benar: ' + K + '.';
  let h = '<div class="fb ' + cls + '"><p class="verdict">' + verdict + '</p>';
  h += '<h4>Pembahasan</h4><p>' + esc(fillL(q.e, ord)) + '</p>';
  const ws = parseW(q.w).map(x => ({ L: x.L ? x.L.split(/\s*,\s*/).map(l => dispL(ord, l)).sort().join(', ') : '', t: fillL(x.t, ord) }))
                        .sort((a, b) => a.L.localeCompare(b.L));
  h += '<h4>Kenapa bukan opsi lain</h4><ul>' + ws.map(x => '<li><b>' + esc(x.L) + '</b><span>' + esc(x.t) + '</span></li>').join('') + '</ul>';
  if (q.c) h += '<div class="note"><h4>Catatan</h4><p>' + esc(fillL(q.c, ord)) + '</p></div>';
  h += '<p class="src"><b>Sumber:</b> ' + esc(q.s) + '</p></div>';
  return h;
}
function answerPractice(l){
  const n = ui.ids[ui.i]; if (ui.ans[n]) return;
  ui.ans[n] = l; record(n, l); render();
  const fb = app.querySelector('.fb'); if (fb) fb.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
}
function renderPracticeResult(){
  const s = ui, answered = s.ids.filter(n => s.ans[n]);
  const ok = answered.filter(n => s.ans[n] === byN.get(n).k);
  const wrong = answered.filter(n => s.ans[n] !== byN.get(n).k);
  let h = '<div class="bar"><button class="btn sm ghost" data-act="home">← Beranda</button><div class="title">Hasil: ' + esc(s.title) + '</div></div>';
  h += '<div class="score"><div class="big">' + ok.length + '<small> / ' + answered.length + '</small></div><div><h3>' + (answered.length ? pct(ok.length, answered.length) + '% benar' : 'Belum ada yang dijawab') + '</h3>' +
       '<p class="muted">' + (s.ids.length - answered.length) + ' soal dilewati. Soal yang salah otomatis masuk daftar "Ulang yang salah &amp; ragu".</p></div></div>';
  h += '<div class="nav">' + (wrong.length ? '<button class="btn primary" data-act="redo-wrong">Ulangi ' + wrong.length + ' soal yang salah</button>' : '') +
       '<button class="btn" data-act="home">Kembali ke beranda</button></div>';
  if (wrong.length){
    h += '<h2 style="margin-top:28px">Soal yang salah</h2><div class="review" style="margin-top:12px">' + wrong.map(n => reviewItem(byN.get(n), s.ans[n])).join('') + '</div>';
  }
  app.innerHTML = h;
