ya dari aktin.|b: Miosin-ADP-Pi adalah keadaan siap (cocked) sebelum mengikat aktin.|c: Aktin–miosin-ADP-Pi adalah keadaan sebelum power stroke.|e: Aktin–miosin-ATP bersifat sementara dan segera lepas.","s":"PPT Biokimia Otot sl. 11"},{"n":189,"t":"oa","q":"Komplikasi dari Osteoartritis adalah","o":[["a","Bursitis"],["b","Deformitas sendi"],["c","Dislokasi"],["d","Fraktur"],["e","Infeksi"]],"k":"b","e":"Komplikasi OA lanjut adalah deformitas sendi (misalnya genu varum, nodus Heberden/Bouchard) dan keterbatasan fungsi.","w":"a: Bursitis bukan komplikasi khas OA.|c: Dislokasi bukan komplikasi khas OA.|d: Fraktur bukan komplikasi OA.|e: Infeksi bukan komplikasi OA.","s":"PPT Osteoartritis sl. 18"},{"n":190,"t":"oml","q":"Proses mineralisasi tulang dan tulang rawan sangat kompleks. Proses-proses ini tergantung pada:","o":[["a","Fungsi metabolik dan transport yang adekuat di dalam kondrosit dan osteoblas dalam meregulasi kadar Kalsium"],["b","Tersedianya kolagen dalam jenis, jumlah dan distribusi tertentu"],["c","Tingginya kadar inhibitor kalsifikasi pada matriks tulang"],["d","pH yang optimal untuk deposit kalsium - fosfat kompleks"],["e","Ketersediaan kalsium dan fosfat di dalam cairan ekstraselular"]],"k":"e","e":"Mineralisasi tulang dan rawan bergantung pada ketersediaan kalsium dan fosfat di cairan ekstraseluler, kolagen yang sesuai, pH yang optimal, fungsi kondrosit dan osteoblas, serta kadar inhibitor kalsifikasi yang rendah.","w":"a: Fungsi sel juga diperlukan (lihat catatan).|b: Kolagen juga diperlukan (lihat catatan).|c: Inhibitor kalsifikasi yang tinggi justru menghambat mineralisasi.|d: pH optimal juga diperlukan (lihat catatan).","s":"Buku teks: Robbins/IPD","c":"Opsi {a}, {b}, {d}, dan {e} semuanya diperlukan untuk mineralisasi; hanya {c} yang jelas salah. Kunci memilih {e} sebagai syarat paling dasar.","amb":1},{"n":191,"t":"fis","q":"Otot skelet merupakan kumpulan otot yang melekat pada tulang dan memfasilitasi pergerakan skeleton. Banyak otot skelet yang dijumpai berpasangan yang bertujuan untuk mengoordinasi arah gerakan yang berlawanan. Pada saat terjadinya kontraksi otot, sebenarnya terjadi proses berikut...","o":[["a","Filamen tebal & tipis bergeser"],["b","Filamen tebal dan filamen tipis memendek"],["c","Filamen tebal memendek"],["d","Filamen tipis memendek"],["e","Filamen tebal bergeser"]],"k":"a","e":"Saat kontraksi, filamen tebal dan tipis bergeser satu sama lain (sliding filament). Panjang masing-masing filamen tetap.","w":"b: Filamen tidak memendek.|c: Filamen tebal tidak memendek.|d: Filamen tipis tidak memendek.|e: Yang bergeser terutama filamen tipis relatif terhadap filamen tebal; opsi ini tidak lengkap.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 13; PPT Praktikum Muskuloskeletal sl. 27"},{"n":192,"t":"oml","q":"Defisiensi vitamin D yang berat dan berkepanjangan bisa mengakibatkan","o":[["a","Hiperparatiroidisme sekunder"],["b","Hiperkalsemia"],["c","Osteoporosis"],["d","Hiperparatiroidisme primer"],["e","Hipofosfatemia primer"]],"k":"a","e":"Defisiensi vitamin D berat menurunkan absorpsi kalsium, sehingga kalsium darah turun dan merangsang kelenjar paratiroid (hiperparatiroidisme sekunder).","w":"b: Kalsium justru cenderung rendah.|c: Yang terjadi adalah osteomalasia, bukan osteoporosis.|d: Hiperparatiroidisme primer berasal dari kelenjar paratiroid sendiri.|e: Hipofosfatemia yang terjadi bersifat sekunder.","s":"PPT Farmakologi Homeostasis Tulang sl. 8; Buku teks: IPD"},{"n":193,"t":"rem","q":"Keluhan nyeri sendi tidak dapat disebabkan","o":[["a","Artritis"],["b","Bursitis"],["c","Nefritis"],["d","Faktor psikosomatik"],["e","Miositis"]],"k":"c","e":"Nyeri sendi dapat berasal dari artritis, bursitis, miositis, atau faktor psikosomatik. Nefritis adalah peradangan ginjal dan tidak menyebabkan nyeri sendi.","w":"a: Artritis penyebab utama nyeri sendi.|b: Bursitis menimbulkan nyeri periartikular.|d: Faktor psikosomatik dapat menimbulkan nyeri (misalnya fibromialgia).|e: Miositis menimbulkan nyeri di sekitar sendi.","s":"Buku teks: IPD · tidak dibahas di PPT"},{"n":194,"t":"rem","q":"Yang menjadi gold standard untuk penegakan diagnosis Gout Arthritis adalah:","o":[["a","Laju endap darah (LED) meningkat"],["b","Pengukuran asam urat serum yang meningkat"],["c","Kultur mikroorganisme negatif pada cairan sendi"],["d","Ditemukannya kristal urat (MSU) di cairan sendi atau tofus"],["e","Pembengkakan sendi yang asimetris"]],"k":"d","e":"Baku emas diagnosis artritis gout adalah ditemukannya kristal monosodium urat (MSU) berbentuk jarum, birefringen negatif, pada cairan sendi atau tofus.","w":"a: LED tidak spesifik.|b: Asam urat serum bisa normal saat serangan akut.|c: Kultur negatif hanya menyingkirkan infeksi.|e: Pembengkakan asimetris tidak spesifik.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 31"},{"n":195,"t":"rem","q":"Seorang perempuan berusia 45 tahun datang ke IGD dengan keluhan nyeri-nyeri pada sendi yang sudah dialami 4 bulan sebelum masuk rumah sakit dan memberat dalam 1 minggu ini. Keluhan wajah kemerahan jika terkena matahari juga sudah dialami pasien sejak dua bulan terakhir. Pasien juga mengeluhkan terdapat luka-luka pada mulut dan terdapat ruam-ruam merah pada kedua pipi. Pemeriksaan yang tepat dilakukan untuk menegakkan diagnosis pasien tersebut adalah...","o":[["a","Rheumatoid factor"],["b","ANA test"],["c","Aspirasi cairan sendi"],["d","ASTO"],["e","Vitamin D"]],"k":"b","e":"Perempuan dengan poliartralgia, fotosensitivitas, ulkus mulut, dan ruam malar → curiga SLE. Pemeriksaan awal yang tepat adalah ANA test.","w":"a: RF untuk RA.|c: Aspirasi cairan sendi untuk gout atau artritis septik.|d: ASTO untuk demam rematik.|e: Vitamin D tidak mendiagnosis SLE.","s":"Buku teks: IPD (SLE) · tidak dibahas di PPT"},{"n":196,"t":"rem","q":"DMARD (disease modifying anti rheumatic drugs) merupakan golongan obat yang diindikasikan penggunaannya pada rheumatoid artritis (RA). Obat jenis ini tidak diketahui mekanisme kerjanya dalam mengatasi RA, namun obat ini dapat menghambat memburuknya penyakit. Yang termasuk obat golongan DMARD adalah","o":[["a","Fenilbutazon"],["b","Probenesid"],["c","Ketorolac"],["d","Metotreksat"],["e","Piroksikam"]],"k":"d","e":"Metotreksat adalah DMARD sintetik konvensional utama (anchor drug) pada RA.","w":"a: Fenilbutazon adalah OAINS.|b: Probenesid adalah urikosurik.|c: Ketorolak adalah OAINS.|e: Piroksikam adalah OAINS.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 27; Buku teks: Katzung"},{"n":197,"t":"bio","q":"Relaksasi terjadi ketika sistem otot rangka akan terhambat. Agar kontraksi terjadi sistem penghambat ini harus dilepaskan. Yang merupakan protein inhibitor kontraksi pada otot rangka adalah:","o":[["a","Tropomiosin"],["b","Miosin dan aktin"],["c","Troponin C"],["d","Troponin I"],["e","Troponin T"]],"k":"d","e":"Troponin I adalah subunit troponin yang menghambat interaksi aktin–miosin saat istirahat.","w":"a: Tropomiosin menutupi situs aktif aktin, tetapi inhibitor utamanya troponin I.|b: Miosin dan aktin adalah protein kontraktil.|c: Troponin C mengikat Ca2+.|e: Troponin T mengikat tropomiosin.","s":"PPT Biokimia Otot sl. 8"},{"n":198,"t":"ana","q":"Yang tidak termasuk M. quadriceps femoris adalah...","o":[["a","M. vastus medialis"],["b","M. sartorius"],["c","M. rectus femoris"],["d","M. vastus intermedius"],["e","M. vastus lateralis"]],"k":"b","e":"M. quadriceps femoris terdiri dari m. rectus femoris, m. vastus lateralis, m. vastus medialis, dan m. vastus intermedius. M. sartorius bukan bagiannya.","w":"a: Vastus medialis bagian quadriceps.|c: Rectus femoris bagian quadriceps.|d: Vastus intermedius bagian quadriceps.|e: Vastus lateralis bagian quadriceps.","s":"PPT Anatomi Muskuloskeletal sl. 92"},{"n":199,"t":"bio","q":"Kontraksi otot skelet terjadi via suatu sistem dorong/pergeseran filamen dan keadaan ini di bawah regulasi osilasi/naik turunnya kadar Ca2+ intrasel. Tubulus-T (transverse tubules) pada sarkolema merupakan ribuan invaginasi yang masing-masing membentuk saluran (tunnel) dari permukaan hingga pusat serabut/sel otot dan berkontak dengan cisterna terminalis dari retikulum sarkoplasma. Action potential dari serabut saraf berjalan menuju sel otot dan tiba di retikulum sarkoplasma setelah melalui tubulus-T. Rangsangan saraf motorik yang disalurkan ke T tubule sel otot menyebabkan terjadinya mobilisasi Ca2+ sehingga kadar Ca2+ sitosol meningkat, keadaan ini akan memicu kontraksi otot. Kadar Ca2+ yang ideal untuk memicu kontraksi adalah:","o":[["a","10⁻⁵ mol/L"],["b","10⁻⁶ mol/L"],["c","10⁻⁷ – 10⁻⁸ mol/L"],["d","10⁻⁸ mol/L"],["e","10⁻⁷ mol/L"]],"k":"a","e":"Saat istirahat Ca2+ sitosol sekitar 10⁻⁷ mol/L; saat kontraksi naik hingga ±10⁻⁵ mol/L untuk mengaktifkan troponin C.","w":"b: 10⁻⁶ mol/L belum cukup untuk aktivasi maksimal.|c: 10⁻⁷–10⁻⁸ mol/L adalah kadar istirahat.|d: 10⁻⁸ mol/L terlalu rendah.|e: 10⁻⁷ mol/L adalah kadar istirahat.","s":"Buku teks: Harper · tidak dibahas di PPT"},{"n":200,"t":"rem","q":"Inflamasi merupakan respons fisiologis tubuh, bisa bersifat kecuali","o":[["a","Lokal"],["b","Akut"],["c","Sistemik"],["d","Tidak menimbulkan kelainan patologis"],["e","Kronis"]],"k":"d","e":"Inflamasi bisa lokal atau sistemik, akut atau kronis. Inflamasi juga dapat menimbulkan kelainan patologis (kerusakan jaringan, fibrosis), sehingga pernyataan \"tidak menimbulkan kelainan patologis\" salah.","w":"a: Inflamasi bisa lokal.|b: Inflamasi bisa akut.|c: Inflamasi bisa sistemik.|e: Inflamasi bisa kronis.","s":"Buku teks: Robbins · tidak dibahas di PPT"},{"n":202,"t":"oml","q":"Di bawah ini yang termasuk dari komplikasi rakitis adalah, kecuali","o":[["a","Kelainan jantung"],["b","Kejang"],["c","Kelainan tulang"],["d","Pelengkungan tulang belakang yang abnormal"],["e","Keterlambatan pertumbuhan"]],"k":"a","e":"Komplikasi rakitis: kejang (akibat hipokalsemia), kelainan tulang, deformitas tulang belakang, dan gangguan pertumbuhan. Kelainan jantung bukan komplikasi khas (kardiomiopati hipokalsemik sangat jarang).","w":"b: Kejang akibat hipokalsemia.|c: Kelainan tulang adalah komplikasi utama.|d: Kifoskoliosis dapat terjadi.|e: Gagal tumbuh dapat terjadi.","s":"Buku teks: Nelson (rakitis) · tidak dibahas di PPT"},{"n":203,"t":"oml","q":"Gejala yang khas dialami pada pasien dengan osteomalasia adalah, kecuali:","o":[["a","Poliartralgia"],["b","Kaki bengkak dan merah"],["c","Nyeri tulang difus"],["d","Kesulitan berjalan"],["e","Kelemahan otot"]],"k":"b","e":"Gejala osteomalasia: nyeri tulang difus, kelemahan otot proksimal, kesulitan berjalan (waddling gait), dan poliartralgia. Kaki bengkak dan merah adalah tanda inflamasi lokal, bukan osteomalasia.","w":"a: Poliartralgia dapat terjadi.|c: Nyeri tulang difus adalah gejala utama.|d: Kesulitan berjalan dapat terjadi.|e: Kelemahan otot proksimal dapat terjadi.","s":"Buku teks: IPD (osteomalasia) · tidak dibahas di PPT"},{"n":204,"t":"rem","q":"Seorang laki-laki berusia 45 tahun datang ke poliklinik dengan keluhan bengkak pada persendian kaki. Pemeriksaan kadar asam urat dalam darah diperoleh 9,0 mg/dl. Pasien ini memiliki BB 75 kg dan TB 160 cm, tekanan darah 140/90 mmHg. Tujuan dari manajemen nutrisi pada pasien ini adalah...","o":[["a","Penurunan berat badan"],["b","Penurunan tekanan darah"],["c","Penurunan asupan purin"],["d","Penurunan asupan protein"],["e","Penurunan asupan xanthin"]],"k":"c","e":"Pada gout, manajemen nutrisi bertujuan menurunkan asupan purin (jeroan, seafood, daging merah, alkohol, minuman tinggi fruktosa) untuk menurunkan kadar asam urat.","w":"a: Penurunan berat badan juga dianjurkan karena pasien overweight (lihat catatan).|b: Tekanan darah bukan tujuan utama diet gout.|d: Protein secara umum tidak perlu dibatasi, yang dibatasi purin.|e: Xantin bukan sasaran diet.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 32","c":"Slide gout: edukasi menurunkan berat badan dan diet rendah purin. Pasien ini juga overweight (IMT ±29), sehingga penurunan berat badan ({a}) juga dapat dibenarkan.","amb":1},{"n":205,"t":"bio","q":"Otot skelet merupakan kumpulan otot yang melekat pada tulang dan memfasilitasi pergerakan skeleton. Banyak otot skelet yang dijumpai berpasangan yang bertujuan untuk mengkoordinir arah gerakan yang berlawanan. Struktur filamen -ATP dalam myofibril ketika terjadi relaksasi otot skelet adalah:","o":[["a","Actin-myosin-ATP"],["b","Myosin-ATP"],["c","Actin-myosin"],["d","Actin-myosin-ADP-Pi"],["e","Myosin-ADP-Pi"]],"k":"e","e":"Pada fase relaksasi, kepala miosin (S-1) menghidrolisis ATP menjadi ADP + Pi yang tetap terikat. Miosin-ADP-Pi berada dalam keadaan siap (cocked) dan tidak terikat ke aktin.","w":"a: Aktin–miosin–ATP hanya sesaat sebelum lepas.|b: Miosin-ATP juga disebut di slide sebagai aktivitas relaksasi (lihat catatan).|c: Aktin–miosin adalah keadaan rigor.|d: Aktin–miosin-ADP-Pi adalah keadaan sebelum power stroke (kontraksi).","s":"PPT Biokimia Otot sl. 11","c":"Slide menyebut \"pada fase relaksasi kepala S-1 menghidrolisis ATP menjadi ADP + Pi yang tetap terikat\" (miosin-ADP-Pi), tetapi slide yang sama juga menyebut lepasnya miosin-ATP dari aktin sebagai aktivitas relaksasi (opsi {b}).","amb":1},{"n":206,"t":"oml","q":"Kekurangan vitamin D juga dapat terjadi akibat gangguan penyerapan vitamin D pada usus. Kondisi di bawah ini dapat disebabkan oleh:","o":[["a","Pankreatitis"],["b","Hernia"],["c","Penyakit celiac"],["d","Sirosis Hati"],["e","Gastritis"]],"k":"c","e":"Vitamin D larut lemak, sehingga gangguan absorpsi lemak di usus halus seperti penyakit celiac menyebabkan defisiensi vitamin D.","w":"a: Pankreatitis kronik juga dapat menimbulkan malabsorpsi lemak, tapi celiac yang paling khas sebagai gangguan penyerapan usus.|b: Hernia tidak mengganggu absorpsi.|d: Sirosis mengganggu hidroksilasi vitamin D di hati, bukan penyerapannya.|e: Gastritis tidak mengganggu absorpsi vitamin D.","s":"Buku teks: IPD · tidak dibahas di PPT"},{"n":208,"t":"ana","q":"Pada permukaan dorsal pedis dijumpai otot berbentuk angka 7, yaitu...","o":[["a","M. peroneus"],["b","M. extensor hallucis"],["c","M. adductor hallucis caput obliquum dan caput transversum"],["d","M. tibialis anterior"],["e","M. tibialis posterior"]],"k":"c","e":"M. adductor hallucis caput obliquum dan caput transversum bersama-sama membentuk angka 7.","w":"a: M. peroneus di sisi lateral tungkai.|b: M. extensor hallucis membentuk tendon lurus di dorsum.|d: M. tibialis anterior di depan tungkai.|e: M. tibialis posterior di belakang tungkai.","s":"Buku teks: Sobotta","c":"M. adductor hallucis caput obliquum dan caput transversum memang membentuk angka 7, tetapi letaknya di plantar pedis, bukan dorsal pedis seperti tertulis di soal.","amb":1},{"n":210,"t":"oml","q":"Hasil pemeriksaan laboratorium yang sering didapat pada pasien penderita osteomalasia adalah","o":[["a","Penurunan kadar PTH"],["b","Alkali fosfatase serum menurun"],["c","Fosfor serum menurun"],["d","Kalsium urin yang meningkat"],["e","25-hydroxy vitamin D lebih dari 15 ng/ml"]],"k":"c","e":"Laboratorium osteomalasia: fosfat serum menurun, kalsium serum normal atau rendah, alkali fosfatase meningkat, PTH meningkat (sekunder), 25(OH)D rendah, dan kalsium urin rendah.","w":"a: PTH justru meningkat (hiperparatiroidisme sekunder).|b: Alkali fosfatase justru meningkat.|d: Kalsium urin justru rendah.|e: 25(OH)D biasanya rendah (<15 ng/ml).","s":"Buku teks: IPD (osteomalasia) · tidak dibahas di PPT"},{"n":211,"t":"bio","q":"Berikut ini yang merupakan pernyataan yang benar tentang fase relaksasi adalah:","o":[["a","Terbentuknya kompleks Miosin-ATP"],["b","Terbentuknya kompleks aktin-miosin"],["c","Terbentuknya kompleks Miosin-ADP-Pi"],["d","Terbentuknya kompleks aktin-miosin-ADP-Pi"],["e","Terbentuknya kompleks aktin-miosin-ATP"]],"k":"c","e":"Pada fase relaksasi, kepala miosin menghidrolisis ATP menjadi ADP + Pi yang tetap terikat, membentuk kompleks miosin-ADP-Pi yang tidak terikat ke aktin.","w":"a: Miosin-ATP juga disebut di slide sebagai langkah relaksasi (lihat catatan).|b: Aktin–miosin adalah keadaan rigor.|d: Aktin–miosin-ADP-Pi adalah keadaan sebelum power stroke.|e: Aktin–miosin-ATP hanya sesaat sebelum lepas.","s":"PPT Biokimia Otot sl. 11","c":"Slide menyebut miosin-ADP-Pi terbentuk saat relaksasi, tetapi juga menyebut miosin-ATP (opsi {a}) sebagai langkah relaksasi terakhir.","amb":1},{"n":213,"t":"fis","q":"Kontraksi otot skelet terjadi via suatu sistem dorong/pergeseran filamen dan keadaan ini di bawah regulasi osilasi/naik turunnya kadar Ca2+ intrasel. Tubulus-T (transverse tubules) pada sarkolema merupakan ribuan invaginasi yang masing-masing membentuk saluran (tunnel) dari permukaan hingga pusat serabut/sel otot dan berkontak dengan cisterna terminalis dari retikulum sarkoplasma. Action potential dari serabut saraf berjalan menuju sel otot dan tiba di retikulum sarkoplasma setelah melalui tubulus-T. Akibat adanya rangsangan impuls saraf menuju serabut otot, terjadi peningkatan kadar kalsium dalam sarkoplasma. Kalsium ini berasal dari organel dalam sel otot, yaitu:","o":[["a","Aparatus Golgi"],["b","Sitosol"],["c","Sarkolema"],["d","Mitokondria"],["e","Retikulum sarkoplasma"]],"k":"e","e":"Kalsium untuk kontraksi berasal dari retikulum sarkoplasma (sisterna terminalis), yang melepaskannya setelah potensial aksi tiba lewat tubulus T.","w":"a: Aparatus Golgi tidak menyimpan Ca2+ untuk kontraksi.|b: Sitosol (sarkoplasma) adalah tujuan Ca2+, bukan asalnya.|c: Sarkolema adalah membran plasma.|d: Mitokondria tidak menjadi sumber Ca2+ kontraksi.","s":"PPT Biokimia Otot sl. 5; PPT Sistem Muskuloskeletal (Fisiologi) sl. 27"},{"n":214,"t":"ana","q":"Seorang laki-laki dibawa ke UGD setelah jatuh pada waktu bermain futsal. Pemeriksaan radiologis menunjukkan fraktur transversal pada 1/3 medial humeri dextra. Struktur manakah yang paling mungkin mengalami paralisis akibat trauma?","o":[["a","N. dan A. supraclavicularis"],["b","N. axillaris dan A. circumflexa humeri posterior"],["c","N. medianus dan A. brachialis"],["d","N. radialis dan A. profunda brachii"],["e","N. dan A. thoracalis longus"]],"k":"d","e":"N. radialis dan a. profunda brachii berjalan di sulcus nervi radialis pada bagian tengah (shaft) humerus, sehingga paling mudah cedera pada fraktur batang humerus.","w":"a: N. supraclavicularis berada di leher/bahu.|b: N. axillaris cedera pada fraktur collum chirurgicum humeri.|c: N. medianus dan a. brachialis cedera pada fraktur suprakondiler.|e: N. thoracicus longus berada di dinding dada lateral.","s":"PPT Anatomi Muskuloskeletal sl. 27; Buku teks: Snell","c":"\"1/3 medial humeri\" di soal maksudnya 1/3 tengah (batang) humerus, tempat sulcus nervi radialis."},{"n":215,"t":"oml","q":"Kelemahan otot proksimal dapat terjadi pada rakitis akibat defisiensi kalsium yang mengakibatkan hal-hal di bawah ini, kecuali...","o":[["a","Kejang"],["b","Parestesi"],["c","Stridor laring"],["d","Spasme karpopedal"],["e","Ptosis"]],"k":"e","e":"Hipokalsemia meningkatkan eksitabilitas saraf dan otot, sehingga timbul kejang, parestesi, stridor laring (laringospasme), dan spasme karpopedal (tetani). Ptosis tidak terkait hipokalsemia.","w":"a: Kejang akibat hipokalsemia.|b: Parestesi akibat hipokalsemia.|c: Stridor laring akibat laringospasme.|d: Spasme karpopedal adalah tanda tetani.","s":"Buku teks: Nelson · tidak dibahas di PPT"},{"n":216,"t":"ana","q":"Hubungan antar tulang yang tidak memiliki celah sendi disebut","o":[["a","Diartrosis"],["b","Sinartrosis"],["c","Antagonis"],["d","Artikulasi"],["e","Amfiartrosis"]],"k":"b","e":"Sinartrosis adalah sendi yang tidak dapat bergerak dan tidak memiliki celah sendi, misalnya sutura tengkorak.","w":"a: Diartrosis memiliki rongga sendi dan bergerak bebas.|c: Antagonis adalah istilah untuk otot yang bekerja berlawanan.|d: Artikulasi adalah istilah umum untuk sendi.|e: Amfiartrosis sedikit bergerak (misalnya diskus intervertebralis).","s":"PPT Anatomi Muskuloskeletal sl. 45"},{"n":217,"t":"trm","q":"Seorang laki-laki usia 38 tahun dibawa temannya ke IGD rumah sakit dengan keluhan tungkai kanan sakit dan sulit digerakkan. Dokter yang memeriksa menemukan adanya luka pada tungkai kanan ukuran 3 cm x 4 cm (terlihat pada gambar), NVD baik. Diagnosis yang sesuai pada kasus tersebut adalah...","o":[["a","Fraktur terbuka femur dextra grade III B"],["b","Fraktur cruris dextra grade III A"],["c","Fraktur terbuka femur dextra grade II"],["d","Fraktur cruris dextra grade III C"],["e","Fraktur terbuka femur dextra grade III C"]],"k":"c","e":"Luka 3 × 4 cm (>1 cm) yang berhubungan dengan fraktur dan NVD baik, tanpa kerusakan jaringan lunak luas → fraktur terbuka derajat II (Gustilo).","w":"a: III B disertai pengelupasan periosteum yang butuh flap.|b: III A juga mungkin bila jaringan rusak luas, sesuai letak luka di gambar (lihat catatan).|d: III C disertai cedera arteri yang perlu repair, padahal NVD baik.|e: III C disertai cedera arteri.","s":"PPT Fraktur sl. 10","c":"Luka >1 cm, NVD baik, tanpa kerusakan jaringan luas berarti derajat II. Pada gambar, luka tampak di tungkai bawah dan cukup luas, sehingga IIIA cruris ({b}) juga mungkin.","amb":1,"img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCADABLADASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAQIAAwQFBgf/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/aAAwDAQACEAMQAAAB9dXbXiqLK5WBYWGEDKR4EkDAYSCDCQMCRgEQIYEgYkhBISAgMhBGgJIQwghiQGEKsSCBINokgZISQIYCSGAkIIQGQBIgRCAgIwECVlpgkEQ0A0AHkAwikSoVgQWFhgDISSBiEaCIykBBAI0BDBWEJIQQhQSbEhgsLCRwKLJJXGgktFIGK1yyFcsNUywlMuFVJoiUy9SoaAULqBmR68bgeEDc46E+ZE+mT5mD6a3zLQv0Q/PGPoM89vk6RwOmo5nLmzsXRCOFxm+eRC+wGBa6R+c1n0k+N9ZFwBGnH8afSj8z7560V2RImW53HPaMQAgVJeeTTZ3BzdFajSw8RZbjniaBRXqbJ5vzdv0kfMVX6hPmQj6cPmDR9PX5otfTT8xK/TZ8xJ9NPzNt5+lT5w259Fnzs7x9Dnz819AngGX3q+CB7+eBOp72eCY93PCw92PDNHuJ4lrPaTxck9qPHKnsx49j188vI9RODM3vThLl6CcB47g5DHUPNEvTPGrruDkVnbfi15vcHEmd9w4dmdMIsMac1m6YE1npHmIdScoL15RozpZBLGEIJKhEGEgsMM9diNAmSrRprZ8Tp89ks9Nx8XSrnS/BbetaVo7vnXT pal ibu jari.|c: Sendi putar (trochoidea) contohnya radioulnar proksimal dan atlantoaxial.|d: Sendi kondiloid contohnya MCP.|e: Sendi ellipsoid contohnya radiocarpal.","s":"PPT Anatomi Muskuloskeletal sl. 53","c":"Teks soal menyebut sendi lutut dibentuk femur dan tibia-fibula. Fibula tidak ikut membentuk articulatio genu; yang membentuknya femur, tibia, dan patella."},{"n":221,"t":"ort","q":"Seorang anak laki-laki berusia 9 tahun datang ke poli didampingi ibunya dengan keluhan saat berlari selalu ketinggalan dari temannya. Pada pemeriksaan rontgen tampak gambaran flat foot tanpa kelainan tulang. Apakah saran dan tatalaksana yang paling mungkin Anda berikan kepada pasien","o":[["a","Operasi Rekonstruksi"],["b","Medikamentosa"],["c","Konservatif"],["d","Fisioterapi"],["e","Flat foot arch shoes"]],"k":"e","e":"Flat foot fleksibel tanpa kelainan tulang pada anak umumnya ditangani konservatif. Sepatu dengan penyangga lengkung (arch support) adalah bentuk konservatif yang spesifik untuk keluhan ini.","w":"a: Operasi hanya untuk flat foot kaku atau dengan kelainan tulang.|b: Tidak ada obat untuk flat foot.|c: Konservatif juga dapat dibenarkan, tapi kurang spesifik (lihat catatan).|d: Fisioterapi saja tidak cukup.","s":"Buku teks: Apley","c":"Flat foot fleksibel tanpa kelainan tulang ditangani konservatif. Sepatu arch support adalah bentuk konservatif yang spesifik, sehingga {c} dan {e} sama-sama bisa dibenarkan.","amb":1},{"n":222,"t":"neo","q":"Gambaran mikroskopik di atas berasal dari neoplasma muskuloskeletal yang menunjukkan vaskularisasi, jaringan tulang tidak matur serta jaringan osteoid, dan menunjukkan karakteristik trabekula tulang yang anastomosis dan rimming osteoblastik, adalah...","o":[["a","Chondroblastoma"],["b","Osteochondroma"],["c","Osteoid osteoma"],["d","Chondromyxoid fibroma"],["e","Osteosarcoma"]],"k":"c","e":"Gambar menunjukkan trabekula tulang imatur yang beranastomosis, dikelilingi barisan osteoblas (osteoblastic rimming), dengan stroma vaskular ta ":"Nyeri lutut yang berulang meskipun sudah sering disuntik menandakan terapi konvensional gagal. Langkah yang tepat adalah evaluasi ulang (klinis dan radiologis) untuk menentukan perlunya rujukan ke ortopedi/operasi.","w":"a: Observasi saja tidak menyelesaikan masalah.|b: Injeksi berulang tidak dianjurkan karena merusak rawan sendi.|d: Operasi juga dapat dibenarkan setelah evaluasi (lihat catatan).|e: Fisioterapi saja tidak menjawab kegagalan terapi.","s":"PPT Osteoartritis sl. 31","c":"Nyeri berulang setelah injeksi berarti gagal terapi konvensional, sehingga perlu evaluasi untuk rujukan ortopedi. Operasi ({d}) juga dapat dibenarkan.","amb":1},{"n":225,"t":"oml","q":"Pada kesulitan diagnosis osteomalasia dilakukan pemeriksaan","o":[["a","DS DNA Test"],["b","ANA TEST"],["c","MRI Tulang"],["d","CT SCAN Tulang"],["e","Biopsi Tulang"]],"k":"e","e":"Bila diagnosis osteomalasia sulit ditegakkan, dilakukan biopsi tulang (krista iliaka) dengan label tetrasiklin ganda. Ini adalah baku emas.","w":"a: Anti-dsDNA untuk SLE.|b: ANA untuk penyakit autoimun.|c: MRI tidak spesifik untuk osteomalasia.|d: CT scan tidak spesifik untuk osteomalasia.","s":"Buku teks: IPD · tidak dibahas di PPT"},{"n":226,"t":"oml","q":"Pada kondisi hipofosfatemia, obat yang diberikan adalah...","o":[["a","Fosfat saja"],["b","Prednison"],["c","Etambutol"],["d","Cefixime"],["e","1,25(OH)₂D (kalsitriol) dosis tinggi"]],"k":"a","e":"Hipofosfatemia diterapi dengan suplementasi fosfat.","w":"b: Prednison tidak mengatasi hipofosfatemia.|c: Etambutol adalah obat TB.|d: Cefixime adalah antibiotik.|e: Kalsitriol dosis tinggi dapat menyebabkan hiperkalsemia; kalsitriol diberikan dalam dosis terukur bersama fosfat pada rakitis hipofosfatemik (lihat catatan).","s":"Buku teks: IPD","c":"Hipofosfatemia diobati dengan suplementasi fosfat. Pada rakitis hipofosfatemik diberikan fosfat + kalsitriol dosis terukur, yang tidak ada di opsi.","amb":1},{"n":227,"t":"trm","q":"Seorang perempuan berusia 25 tahun dibawa ke rumah sakit oleh temannya dengan keluhan nyeri pada lutut kanan akibat terjatuh saat berlari dan lutut terbentur. Hal lain yang juga dialami penderita adalah lutut sulit digerakkan dan diregangkan, lutut terasa tidak stabil, dan kesulitan berjalan. Dokter melakukan pemeriksaan dan menduga adanya cedera pada ligamentum cruciatum anterior (ACL). Pemeriksaan fisik yang sesuai dengan kasus tersebut adalah...","o":[["a","Tes Lachman"],["b","Tes recurvatum rotasi eksternal"],["c","Tes Thompson"],["d","Tes Apley"],["e","Tes sag posterior"]],"k":"a","e":"Tes Lachman (tibia ditarik ke depan pada fleksi lutut 20–30°) adalah tes paling sensitif untuk cedera ligamentum cruciatum anterior.","w":"b: Recurvatum rotasi eksternal untuk sudut posterolateral.|c: Thompson untuk ruptur tendon Achilles.|d: Apley untuk meniskus.|e: Sag posterior untuk ligamentum cruciatum posterior.","s":"PPT Fraktur sl. 79"},{"n":228,"t":"oa","q":"Seorang pasien dapat dinyatakan menderita osteoarthritis panggul berdasarkan klinis, laboratorium dan radiologis jika didapati kriteria","o":[["a","Nyeri pada sendi panggul/koksa, LED kurang 20 mm pada jam pertama, osteofit pada femoral dan atau asetabular pada gambar radiologis, penyempitan celah sendi dan efusi"],["b","Nyeri pada sendi panggul/koksa, osteofit pada femoral dan atau asetabular pada gambaran radiologis, penyempitan celah sendi secara radiologis (superior, axial dan atau medial)"],["c","Nyeri pada sendi panggul/koksa, LED kurang 20 mm pada jam pertama, osteofit pada femoral dan atau asetabular pada gambaran radiologis"],["d","Nyeri pada sendi panggul/koksa, LED kurang 20 mm pada jam pertama, osteofit pada femoral dan atau asetabular pada gambar radiologis, penyempitan celah sendi secara radiologis (superior, axial dan atau medial)"],["e","Nyeri pada sendi panggul/koksa, LED kurang 20 mm pada jam pertama penyempitan celah sendi secara radiologis (superior, axial, dan atau medial)"]],"k":"d","e":"Kriteria ACR untuk OA panggul (klinis, laboratorium, radiologis): nyeri panggul + minimal 2 dari 3: LED <20 mm/jam, osteofit femoral/asetabular, penyempitan celah sendi. Opsi {d} memuat semua komponen.","w":"a: Efusi bukan bagian kriteria.|b: Memenuhi, tapi tidak memuat LED (lihat catatan).|c: Memenuhi, tapi tidak memuat penyempitan celah (lihat catatan).|e: Memenuhi, tapi tidak memuat osteofit (lihat catatan).","s":"PPT Osteoartritis sl. 24","c":"Kriteria: nyeri panggul + minimal 2 dari 3 (LED <20, osteofit, penyempitan celah). Opsi {b}, {c}, {d}, dan {e} semuanya memenuhi; {d} dipilih karena paling lengkap.","amb":1},{"n":229,"t":"ana","q":"Lisfranc adalah batas amputasi pembedahan pada regio pedis ekstremitas inferior yang menyisakan os tarsal. Batas amputasi jenis ini ada di daerah...","o":[["a","Art. tibiofibularis-talus"],["b","Art. metatarsophalangea"],["c","Art. tibiofibularis superior dan inferior"],["d","Art. tarsometatarsal"],["e","Art. talocalcanea"]],"k":"d","e":"Amputasi Lisfranc dilakukan setinggi sendi tarsometatarsal, sehingga seluruh tulang tarsal tetap tersisa.","w":"a: Tidak ada sendi tibiofibularis-talus dalam amputasi ini.|b: MTP lebih distal (amputasi transmetatarsal/jari).|c: Tibiofibular berada di tungkai bawah.|e: Talocalcanea lebih proksimal (amputasi Chopart di midtarsal).","s":"PPT Anatomi Muskuloskeletal sl. 40"},{"n":230,"t":"trm","q":"Urutan penatalaksanaan yang sesuai dengan cedera otot tingkat 1 adalah...","o":[["a","Rest/imobilisasi – ice/kompres es – compress/balut – elevation/tungkai ditinggikan"],["b","Kompres es – balut – elevasi – mobilisasi"],["c","Mobilisasi – elevasi – kompres es – balut"],["d","Kompres es – balut – elevasi – imobilisasi"],["e","Mobilisasi – kompres es – elevasi – balut"]],"k":"a","e":"Cedera otot derajat 1 ditangani dengan prinsip RICE: rest/imobilisasi, ice (kompres es), compression (balut tekan), dan elevation (tungkai ditinggikan).","w":"b: Tidak dimulai dengan istirahat dan diakhiri mobilisasi dini.|c: Mobilisasi bukan langkah pertama.|d: Urutannya tidak sesuai RICE.|e: Mobilisasi bukan langkah pertama.","s":"PPT Fraktur sl. 75"},{"n":231,"t":"ana","q":"Persendian berbentuk bola dan landasan yang disebut ball and socket joint memungkinkan banyak gerakan seperti fleksi, ekstensi, abduksi, adduksi, rotasi medial-lateral, dan sirkumduksi. Sendi jenis ini ditemukan pada...","o":[["a","Art. interphalangea"],["b","Art. radiocarpea"],["c","Art. atlantoaxialis"],["d","Articulatio cubiti dan genu"],["e","Articulatio glenohumeralis"]],"k":"e","e":"Sendi bola dan mangkuk (ball and socket/spheroidea) memungkinkan gerakan ke segala arah. Contohnya articulatio glenohumeralis (bahu) dan coxae (panggul).","w":"a: Interfalang adalah sendi engsel.|b: Radiocarpea adalah sendi ellipsoid.|c: Atlantoaxial adalah sendi putar.|d: Siku dan lutut adalah sendi engsel.","s":"PPT Anatomi Muskuloskeletal sl. 53"},{"n":232,"t":"ort","q":"Pada tahun 1890-an, Dupuytren dari Paris mendeskripsikan suatu penyakit berupa nyeri pada jari-jari orang tua saat digerakkan dan dinamakan Dupuytren contracture. Apabila Anda menjumpai kasus tersebut, maka tindakan Anda terlebih dahulu adalah...","o":[["a","Fisioterapi"],["b","Provocative manipulation"],["c","Medikamentosa"],["d","Konservatif"],["e","Operatif"]],"k":"d","e":"Kontraktur Dupuytren (fibrosis fasia palmaris) pada tahap awal ditangani konservatif atau diobservasi; operasi (fasiektomi) dilakukan bila kontraktur bermakna (tes meja positif).","w":"a: Fisioterapi saja tidak menghentikan progresivitas.|b: Manipulasi provokatif tidak dianjurkan.|c: Tidak ada obat oral yang efektif.|e: Operasi hanya untuk kontraktur bermakna.","s":"Buku teks: Apley","c":"Kontraktur Dupuytren tahap awal ditangani konservatif atau diobservasi; operasi dilakukan bila kontraktur sudah bermakna. Teks soal menulis tahun 1890-an. Guillaume Dupuytren dari Paris mendeskripsikan kontraktur ini sekitar tahun 1831–1833, dan kontrakturnya umumnya tidak nyeri.","amb":1},{"n":233,"t":"oml","q":"Pada penderita osteomalasia dengan gagal ginjal diberikan...","o":[["a","Fosfat dosis rendah"],["b","Vitamin D 50.000 IU/hari"],["c","Vitamin D 1.000 IU/hari"],["d","Pengikat fosfat diminum sesudah makan"],["e","Vitamin D 2.000 IU/hari"]],"k":"d","e":"Pada osteodistrofi renal, fosfat menumpuk karena ekskresi ginjal menurun. Terapinya pengikat fosfat (kalsium karbonat/asetat, sevelamer), dengan kalsitriol bila perlu.","w":"a: Fosfat justru tinggi pada gagal ginjal.|b: Vitamin D nutrisi dosis tinggi tidak efektif karena ginjal tidak dapat mengaktifkannya.|c: Vitamin D nutrisi kurang efektif tanpa aktivasi ginjal.|e: Vitamin D nutrisi kurang efektif tanpa aktivasi ginjal.","s":"Buku teks: IPD (osteodistrofi renal)","c":"Pengikat fosfat semestinya diminum bersama makan, bukan sesudah makan. Namun opsi lain jelas salah, sehingga {d} tetap paling tepat.","amb":1},{"n":234,"t":"trm","q":"Seorang laki-laki dibawa ke IGD rumah sakit oleh temannya dengan keluhan tungkai bawah kanan penderita sakit dan sulit digerakkan serta penderita tidak dapat berjalan akibat terjatuh dari sepeda motor. Tanda vital dalam batas normal. Dari hasil pemeriksaan terlihat pada tungkai bawah kanan tidak dijumpai luka, bengkak (+), nyeri tekan (+) dan pemeriksaan neurovascular distal baik. Penatalaksanaan Non-Farmako yang sesuai penderita tersebut adalah","o":[["a","Balut tekan"],["b","Pembidaian"],["c","Istirahat di tempat tidur"],["d","Mengelevasikan tungkai"],["e","Pemasangan infus"]],"k":"b","e":"Fraktur tertutup tungkai bawah dengan NVD baik di IGD ditangani awal dengan pembidaian (imobilisasi melewati dua sendi) untuk mengurangi nyeri, perdarahan, dan cedera lanjutan.","w":"a: Balut tekan tidak menstabilkan fraktur.|c: Istirahat tanpa imobilisasi tidak cukup.|d: Elevasi hanya tambahan setelah dibidai.|e: Infus tidak diperlukan karena tanda vital normal.","s":"PPT Fraktur sl. 21"},{"n":235,"t":"osp","q":"Faktor kebiasaan yang menjadi risiko tinggi terjadinya osteoporosis adalah","o":[["a","Suntik KB"],["b","Merokok"],["c","Imobilitas fisik jangka panjang"],["d","Minum alkohol"],["e","Pemakaian steroid"]],"k":"c","e":"Slide osteoporosis membagi faktor risiko: imobilitas fisik jangka panjang = risiko tinggi; alkohol dan steroid = risiko sedang; merokok = risiko rendah.","w":"a: Suntik KB (DMPA) dapat menurunkan densitas tulang, tapi tidak tercantum sebagai risiko tinggi.|b: Merokok di slide termasuk risiko rendah.|d: Alkohol di slide termasuk risiko sedang.|e: Steroid di slide termasuk risiko sedang dan bukan kebiasaan.","s":"PPT Osteoporosis sl. 13","c":"Buku teks (FRAX/IOF): glukokortikoid, merokok, dan alkohol termasuk faktor risiko utama. Untuk ujian, ikuti PPT: imobilitas lama = risiko tinggi, alkohol/steroid = sedang, rokok = rendah.","ppt":1},{"n":236,"t":"ort","q":"Pada awal milenium ini, dr. Matsen dari Amerika yang terkenal dengan Matsen suture mengemukakan mengenai total shoulder replacement reversal type, di mana apabila otot supraspinatus yang cedera diinversikan dengan reverse shoulder dan setelah operasi pasien dikirim ke unit fisioterapi. Dalam hal ini tujuan fisioterapi yang diharapkan adalah...","o":[["a","Return to activities of daily living"],["b","Return to home"],["c","Returning the purpose"],["d","Return to normal"],["e","Return to work"]],"k":"a","e":"Tujuan rehabilitasi pascaoperasi bahu (reverse shoulder arthroplasty) adalah mengembalikan kemampuan melakukan aktivitas kehidupan sehari-hari (return to ADL).","w":"b: Pulang ke rumah bukan tujuan fisioterapi.|c: \"Returning the purpose\" bukan istilah rehabilitasi.|d: Kembali normal sepenuhnya tidak realistis setelah reverse shoulder.|e: Kembali bekerja adalah tujuan lanjutan, bukan tujuan utama.","s":"PPT Rehabilitasi Medik sl. 11; Buku teks: rehabilitasi medik"},{"n":237,"t":"ort","q":"Seorang laki-laki berusia 20 tahun, seorang atlet, datang ke poli untuk kontrol setelah menjalani fisioterapi selama 1 bulan. Indikasi fisioterapi pasien adalah ACL tear non-operative dengan keluhan nyeri. Apakah saran Anda yang paling mungkin diberikan kepada pasien?","o":[["a","Mengubah cabang olahraga yang ditekuni"],["b","Berhenti menjadi atlet"],["c","Rujuk balik fisioterapi"],["d","ACL reconstruction"],["e","Menyarankan alternatif"]],"k":"d","e":"Atlet muda dengan ruptur ACL yang tetap nyeri dan tidak membaik dengan fisioterapi non-operatif sebaiknya disarankan rekonstruksi ACL agar dapat kembali berolahraga dan mencegah kerusakan meniskus/rawan sendi.","w":"a: Mengubah cabang olahraga tidak mengatasi instabilitas.|b: Berhenti menjadi atlet tidak menjadi pilihan pertama.|c: Fisioterapi saja sudah gagal.|e: Terlalu umum dan tidak spesifik.","s":"Buku teks: Apley · tidak dibahas di PPT"},{"n":238,"t":"neo","q":"Berikut adalah gambaran makroskopis dari...","o":[["a","Lipoma"],["b","Osteosarcoma"],["c","Osteoma"],["d","Fibroma"],["e","Chondroma"]],"k":"a","e":"Gambar menunjukkan massa berwarna kuning, berlobus, lunak, dan berkapsul tipis, khas lipoma (tumor jinak jaringan lemak).","w":"b: Osteosarkoma keras, membentuk tulang, dan merusak korteks.|c: Osteoma keras seperti tulang.|d: Fibroma berwarna putih keabuan dan kenyal.|e: Chondroma berwarna putih kebiruan dan mengilap.","s":"PPT Neoplasma Muskuloskeletal sl. 9","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAFCAW8DASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAwABAgQFBgf/xAAZAQADAQEBAAAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAeeXOJnRvzjldGucSfRrnXK6Fc+6e+sBBvrASN9sN0bSxohtrGYNpYzi2FkMzYWFAnoFz0ano7HMWA24c2hdGucQdG/NoOjXOIOjXOMHSLm0HSNziDpFzSRJ2Vjuzq3ZJDpOU7pTTppFOVGyuLkUUMZ2brQsisc9aaLLxWdEaUkBFZV516N97nKjoVqyA6V5JMzUlFA6SBJIGSQJJBNM7SdpFJnSpSZKpJkNzDPGhLMD4axhYHNhgWTdRrLVVWNoNSrNSYrM6diEYDHqZVzhjWEJKipV0g6YUWKPXjZJNJ2QOyQJJAkkE0npJ2SckkqSTgkkMtgVvHoKcZsNnDZaarkYjuLWFLpi0IFZish1TDT1gxgSVzdJUmnEBRTVEKd9rxzmIPXjSSaSSB0khJIJunpMnQ0k4M6SFKJFVq6K5y9iPJs9YiPEqTCsJxd2VE kurang, malabsorpsi).","w":"b: Vitamin A tidak menyebabkan osteomalasia.|c: Kelebihan vitamin B tidak menyebabkan osteomalasia.|d: Kelebihan vitamin A dapat meningkatkan resorpsi tulang, bukan osteomalasia.|e: Kelebihan vitamin D menyebabkan hiperkalsemia.","s":"Buku teks: IPD · tidak dibahas di PPT"},{"n":242,"t":"oml","q":"Hal di bawah ini yang bukan merupakan etiologi osteomalasia adalah...","o":[["a","Perubahan metabolisme"],["b","Disfungsi/defisiensi vitamin D"],["c","Penggunaan bisfosfonat pada gagal ginjal kronik"],["d","Alkalosis"],["e","Defisiensi fosfat"]],"k":"d","e":"Etiologi osteomalasia: defisiensi atau gangguan metabolisme vitamin D, defisiensi fosfat, obat (bisfosfonat generasi lama dosis tinggi, terutama pada gagal ginjal), dan asidosis (misalnya asidosis tubulus ginjal). Alkalosis tidak menyebabkan osteomalasia.","w":"a: Gangguan metabolisme mineral dapat menyebabkan osteomalasia.|b: Defisiensi vitamin D penyebab tersering.|c: Bisfosfonat pada gagal ginjal dapat mengganggu mineralisasi.|e: Defisiensi fosfat penyebab osteomalasia.","s":"Buku teks: IPD · tidak dibahas di PPT"},{"n":243,"t":"bio","q":"Protein yang berfungsi mengikat kalsium adalah","o":[["a","Troponin C"],["b","Troponin I"],["c","F-aktin"],["d","Kepala myosin"],["e","Troponin T"]],"k":"a","e":"Troponin C adalah subunit troponin yang mengikat Ca2+.","w":"b: Troponin I menghambat interaksi aktin–miosin.|c: F-aktin berikatan dengan miosin.|d: Kepala miosin memiliki aktivitas ATPase.|e: Troponin T mengikat tropomiosin.","s":"PPT Biokimia Otot sl. 8"},{"n":244,"t":"fis","q":"Yang di bawah ini merupakan sifat otot rangka adalah","o":[["a","Otot non striata yang bersifat involunter dan multinukleus"],["b","Otot non striata yang bersifat involunter dan berinti satu"],["c","Otot non striata yang bersifat volunter dan multinukleus"],["d","Otot lurik yang bersifat volunter dan multinukleus"],["e","Otot lurik yang bersifat involunter dan berinti satu"]],"k":"d","e":"Otot rangka adalah otot lurik (striata), bersifat volunter (dikendalikan sadar), dan berinti banyak (multinukleus).","w":"a: Otot rangka lurik dan volunter.|b: Ini gambaran otot polos.|c: Otot rangka lurik, bukan non-striata.|e: Lurik, involunter, dan berinti satu adalah gambaran otot jantung.","s":"PPT Biokimia Otot sl. 4"},{"n":245,"t":"fis","q":"Pada saat relaksasi otot, yang terjadi adalah...","o":[["a","Panjang sarkomer 2.300 nm"],["b","Filamen tipis saling tumpang tindih dengan ujung-ujung filamen"],["c","Panjang sarkomer 3.500 nm"],["d","Terbentuk kompleks aktin-miosin"],["e","Terbentuk jembatan silang (cross-bridge)"]],"k":"a","e":"Pada saat relaksasi, sarkomer berada pada panjang istirahat sekitar 2,0–2,3 µm (±2.300 nm), dengan cross bridge terlepas.","w":"b: Tumpang tindih ujung filamen tipis terjadi saat kontraksi kuat.|c: 3.500 nm adalah panjang sarkomer yang teregang berlebihan.|d: Kompleks aktin–miosin terbentuk saat kontraksi atau rigor.|e: Cross bridge terbentuk saat kontraksi.","s":"Buku teks: Harper/Guyton","c":"Panjang sarkomer saat relaksasi ±2,0–2,3 µm menurut buku. Angka ini tidak ada di PPT dan bervariasi antarbuku.","amb":1},{"n":246,"t":"trm","q":"Pada kasus perdarahan dapat dijumpai hasil laboratorium...","o":[["a","Jumlah eritrosit normal"],["b","Hemoglobin berkurang dari nilai normal"],["c","MCH dan MCV menurun"],["d","Retikulosit normal"],["e","Jumlah leukosit berkurang dari nilai normal"]],"k":"b","e":"Pada perdarahan (akut maupun kronik), kadar hemoglobin dan hematokrit menurun di bawah nilai normal.","w":"a: Jumlah eritrosit menurun, bukan normal.|c: MCH dan MCV turun hanya pada perdarahan kronik (defisiensi besi).|d: Retikulosit meningkat sebagai respons sumsum tulang.|e: Leukosit dapat meningkat, bukan berkurang.","s":"Buku teks: Hematologi · tidak dibahas di PPT"},{"n":247,"t":"osp","q":"Pengaruh hiperparatiroid terhadap terjadinya osteoporosis melalui mekanisme","o":[["a","Meningkatkan kadar fosfor dalam darah"],["b","Meningkatkan kadar kalsium dalam darah"],["c","Meningkatkan kadar vitamin D dalam darah"],["d","Meningkatkan kadar estrogen dalam darah"],["e","Meningkatkan kadar steroid dalam darah"]],"k":"b","e":"Hormon paratiroid merangsang osteoklas (lewat RANKL dari osteoblas) sehingga resorpsi tulang meningkat dan kalsium darah naik. Kehilangan mineral tulang yang terus-menerus menyebabkan osteoporosis.","w":"a: PTH justru meningkatkan ekskresi fosfat, sehingga fosfor darah turun.|c: PTH meningkatkan aktivasi vitamin D, tapi itu bukan mekanisme osteoporosisnya.|d: PTH tidak meningkatkan estrogen.|e: PTH tidak meningkatkan steroid.","s":"PPT Farmakologi Homeostasis Tulang sl. 7"},{"n":248,"t":"ort","q":"Permasalahan fisioterapi geriatri adalah...","o":[["a","Akseptabilitas"],["b","Reversal"],["c","Kontinuitas"],["d","Adaptabilitas"],["e","Reliabilitas"]],"k":"c","e":"Masalah utama fisioterapi pada geriatri adalah kontinuitas, yaitu kesinambungan program latihan jangka panjang yang sering terputus karena keterbatasan mobilitas, transportasi, dan kepatuhan.","w":"a: Akseptabilitas bukan masalah utama yang disebut.|b: Reversal bukan istilah masalah fisioterapi.|d: Adaptabilitas bukan masalah utama yang disebut.|e: Reliabilitas adalah istilah keandalan alat ukur.","s":"Tidak dibahas di PPT Rehabilitasi Medik; dijawab dari literatur rehabilitasi geriatri","c":"Tidak dibahas di PPT Rehabilitasi Medik maupun buku standar. Kontinuitas program paling sering disebut sebagai masalah rehabilitasi geriatri.","amb":1},{"n":249,"t":"oa","q":"Berdasarkan lokasinya, apakah sendi yang bisa mengalami osteoarthritis","o":[["a","Genu, pergelangan tangan, siku, panggul, HIP Joint"],["b","Genu, pergelangan tangan, servikal"],["c","Genu, pergelangan, servikal, panggul, HIP Joint"],["d","Genu, pergelangan tangan"],["e","Genu, pergelangan tangan, servikal, bahu, HIP Joint"]],"k":"e","e":"Menurut slide, OA dapat mengenai tangan (pergelangan dan jari), lutut, panggul (hip joint), vertebra servikal dan lumbal, serta bahu (glenohumeral). Opsi {e} mencakup genu, pergelangan tangan, servikal, bahu, dan hip joint.","w":"a: Siku jarang terkena OA primer.|b: Tidak lengkap.|c: Panggul dan hip joint ditulis dua kali dan bahu tidak disebut (lihat catatan).|d: Tidak lengkap.","s":"PPT Osteoartritis sl. 18–19","c":"Slide: OA mengenai tangan, lutut, panggul, vertebra servikal/lumbal, dan glenohumeral. Opsi {c} dan {e} sama-sama mendekati; {c} menulis panggul dan hip joint dua kali tanpa bahu.","amb":1},{"n":251,"t":"fis","q":"Pada saat kontraksi otot, jembatan silang terbentuk akibat","o":[["a","Rantai beta tropomyosin melekat pada F-aktin"],["b","Troponin T mengikat tropomiosin"],["c","Kanal Ca2+ terbuka"],["d","G-aktin mengalami polimerisasi secara non kovalen membentuk F-aktin"],["e","Kepala myosin mengikat aktin"]],"k":"e","e":"Jembatan silang (cross bridge) terbentuk ketika kepala miosin berikatan dengan situs aktif aktin yang sudah terbuka.","w":"a: Tropomiosin tidak memiliki rantai beta yang membentuk cross bridge.|b: Troponin T mengikat tropomiosin, bukan membentuk cross bridge.|c: Terbukanya kanal Ca2+ adalah tahap awal, bukan pembentukan cross bridge.|d: Polimerisasi G-aktin membentuk F-aktin, bukan cross bridge.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 15"},{"n":252,"t":"oml","q":"Hasil laboratorium di bawah ini yang tidak bisa didapat pada osteomalasia adalah...","o":[["a","Kalium menurun"],["b","Alkali fosfatase serum meningkat"],["c","Kalsium urine tinggi"],["d","Fosfor serum menurun"],["e","Alkali fosfatase serum menurun"]],"k":"e","e":"Pada osteomalasia alkali fosfatase serum meningkat (aktivitas osteoblas meningkat). Jadi \"alkali fosfatase menurun\" tidak ditemukan pada osteomalasia.","w":"a: Kalium tidak khas berubah (lihat catatan).|b: ALP meningkat pada osteomalasia.|c: Kalsium urin biasanya rendah (lihat catatan).|d: Fosfor serum menurun.","s":"Buku teks: IPD (osteomalasia)","c":"Alkali fosfatase pada osteomalasia meningkat. Kalsium urin juga biasanya rendah ({c}) dan kalium tidak terkait ({a}), sehingga lebih dari satu opsi bermasalah.","amb":1},{"n":253,"t":"ana","q":"Vertebra cervicalis mempunyai perbedaan tersendiri dari masing-masing vertebra. Vertebra cervicalis yang berciri khusus mempunyai processus spinosus yang bercabang dua dan dapat dipalpasi di leher belakang adalah...","o":[["a","Vertebra cervicalis VI"],["b","Vertebra cervicalis II"],["c","Vertebra cervicalis VII"],["d","Vertebra cervicalis I"],["e","Vertebra cervicalis V"]],"k":"b","e":"Processus spinosus bercabang dua (bifid) dimiliki vertebra servikal C2–C6. Dari opsi, C2 (axis) memiliki processus spinosus besar dan bifid yang dapat diraba di bawah oksiput.","w":"a: C6 bifid, tapi tidak mudah diraba.|c: C7 (vertebra prominens) paling mudah diraba tapi tidak bercabang dua (lihat catatan).|d: C1 tidak memiliki processus spinosus.|e: C5 bifid, tapi sulit diraba.","s":"PPT Anatomi Muskuloskeletal sl. 18","c":"Slide: C7 (prominens) paling mudah diraba tetapi tidak bercabang dua; C2 bercabang dua dan dapat diraba. Soal mencampur dua ciri.","amb":1},{"n":254,"t":"oa","q":"Hasil pemeriksaan laboratorium LED normal, CRP normal, rheumatoid factor normal, antibodi anti-CCP normal, dijumpai pada penyakit sendi...","o":[["a","Trauma sendi"],["b","Gout arthritis"],["c","Rheumatoid arthritis"],["d","Osteoporosis"],["e","Osteoarthritis"]],"k":"e","e":"OA adalah penyakit degeneratif tanpa inflamasi sistemik, sehingga LED, CRP, RF, dan anti-CCP normal.","w":"a: Trauma sendi tidak didiagnosis lewat panel ini.|b: Gout disertai LED/CRP meningkat saat serangan.|c: RA disertai RF/anti-CCP positif dan LED tinggi.|d: Osteoporosis bukan penyakit sendi.","s":"PPT Osteoartritis sl. 12"},{"n":255,"t":"ana","q":"Persendian bahu merupakan persendian yang bergerak bebas lebar dan mobilitasnya stabil. Bagian penting pada scapula, tempat di mana caput humerus bersendi, adalah...","o":[["a","Proc. coracoideus"],["b","Cavitas glenoidalis"],["c","Fossa acetabulum"],["d","Acromion"],["e","Facies costalis"]],"k":"b","e":"Caput humeri bersendi dengan cavitas glenoidalis scapula membentuk articulatio glenohumeralis.","w":"a: Processus coracoideus tempat perlekatan otot dan ligamen.|c: Acetabulum milik os coxae.|d: Acromion bersendi dengan clavicula.|e: Facies costalis adalah permukaan depan scapula.","s":"PPT Kuliah Muskuloskeletal dr. Erwin sl. 55; PPT Anatomi Muskuloskeletal sl. 74"},{"n":256,"t":"ana","q":"Vertebra merupakan bagian kerangka aksial yang menjaga postur manusia agar tetap tegak. Vertebra yang mempunyai ciri-ciri corpus vertebra berbentuk kacang, proc. spinosus yang tebal dan mendatar, serta memiliki tonjolan berupa proc. mammillaris dan accessorius adalah...","o":[["a","Vert. sacralis"],["b","Vert. lumbalis"],["c","Vert. coccygeus"],["d","Vert. thoracalis"],["e","Vert. cervicalis"]],"k":"b","e":"Vertebra lumbal memiliki corpus besar berbentuk ginjal (kacang), processus spinosus tebal dan mendatar (berbentuk kapak), serta processus mammillaris dan accessorius.","w":"a: Sakral menyatu membentuk os sacrum.|c: Koksigeal kecil dan rudimenter.|d: Torakal memiliki fovea costalis dan processus spinosus seperti taji.|e: Servikal memiliki foramen transversarium dan processus spinosus bifid.","s":"PPT Anatomi Muskuloskeletal sl. 17"},{"n":257,"t":"bio","q":"Filamen tebal otot mengandung protein","o":[["a","Kalsekuestrin"],["b","Aktin"],["c","Tropomiosin"],["d","Troponin"],["e","Myosin"]],"k":"e","e":"Filamen tebal tersusun dari protein miosin.","w":"a: Kalsekuestrin mengikat Ca2+ di retikulum sarkoplasma.|b: Aktin menyusun filamen tipis.|c: Tropomiosin bagian filamen tipis.|d: Troponin bagian filamen tipis.","s":"PPT Biokimia Otot sl. 7"},{"n":258,"t":"ort","q":"Seorang anak laki-laki usia 11 tahun datang ke poli Anda didampingi orang tuanya dengan keluhan kaki membentuk huruf O. Foto rontgen menggambarkan tibia vara, Langenskiold line dengan sudut kurang dari 5 derajat. Tindakan tatalaksana yang dilakukan adalah...","o":[["a","Fisioterapi"],["b","Observasi"],["c","Operasi"],["d","Rujuk dokter spesialis ortopedi"],["e","Brace"]],"k":"b","e":"Tibia vara (penyakit Blount) dengan sudut metafisis–diafisis kecil dan garis Langenskiöld <5° menunjukkan derajat ringan, sehingga dapat diobservasi dan dievaluasi berkala.","w":"a: Fisioterapi tidak memperbaiki deformitas tulang.|c: Operasi untuk kasus progresif atau berat, yang sering terjadi pada Blount usia remaja (lihat catatan).|d: Rujukan tidak menjelaskan tatalaksana.|e: Brace dipakai pada anak <3 tahun.","s":"Buku teks: Apley (Blount)","c":"Sudut metafisis–diafisis yang kecil umumnya diobservasi. Namun penyakit Blount pada usia 11 tahun sering memerlukan operasi.","amb":1},{"n":259,"t":"oml","q":"Populasi di bawah ini yang bukan berisiko terjadinya osteomalasia adalah...","o":[["a","Diet kurang vitamin D"],["b","Pasien dengan malabsorpsi yang berhubungan dengan operasi gastrointestinal"],["c","Orang tua yang hanya tinggal di rumah dan sedikit mendapatkan paparan sinar matahari"],["d","Diet yang banyak kalsium dan vitamin D"],["e","Diet kurang kalsium"]],"k":"d","e":"Kelompok berisiko osteomalasia: asupan vitamin D atau kalsium kurang, malabsorpsi (pascaoperasi saluran cerna), dan lansia yang jarang terpapar sinar matahari. Diet tinggi kalsium dan vitamin D justru protektif.","w":"a: Diet kurang vitamin D berisiko.|b: Malabsorpsi berisiko.|c: Kurang paparan sinar matahari berisiko.|e: Diet kurang kalsium berisiko.","s":"Buku teks: IPD · tidak dibahas di PPT"},{"n":260,"t":"trm","q":"Seorang laki-laki dibawa ke IGD rumah sakit oleh temannya dengan keluhan tungkai bawah kanan sakit dan sulit digerakkan serta tidak dapat berjalan akibat terjatuh dari sepeda motor. Tanda vital dalam batas normal. Dari hasil pemeriksaan pada tungkai bawah kanan tidak dijumpai luka, bengkak (+), nyeri tekan (+), dan pemeriksaan neurovaskular distal baik. Pemeriksaan radiologi yang sesuai untuk pasien di atas adalah...","o":[["a","CT scan pedis"],["b","Foto cruris proyeksi AP"],["c","Foto pedis proyeksi AP"],["d","Foto pedis proyeksi AP dan lateral"],["e","Foto cruris proyeksi AP dan lateral"]],"k":"e","e":"Prinsip foto fraktur \"rule of two\": minimal dua proyeksi (AP dan lateral) dan mencakup dua sendi. Untuk cedera tungkai bawah: foto cruris AP dan lateral.","w":"a: CT scan bukan pemeriksaan awal.|b: Satu proyeksi tidak cukup.|c: Lokasi cedera di tungkai bawah, bukan kaki.|d: Lokasi cedera di tungkai bawah, bukan kaki.","s":"PPT Fraktur sl. 20"},{"n":261,"t":"far","q":"Obat yang memberikan efek signifikan pada penderita osteomalasia adalah...","o":[["a","Vitamin E"],["b","Kalsitriol"],["c","Kortikosteroid"],["d","Vitamin C"],["e","Vitamin A"]],"k":"b","e":"Kalsitriol (1,25-dihidroksivitamin D, bentuk aktif) meningkatkan absorpsi kalsium dan fosfat di usus sehingga memperbaiki mineralisasi pada osteomalasia.","w":"a: Vitamin E tidak berperan dalam mineralisasi.|c: Kortikosteroid justru merusak tulang.|d: Vitamin C untuk sintesis kolagen.|e: Vitamin A berlebih dapat merusak tulang.","s":"PPT Farmakologi Homeostasis Tulang sl. 12–13"},{"n":262,"t":"far","q":"d-tubocurarine sebagai pelemas otot yang bekerja sebagai penghambat transmisi neuromuskular dapat dihambat oleh...","o":[["a","Dopamin"],["b","MAO inhibitor"],["c","Suksinilkolin"],["d","Cholinesterase inhibitor"],["e","Asetilkolin"]],"k":"d","e":"Blok neuromuskular kompetitif oleh d-tubokurarin dapat dibalik dengan penghambat kolinesterase (neostigmin) yang meningkatkan kadar asetilkolin di celah sinaps.","w":"a: Dopamin tidak berperan di sambungan neuromuskular.|b: Penghambat MAO tidak memengaruhi blok neuromuskular.|c: Suksinilkolin adalah pelemas otot depolarisasi.|e: Asetilkolin eksogen tidak dipakai secara klinis untuk membalik blok.","s":"Buku teks: Katzung · tidak dibahas di PPT"},{"n":264,"t":"oa","q":"Terapi non-farmakologi OA meliputi...","o":[["a","Edukasi pasien, modifikasi gaya hidup, terapi fisik meliputi latihan perbaikan lingkup gerak sendi"],["b","Edukasi pasien, modifikasi gaya hidup, penurunan berat badan, program latihan aerobik, terapi fisik meliputi latihan perbaikan lingkup gerak sendi"],["c","Edukasi pasien, modifikasi gaya hidup, penurunan berat badan, program latihan aerobik"],["d","Edukasi pasien, memakai tongkat, penurunan berat badan, program latihan aerobik, terapi fisik meliputi latihan perbaikan lingkup gerak sendi"],["e","Modifikasi gaya hidup, penurunan berat badan, program latihan aerobik, terapi fisik meliputi latihan perbaikan lingkup gerak sendi"]],"k":"b","e":"Terapi nonfarmakologis OA: edukasi pasien, modifikasi gaya hidup, penurunan berat badan, program latihan aerobik, dan terapi fisik untuk memperbaiki lingkup gerak sendi. Opsi {b} paling lengkap.","w":"a: Tidak menyebut penurunan berat badan dan latihan aerobik.|c: Tidak menyebut terapi fisik.|d: Tidak menyebut modifikasi gaya hidup.|e: Tidak menyebut edukasi pasien.","s":"PPT Osteoartritis sl. 29"},{"n":266,"t":"far","q":"Pada penderita osteomalasia yang kurang mendapat paparan sinar matahari direkomendasikan untuk diberikan...","o":[["a","Vitamin E dosis tinggi"],["b","Prednison 80 mg/hari"],["c","Vitamin D dosis rendah"],["d","Vitamin D dosis 1.000 IU/hari"],["e","Vitamin A dosis tinggi"]],"k":"d","e":"Pada osteomalasia akibat kurang paparan sinar matahari, dianjurkan suplementasi vitamin D dosis pemeliharaan sekitar 1.000 IU per hari (setelah koreksi defisiensi).","w":"a: Vitamin E tidak bermanfaat.|b: Prednison justru merusak tulang.|c: Dosis rendah tidak cukup.|e: Vitamin A dosis tinggi berbahaya bagi tulang.","s":"PPT Farmakologi Homeostasis Tulang sl. 15"},{"n":267,"t":"neo","q":"Gambar di atas menunjukkan suatu neoplasma...","o":[["a","Osteoid osteoma"],["b","Osteosarcoma"],["c","Chondroma"],["d","Rhabdomyosarcoma"],["e","Chondroblastoma"]],"k":"c","e":"Gambar menunjukkan lesi litik multipel di tulang-tulang tangan dengan kalsifikasi matriks kartilago, sesuai kondroma (enkondroma, dapat multipel pada penyakit Ollier).","w":"a: Osteoid osteoma berupa nidus kecil dengan sklerosis di ikatan asetilkolin dan reseptornya"],["e","Sebagai katalisator yang meningkatkan kerja asetilkolin"]],"k":"a","e":"Asetilkolinesterase di celah sinaps menghidrolisis asetilkolin menjadi asetat dan kolin sehingga rangsangan berhenti. Kolin diambil kembali ke terminal saraf.","w":"b: Enzim ini tidak mengaktifkan reseptor.|c: Kanal kation dibuka oleh ikatan asetilkolin pada reseptor.|d: Enzim ini tidak mengkatalisis ikatan asetilkolin–reseptor.|e: Enzim ini justru menghentikan kerja asetilkolin.","s":"PPT Praktikum Muskuloskeletal sl. 33"},{"n":271,"t":"fis","q":"Seorang perempuan berusia 20 tahun datang ke klinik dibawa keluarganya dengan penurunan kesadaran. Menurut keterangan keluarganya, sebelumnya pasien lemas dan lemah otot. Pasien sebelumnya juga mual dan muntah. Setelah melakukan pemeriksaan fisik, dokter melanjutkan dengan pemeriksaan kadar elektrolit dan mineral, dan hasilnya didapatkan kadar natrium yang rendah. Mengapa natrium rendah dapat menyebabkan otot lemas?","o":[["a","Karena akan menghambat kalium masuk ke dalam sel otot"],["b","Karena akan menghambat asetilkolinesterase"],["c","Karena akan menghambat pembentukan ATP dari mitokondria"],["d","Karena akan menghambat ikatan asetilkolin dengan reseptornya"],["e","Karena akan menghambat keluarnya kalsium dari retikulum sarkoplasma"]],"k":"e","e":"Natrium dibutuhkan untuk depolarisasi membran otot. Pada hiponatremia, potensial aksi otot melemah sehingga sinyal ke retikulum sarkoplasma terganggu dan pelepasan Ca2+ berkurang; akibatnya kontraksi melemah.","w":"a: Natrium rendah tidak menghambat masuknya kalium.|b: Natrium tidak memengaruhi asetilkolinesterase.|c: Pembentukan ATP mitokondria tidak bergantung langsung pada natrium.|d: Ikatan asetilkolin dengan reseptornya tidak dihambat natrium rendah.","s":"Buku teks: Guyton","c":"Natrium rendah mengganggu potensial aksi otot sehingga pelepasan Ca2+ dari retikulum sarkoplasma terganggu. Tidak ada opsi yang menyebut gangguan depolarisasi secara langsung.","amb":1},{"n":273,"t":"rem","q":"Seorang perempuan usia 35 tahun datang ke poliklinik puskesmas dengan keluhan nyeri pada persendian yang sudah dirasakan selama kurang lebih 3 bulan. Pemeriksaan fisik didapatkan pembengkakan dan nyeri tekan pada sendi interfalang proksimal (PIP) II sampai V kanan dan kiri, sendi metakarpofalang (MCP) II sampai V kanan dan kiri, pergelangan tangan kanan dan kiri, dan sendi lutut kanan dan kiri. Hasil laboratorium: hemoglobin 11,5 g/dl, leukosit 8.000/µL, trombosit 260.000/µL, laju endap darah (LED) 80 mm/jam. Berapa total skor artritis reumatoid menurut ACR/EULAR 2010 pada pasien tersebut?","o":[["a","Total skor 3"],["b","Total skor 7"],["c","Total skor 4"],["d","Total skor 1"],["e","Total skor 10"]],"k":"b","e":"Skor ACR/EULAR 2010 pasien: keterlibatan >10 sendi (termasuk sendi kecil) = 5; serologi tidak diketahui = 0; LED meningkat = 1; durasi ≥6 minggu = 1. Total = 7 (≥6 berarti RA definitif).","w":"a: Skor 3 terlalu rendah.|c: Skor 4 terlalu rendah.|d: Skor 1 terlalu rendah.|e: Skor 10 mustahil tanpa serologi positif.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 23"},{"n":274,"t":"bio","q":"Di dalam retikulum sarkoplasma, kalsium terikat dengan suatu protein. Apakah protein yang dimaksud?","o":[["a","Kalbindin"],["b","Kalsitriol"],["c","Kalmodulin"],["d","Kalsitonin"],["e","Kalsekuestrin"]],"k":"e","e":"Di dalam retikulum sarkoplasma, Ca2+ disimpan dalam ikatan dengan kalsekuestrin, protein pengikat kalsium berkapasitas tinggi.","w":"a: Kalbindin pengikat Ca2+ di enterosit usus.|b: Kalsitriol adalah vitamin D aktif.|c: Kalmodulin pengikat Ca2+ di otot polos dan sel lain.|d: Kalsitonin adalah hormon.","s":"Buku teks: Harper · tidak dibahas di PPT"},{"n":275,"t":"oa","q":"Seorang pasien laki-laki umur 51 tahun datang dengan keluhan nyeri pada kedua lutut terutama kanan dan terasa makin sakit jika berjalan atau beraktivitas. Dari pemeriksaan fisik didapat lutut yang sakit agak bengkak. Pemeriksaan TB 176 cm, BB 95 kg. Pemeriksaan radiologi dijumpai osteofit moderat, deformitas ujung tulang, dan celah sendi sempit. Apakah derajat penyakit pasien?","o":[["a","OA grade 0"],["b","OA grade 2"],["c","OA grade 3"],["d","OA grade 4"],["e","OA grade 1"]],"k":"c","e":"Kellgren–Lawrence derajat 3: osteofit moderat, deformitas ujung tulang, dan celah sendi menyempit.","w":"a: Derajat 0: normal.|b: Derajat 2: osteofit minimal di 2 tempat, celah baik.|d: Derajat 4: celah hilang, sklerosis, kista.|e: Derajat 1: osteofit minimal.","s":"PPT Osteoartritis sl. 25"},{"n":276,"t":"osp","q":"Seorang perempuan usia 30 tahun datang ke klinik dengan keluhan nyeri otot dan kram yang menyerang otot wajah, perut, kaki, dan tungkai. Sebelumnya perempuan tersebut memiliki riwayat operasi pengangkatan kelenjar tiroid. Dokter menyuruh pasien untuk melakukan pemeriksaan tambahan seperti kalsium, fosfor, magnesium, dan hormon paratiroid karena dokter menduga pasien tersebut mengalami hipoparatiroid. Apa peran hormon paratiroid tersebut?","o":[["a","Meningkatkan natrium"],["b","Meningkatkan kalium"],["c","Meningkatkan magnesium"],["d","Meningkatkan fosfor"],["e","Meningkatkan kalsium"]],"k":"e","e":"Hormon paratiroid berperan meningkatkan kadar kalsium darah lewat resorpsi tulang, reabsorpsi kalsium di ginjal, dan aktivasi vitamin D. Hipoparatiroid (misalnya setelah tiroidektomi) menyebabkan hipokalsemia, kram, dan tetani.","w":"a: PTH tidak mengatur natrium.|b: PTH tidak mengatur kalium.|c: PTH bukan pengatur utama magnesium.|d: PTH justru menurunkan fosfor darah (fosfaturia).","s":"PPT Farmakologi Homeostasis Tulang sl. 7; PPT Biokimia Otot sl. 27"},{"n":277,"t":"bio","q":"Pada saat otot beristirahat, dalam bentuk apakah sebagian besar energi disimpan di otot?","o":[["a","Fosforilasi oksidatif"],["b","Kreatin fosfat"],["c","Glikolisis"],["d","Glukosa"],["e","Laktat"]],"k":"b","e":"Saat istirahat, energi di otot disimpan terutama sebagai kreatin fosfat (kadarnya sekitar 5 kali ATP), yang siap meregenerasi ATP dengan cepat.","w":"a: Fosforilasi oksidatif adalah jalur, bukan simpanan.|c: Glikolisis adalah jalur, bukan simpanan.|d: Glukosa disimpan sebagai glikogen, bukan glukosa bebas.|e: Laktat adalah produk sisa.","s":"PPT Biokimia Otot sl. 23"},{"n":278,"t":"fis","q":"Apa peran asetilkolin dalam proses kontraksi otot?","o":[["a","Asetilkolin berikatan dengan reseptornya sehingga asetilkolin masuk ke dalam sel otot dan merangsang tropomiosin agar mengubah konformasi aktin, sehingga kepala miosin dapat berinteraksi dengan aktin"],["b","Asetilkolin berikatan dengan reseptornya, maka akan menyebabkan saluran natrium-kalium membuka sehingga terjadi pertukaran natrium dan kalium. Proses ini akan menyebabkan depolarisasi sel sehingga saluran kalsium menjadi terbuka, lalu kalsium berikatan dengan troponin C"],["c","Asetilkolin berikatan dengan reseptornya, maka akan menyebabkan saluran kalsium membuka. Kalsium selanjutnya berikatan dengan natrium untuk dibawa ke filamen tipis"],["d","Asetilkolin berikatan dengan reseptornya, akan menyebabkan kalsium berikatan dengan tropomiosin. Tropomiosin yang telah aktif ini akan mengubah konformasi aktin sehingga kepala miosin dapat berinteraksi dengan aktin"],["e","Asetilkolin berikatan dengan reseptornya sehingga terjadi pembentukan second messenger yang mengaktifkan adenilat siklase, yang selanjutnya terjadi suatu proses sintesis protein miosin"]],"k":"b","e":"Asetilkolin berikatan dengan reseptor nikotinik di motor end plate sehingga kanal kation (Na+/K+) terbuka dan terjadi depolarisasi. Potensial aksi menjalar lewat tubulus T, Ca2+ dilepas, lalu berikatan dengan troponin C.","w":"a: Asetilkolin tidak masuk ke sel otot.|c: Ca2+ tidak berikatan dengan natrium.|d: Ca2+ berikatan dengan troponin C, bukan tropomiosin.|e: Reseptor nikotinik tidak memakai second messenger.","s":"PPT Praktikum Muskuloskeletal sl. 33; PPT Sistem Muskuloskeletal (Fisiologi) sl. 15–19"},{"n":279,"t":"bio","q":"Hari ini murid kelas VI SD akan melakukan olahraga renang. Guru menyuruh semua murid melakukan pemanasan terlebih dahulu, tetapi satu murid tidak melakukan pemanasan dengan baik sehingga ketika renang, siswa tersebut mengalami kram di kakinya. Apa yang menyebabkan kakinya kram?","o":[["a","Terjadinya penumpukan kreatin fosfat"],["b","Terjadinya penumpukan asam laktat"],["c","Terjadinya penumpukan CO2"],["d","Terjadinya kerusakan di mitokondria"],["e","Terjadinya kekurangan O2"]],"k":"b","e":"Tanpa pemanasan, otot langsung bekerja berat dengan suplai oksigen yang belum memadai, sehingga glikolisis anaerob meningkat dan asam laktat menumpuk. Ini memicu kelelahan dan kram.","w":"a: Kreatin fosfat justru dipakai, bukan menumpuk.|c: CO2 dibuang lewat napas.|d: Mitokondria tidak rusak karena kurang pemanasan.|e: Kekurangan O2 adalah penyebab awal, tapi yang menimbulkan kram adalah penumpukan laktat.","s":"PPT Praktikum Muskuloskeletal sl. 42; PPT Sistem Muskuloskeletal (Fisiologi) sl. 24"},{"n":280,"t":"osp","q":"Seorang perempuan berusia 65 tahun mengeluhkan nyeri punggung setelah jatuh dalam posisi duduk di kamar mandi 2 hari yang lalu. Pasien masih dapat berdiri dan berjalan setelah jatuh. Pasien memiliki riwayat histerektomi total pada usia 43 tahun sehingga sudah menopause sejak usia tersebut. Pasien sebelumnya bekerja sebagai salah satu manajer perusahaan swasta, sehingga rutin melakukan pemeriksaan kesehatan saat bekerja dan saat ini didapatkan tinggi badannya 165 cm, padahal sebelum purnatugas tinggi badannya 168 cm. Pemeriksaan apa yang sebaiknya dilakukan pada pasien?","o":[["a","USG"],["b","Foto genu"],["c","Foto vertebra"],["d","CT scan"],["e","BMD"]],"k":"e","e":"Perempuan pascamenopause dengan tinggi badan berkurang dan nyeri punggung setelah jatuh ringan dicurigai osteoporosis. Diagnosis ditegakkan dengan pemeriksaan BMD (DXA).","w":"a: USG tidak untuk osteoporosis.|b: Foto genu tidak relevan.|c: Foto vertebra berguna untuk mencari fraktur kompresi (lihat catatan).|d: CT scan bukan pemeriksaan standar.","s":"PPT Osteoporosis sl. 21–24","c":"BMD dipakai untuk menegakkan osteoporosis. Foto vertebra ({c}) juga berguna untuk mencari fraktur kompresi setelah jatuh.","amb":1},{"n":281,"t":"bio","q":"Pada siklus nomor berapakah proses relaksasi ditunjukkan?","o":[["a","No. 3"],["b","No. 1"],["c","No. 4"],["d","No. 5"],["e","No. 2"]],"k":"d","e":"Pada siklus cross bridge di gambar, langkah No. 5 adalah lepasnya miosin-ATP dari aktin (aktin–miosin–ATP → ATP-miosin + aktin). Slide menyebut langkah ini sebagai aktivitas relaksasi.","w":"a: No. 3 adalah power stroke (lepasnya ADP + Pi).|b: No. 1 adalah hidrolisis ATP; slide juga menyebutnya terjadi pada fase relaksasi (lihat catatan).|c: No. 4 adalah pengikatan ATP ke kompleks aktin–miosin.|e: No. 2 adalah pengikatan miosin ke aktin.","s":"PPT Biokimia Otot sl. 11","c":"Slide menyebut langkah No. 5 (lepasnya miosin-ATP dari aktin) sebagai aktivitas relaksasi, tetapi juga menyebut hidrolisis ATP (No. 1) terjadi pada fase relaksasi.","amb":1,"img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAGqAgIDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAEFAgMEBgf/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/aAAwDAQACEAMQAAAB+kAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAROJLAZsBnOsmyMINjCDa1DY1Da0wb2OagAAAAAAAAACBMSAAAAInElz5G5q1HUwkymJAAIjLEqNHRLloY8jPW4ILGcOM7p4+wMckRr2Jnp6dbVvu07nYFAEEoBhJkwxNzHIAAARIiYkAAAARMHnua81HHwXQ4bXLYYZ6vm59TyoL0yQJiMCtnVvcaDD0Bisr/SYrV8Hp9Z5fP0fKVGPo4PM91zsOHf0aFtd1JcO2bGVQwMuCk7S1369hQdGvE28meRddGjeAAAARMSAAgACJGEzJCRCRjp3jyt/nSnoY5/MHZ5f2NmcGu6mSkm6JTRdKpZui0q6ko4vRRzdCki7FHW+vwWstaDjPV+cvfOF13pBJhy9sGjZsGOUSAAAQnEZathIUEAAAAARMAxNXk++vM/U7MzVw49svF2YaCznVtglUSUAAABCYI5eqE8dh7Hw57uaq0MpxkkAAAAAEY5QatuORkFBAAAAAETiKnooTd6VkMcsTh1R0S8Vpw7K29nN1QFAAAAANedSbMO7Ew6ODqPN3nZ5Q9fPNvMwAAAAAQQGORkAQkKaGbpSC7UmJeqGS9UMF/rpNacPrPOdBfTQkvpob1rRxWkt1O6wDIAAAAAAIrbKp gar energinya tercukupi. Apakah sumber ATP untuk olahraga yang dilakukan Dony?","o":[["a","Kreatin fosfat"],["b","Fosforilasi oksidatif"],["c","Beta oksidasi"],["d","Glikolisis"],["e","Glukoneogenesis"]],"k":"d","e":"Latihan intensitas tinggi seperti angkat beban dan sprint mengandalkan glikolisis anaerob setelah kreatin fosfat habis dalam beberapa detik pertama.","w":"a: Kreatin fosfat hanya cukup untuk beberapa detik pertama (lihat catatan).|b: Fosforilasi oksidatif untuk latihan lama berintensitas sedang.|c: Beta oksidasi untuk latihan lama dan saat istirahat.|e: Glukoneogenesis terjadi di hati, bukan sumber ATP otot.","s":"PPT Biokimia Otot sl. 20, 24","c":"Latihan intensitas tinggi memakai glikolisis anaerob. Kreatin fosfat ({a}) hanya cukup untuk beberapa detik pertama.","amb":1},{"n":284,"t":"bio","q":"Seorang anak laki-laki berusia 2 tahun datang ke klinik dibawa keluarganya dengan keluhan belum bisa berjalan, tidak mampu berdiri lama, dan kelihatan seperti tidak bertenaga. Setelah dilakukan pemeriksaan fisik, dokter menduga anak tersebut mengalami mitochondrial disease. Bagaimana bisa terjadi kelemahan otot pada mitochondrial disease?","o":[["a","Terjadi hambatan dalam proses pembentukan ATP di mitokondria"],["b","Terjadi hambatan dalam glukoneogenesis"],["c","Terjadi hambatan dalam kerja matriks mitokondria"],["d","Terjadi hambatan dalam proses glikolisis"],["e","Terjadi peningkatan dalam pengeluaran CO2"]],"k":"a","e":"Pada penyakit mitokondria, fosforilasi oksidatif terganggu sehingga pembentukan ATP berkurang. Otot yang membutuhkan banyak energi menjadi lemah.","w":"b: Glukoneogenesis terjadi di hati dan ginjal.|c: Terlalu umum; masalah utamanya pembentukan ATP.|d: Glikolisis terjadi di sitosol, bukan mitokondria.|e: Pengeluaran CO2 justru berkurang.","s":"Buku teks: Harper · tidak dibahas di PPT"},{"n":285,"t":"rem","q":"Berapakah skor pada kriteria ACR/EULAR agar diagnosis RA dapat ditegakkan?","o":[["a","Lebih atau sama dengan 6"],["b","Lebih atau sama dengan 12"],["c","Lebih atau sama dengan 8"],["d","Kurang atau sama dengan 6"],["e","Lebih atau sama dengan 10"]],"k":"a","e":"Menurut kriteria ACR/EULAR 2010, diagnosis RA definitif bila skor total ≥6 dari 10.","w":"b: Skor maksimal hanya 10.|c: Batasnya 6, bukan 8.|d: Skor ≤6 tidak memenuhi; yang benar ≥6.|e: Batasnya 6, bukan 10.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 23"}],"cards":[{"t":"ana","f":"Kerangka aksial vs apendikular","b":"Aksial: tulang kepala (kranium), leher (os hyoideum, vertebra servikal), dan batang tubuh (kosta, sternum, vertebra, sakrum). Apendikular: tulang ekstremitas, gelang bahu, dan gelang panggul.","s":"Anatomi Muskuloskeletal sl. 4"},{"t":"ana","f":"Penggolongan tulang menurut bentuk","b":"Panjang/tubular (humerus), pendek (kuboid), pipih (kranium), tak beraturan (tulang wajah), sesamoid (patela).","s":"Anatomi Muskuloskeletal sl. 5"},{"t":"ana","f":"Vaskularisasi tulang","b":"Arteri periosteal memperdarahi substansia kompakta. Satu arteri nutrien menembus kompakta dekat pertengahan diafisis untuk spongiosa dan sumsum. Arteri metafiseal dan epifiseal memperdarahi ujung tulang. Saraf periosteal bersifat sensoris dan vasomotor.","s":"Anatomi Muskuloskeletal sl. 8"},{"t":"ana","f":"Jumlah tulang menurut regio","b":"Total 206. Aksial: kranium 8, wajah 14, osikula 6, hyoid 1, vertebra 26, sternum 1, kosta 24. Ekstremitas atas: karpal 16, metakarpal 10, falang 28. Ekstremitas bawah: tarsal 14, metatarsal 10, falang 28.","s":"Anatomi Muskuloskeletal sl. 10"},{"t":"ana","f":"Jumlah ruas vertebra","b":"Servikal 7, torakal 12, lumbal 5, sakral 5, koksigeal 4–5. Kifosis: lengkung torakal bertambah. Lordosis: lengkung lumbal bertambah. Skoliosis: berbentuk huruf S.","s":"Anatomi Muskuloskeletal sl. 12"},{"t":"ana","f":"Perbedaan vertebra servikal, torakal, lumbal","b":"Korpus: servikal segiempat cekung, torakal bentuk jantung, lumbal bentuk ginjal/kacang. Processus spinosus: servikal bercabang dua, torakal seperti taji ke bawah, lumbal kokoh dan datar. Transversus: servikal ada foramen transversarium, torakal ada fovea costalis, lumbal ada processus mammillaris dan accessorius.","s":"Anatomi Muskuloskeletal sl. 17"},{"t":"ana","f":"Ciri khusus C1, C2, C7","b":"C1 (atlas): tanpa korpus dan processus spinosus, punya arcus anterior dan posterior. C2 (axis): punya dens sebagai pengganti korpus. C7 (prominens): processus spinosus paling panjang, tidak bercabang dua, mudah dipalpasi.","s":"Anatomi Muskuloskeletal sl. 18"},{"t":"ana","f":"Diskus intervertebralis dan HNP","b":"Bantalan fibrokartilago yang terdiri dari anulus fibrosus dan nukleus pulposus. Hernia nukleus pulposus (HNP): nukleus pulposus menonjol keluar dan dapat menekan radiks saraf.","s":"Anatomi Muskuloskeletal sl. 18"},{"t":"ana","f":"Pembagian kosta","b":"Kosta vera: kosta I–VII. Kosta spuria: arcuata (VIII–X) dan fluktuantes (XI–XII). Sternum terdiri dari manubrium, korpus, dan processus xiphoideus.","s":"Anatomi Muskuloskeletal sl. 19–20"},{"t":"ana","f":"Skapula dan klavikula","b":"Skapula: di posterolateral kosta II–VII, segitiga dengan 3 sudut, 3 tepi, 2 permukaan (costalis dan dorsalis). Klavikula: berbentuk S, 2/3 medial cembung, 1/3 lateral cekung; ujung lateral (acromialis) gepeng, ujung medial bulat bersendi dengan sternum.","s":"Anatomi Muskuloskeletal sl. 23–24"},{"t":"ana","f":"Fraktur klavikula dan humerus (klinis)","b":"Klavikula paling lemah di perbatasan 2/3 medial dan 1/3 lateral; fragmen lateral turun karena berat lengan. Fraktur collum chirurgicum humeri (lansia, jatuh pada siku saat lengan abduksi) dapat mencederai n. axillaris.","s":"Anatomi Muskuloskeletal sl. 25, 27"},{"t":"ana","f":"Tulang karpal","b":"Baris proksimal: naviculare (scaphoideum), lunatum, triquetrum, pisiforme. Baris distal: trapezium (multangulum majus), trapezoideum (multangulum minus), capitatum, hamatum. Falang tangan 14 ruas per sisi.","s":"Anatomi Muskuloskeletal sl. 30"},{"t":"ana","f":"Tabatière anatomique (snuffbox)","b":"Dibatasi tendon m. extensor pollicis longus dan brevis. Nyeri tekan di dasarnya setelah jatuh bertumpu telapak tangan menandakan fraktur os scaphoideum (naviculare).","s":"Anatomi Muskuloskeletal sl. 31"},{"t":"ana","f":"Sendi ekstremitas atas dan fraktur Colles","b":"Sternoklavikular, akromioklavikular, glenohumeral, cubiti, radioulnar proksimal dan distal. Fraktur Colles: fraktur transversal 2–3 cm dari distal radius, fragmen ke proksimal, radius memendek, deformitas seperti garpu.","s":"Anatomi Muskuloskeletal sl. 32"},{"t":"ana","f":"Os coxae dan femur","b":"Os coxae dibentuk ilium, pubis, ischium yang bertemu di acetabulum (huruf Y) saat pubertas. Femur adalah tulang terpanjang. Fraktur kolum femoris atau dislokasi panggul dapat merobek a. circumflexa femoris (pemasok utama kaput).","s":"Anatomi Muskuloskeletal sl. 34–36"},{"t":"ana","f":"Tulang tarsal dan batas amputasi kaki","b":"Tarsal: naviculare, calcaneus, talus, cuboideum, cuneiforme I–III. Amputasi Lisfranc: di sendi tarsometatarsal (tarsal tersisa). Chopart: sisa calcaneus dan talus. Syme: setinggi 1/3 distal tibia dan fibula.","s":"Anatomi Muskuloskeletal sl. 39–40"},{"t":"ana","f":"Tiga jenis kartilago","b":"Hialin: banyak matriks amorf, berperan pada pertumbuhan tulang panjang (lempeng epifisis). Fibrosa: banyak kolagen, di diskus artikularis (TMJ, lutut). Elastis: aurikula, meatus akustikus eksternus, tuba auditiva, epiglotis.","s":"Anatomi Muskuloskeletal sl. 42"},{"t":"ana","f":"Faktor stabilitas sendi","b":"Bentuk dan susunan permukaan sendi, ligamen (mencegah gerak berlebihan), dan tonus otot sekitar sendi. Tonus otot paling berpengaruh, contohnya rotator cuff menahan kaput humeri di cavitas glenoidalis yang dangkal.","s":"Anatomi Muskuloskeletal sl. 43"},{"t":"ana","f":"Sinartrosis, amfiartrosis, diartrosis","b":"Sinartrosis: tidak bergerak (sindesmosis gigi–alveolus, sinkondrosis epifisis, sutura). Amfiartrosis: sedikit bergerak, dihubungkan fibrokartilago (diskus intervertebralis). Diartrosis: bergerak bebas (sendi sinovial).","s":"Anatomi Muskuloskeletal sl. 44–46"},{"t":"ana","f":"Cairan sinovial","b":"Disekresi membrana sinovialis; kental, jernih kekuningan seperti putih telur, mengandung asam hialuronat. Fungsi: pelumas, nutrisi kondrosit, membuang sisa metabolik, serta mengandung fagosit.","s":"Anatomi Muskuloskeletal sl. 49–50"},{"t":"ana","f":"Ligamen aksesoris sendi lutut","b":"Ekstrakapsular: lig. collaterale fibulare dan tibiale. Intrakapsular: lig. cruciatum anterior dan posterior. Meniskus (diskus artikularis) adalah fibrokartilago yang menyesuaikan ujung tulang.","s":"Anatomi Muskuloskeletal sl. 51"},{"t":"ana","f":"Tipe sendi sinovial dan contohnya","b":"Plana (sternoklavikular, interkarpal), ginglymus/engsel (cubiti, genu), trochoidea/pasak (atlantoaksial, radioulnar), kondiloid (MCP), ellipsoidea (radiokarpal), pelana (karpometakarpal ibu jari), sferoidea (bahu, panggul).","s":"Anatomi Muskuloskeletal sl. 48, 53"},{"t":"ana","f":"Kelas pengungkit tubuh","b":"Kelas I: tumpuan di antara gaya dan beban (sendi atlanto-oksipital). Kelas II: beban di antara gaya dan tumpuan (menurut slide tidak ada di tubuh). Kelas III: gaya di antara beban dan tumpuan; paling banyak (siku dengan m. brachialis).","s":"Anatomi Muskuloskeletal sl. 58"},{"t":"ana","f":"Origo, insersio, venter","b":"Origo: perlekatan otot pada tulang yang kurang bergerak. Insersio: perlekatan pada tulang yang lebih bergerak. Venter: perut otot di antara keduanya.","s":"Anatomi Muskuloskeletal sl. 61"},{"t":"ana","f":"Susunan fasikulus otot","b":"Paralel, fusiform (venter membesar), sirkular (sfingter), triangular, dan pennatus (uni-, bi-, multipennatus) seperti bulu ayam.","s":"Anatomi Muskuloskeletal sl. 62"},{"t":"ana","f":"Otot punggung dan bahu","b":"Ekstrinsik superfisial: trapezius, latissimus dorsi. Ekstrinsik profunda: levator scapulae, rhomboideus, serratus anterior. Intrinsik: deltoideus, teres major, dan rotator cuff.","s":"Anatomi Muskuloskeletal sl. 66"},{"t":"ana","f":"Otot rotator cuff","b":"M. supraspinatus (abduktor lengan atas), m. infraspinatus, m. teres minor, m. subscapularis (rotator). Fungsi: menstabilkan kaput humeri di cavitas glenoidalis. Sering cedera pada pelempar bisbol.","s":"Anatomi Muskuloskeletal sl. 74"},{"t":"ana","f":"Otot lengan atas","b":"Kompartemen anterior (fleksor, n. musculocutaneus): m. biceps brachii, m. brachialis, m. coracobrachialis. Kompartemen posterior (ekstensor, n. radialis): m. triceps brachii.","s":"Anatomi Muskuloskeletal sl. 76"},{"t":"ana","f":"Otot lengan bawah","b":"Fleksor-pronator berpangkal di epicondylus medialis (tendo fleksor bersama). Ekstensor-supinator berpangkal di epicondylus lateralis (tendo ekstensor bersama).","s":"Anatomi Muskuloskeletal sl. 79–80, 84"},{"t":"ana","f":"Otot tenar dan hipotenar","b":"Tenar: m. abductor pollicis brevis, m. flexor pollicis brevis, m. opponens pollicis (m. adductor pollicis di kompartemen aduktor). Hipotenar: m. abductor digiti minimi, m. flexor digiti minimi brevis, m. opponens digiti minimi.","s":"Anatomi Muskuloskeletal sl. 87"},{"t":"ana","f":"Vena superfisial lengan","b":"V. cephalica di tepi lateral, v. basilica di tepi medial yang bergabung dengan v. brachialis membentuk v. axillaris. Keduanya dihubungkan v. mediana cubiti di depan fossa cubiti.","s":"Anatomi Muskuloskeletal sl. 90"},{"t":"ana","f":"Otot paha kompartemen anterior","b":"M. iliopsoas, m. tensor fasciae latae, m. pectineus, m. sartorius, dan m. quadriceps femoris (rectus femoris, vastus lateralis, medialis, intermedius) yang tendonnya melekat pada patela.","s":"Anatomi Muskuloskeletal sl. 92"},{"t":"ana","f":"Trigonum femorale dan kanalis adduktorius","b":"Trigonum: proksimal lig. inguinale, medial m. adductor longus, lateral m. sartorius; isi dari lateral ke medial: n., a., v. femoralis. Kanalis adduktorius (±15 cm): a./v. femoralis, n. saphenus, saraf ke m. vastus medialis.","s":"Anatomi Muskuloskeletal sl. 94"},{"t":"ana","f":"Otot regio glutea","b":"Gluteus maximus, medius, mi
