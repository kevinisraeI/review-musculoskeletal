"s":"Buku teks: endokrin anak (hipotiroid kongenital) · tidak dibahas di PPT"},{"n":83,"t":"oa","q":"Seorang wanita usia 56 tahun datang ke poliklinik dengan keluhan bengkak pada lutut kanan, dialami sejak 1 bulan. Nyeri terutama bila berjalan dan kaku pada pagi hari. Berat badan 65 kg dan tinggi badan 152 cm. Riwayat trauma tidak dijumpai, kadar asam urat 4,8 mg/dL. Bagian yang mengalami kerusakan adalah pada:","o":[["a","Ligamentum collateral"],["b","Bursa poplitea"],["c","Ligamentum popliteal"],["d","Meniskus"],["e","Ligamentum cruciatum"]],"k":"d","e":"Perempuan 56 tahun, IMT ±28, nyeri lutut saat berjalan, tanpa trauma, asam urat normal → osteoartritis lutut. Kerusakan utama pada OA terjadi di rawan sendi; dari opsi yang tersedia, struktur intraartikular yang ikut degenerasi adalah meniskus.","w":"a: Ligamen kolateral tidak rusak pada OA tanpa trauma.|b: Bursa poplitea (kista Baker) bisa muncul sekunder, bukan kerusakan utama.|c: Ligamentum popliteal tidak rusak tanpa trauma.|e: Ligamen cruciatum rusak akibat trauma.","s":"PPT Osteoartritis sl. 2, 4","c":"Pada OA, kerusakan utama terjadi di rawan sendi (kartilago), yang tidak ada di opsi. Meniskus dipilih karena merupakan struktur intraartikular yang ikut mengalami degenerasi.","amb":1},{"n":84,"t":"neo","q":"Diagnosis dari gambaran mikroskopik di atas adalah...","o":[["a","Osteoma"],["b","Chondromyxoid fibroma"],["c","Fibrosarcoma"],["d","Osteosarcoma"],["e","Liposarcoma"]],"k":"c","e":"Gambar menunjukkan sel spindel padat yang tersusun membentuk pola herringbone (tulang ikan), khas fibrosarkoma.","w":"a: Osteoma berisi tulang lamelar matur.|b: Chondromyxoid fibroma berisi lobulus kondroid–miksoid.|d: Osteosarkoma menunjukkan sel ganas yang membentuk osteoid.|e: Liposarkoma berisi lipoblas.","s":"PPT Neoplasma Muskuloskeletal sl. 14","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsL eofit minimal di 2 tempat, tanpa sklerosis dan kista subkondral, dengan celah sendi baik.","w":"a: Derajat 4: celah hilang, sklerosis, kista.|b: Derajat 3: osteofit moderat, celah menyempit.|d: Derajat 0: tidak ada gambaran OA.|e: Derajat 1: sendi normal dengan osteofit minimal.","s":"PPT Osteoartritis sl. 25"},{"n":89,"t":"osp","q":"Fase awal dari proses remodeling tulang dikenal sebagai fase...","o":[["a","Fase resorption"],["b","Fase activation"],["c","Fase formation"],["d","Fase mineralization"],["e","Fase quiescent"]],"k":"b","e":"Siklus remodeling tulang: aktivasi (rekrutmen prekursor osteoklas) → resorpsi → reversal → formasi → mineralisasi → kembali ke fase istirahat. Prosesnya dimulai dari fase aktivasi.","w":"a: Resorpsi terjadi setelah aktivasi.|c: Formasi terjadi setelah reversal.|d: Mineralisasi adalah tahap akhir formasi.|e: Quiescent adalah keadaan istirahat, bukan tahap pertama proses remodeling (lihat catatan).","s":"PPT Farmakologi Homeostasis Tulang sl. 6","c":"Slide menomori fase istirahat (quiescent) sebagai 01 dan aktivasi sebagai 02. Karena fase istirahat adalah keadaan diam, proses remodeling dianggap dimulai dari aktivasi.","amb":1},{"n":90,"t":"neo","q":"Berdasarkan Sistem Klasifikasi AJCC edisi ke-7 untuk osteosarcoma, jika dijumpai derajat keganasan tinggi dengan diskontinuitas, berarti menunjukkan derajat...","o":[["a","IVA"],["b","IVB"],["c","IIB"],["d","III"],["e","II"]],"k":"d","e":"Pada AJCC edisi 7 untuk tumor tulang, stadium III adalah tumor derajat tinggi dengan diskontinuitas (skip metastasis di tulang yang sama).","w":"a: IVA adalah metastasis paru.|b: IVB adalah metastasis ke tempat lain (kelenjar getah bening/tulang lain).|c: IIB adalah tumor derajat tinggi berukuran >8 cm tanpa diskontinuitas.|e: II adalah tumor derajat tinggi tanpa diskontinuitas dan metastasis.","s":"Buku teks: AJCC 7th (MSTS/Enneking) · tidak dibahas di PPT"},{"n":91,"t":"osp","q":"Osteoporosis yang jarang terjadi dan biasanya terjadi pada anak-anak prepubertas adalah...","o":[["a","Osteoporosis juvenile"],["b","Osteoporosis sekunder"],["c","Osteoporosis senile"],["d","Osteoporosis idiopatik"],["e","Osteoporosis post menopause"]],"k":"a","e":"Osteoporosis juvenil idiopatik jarang terjadi, muncul pada anak prepubertas yang sebelumnya sehat, dan sering membaik setelah pubertas.","w":"b: Osteoporosis sekunder disebabkan penyakit atau obat.|c: Senile (tipe II) pada usia >70 tahun.|d: Idiopatik dewasa terjadi pada dewasa muda.|e: Pascamenopause (tipe I) pada perempuan setelah menopause.","s":"PPT Osteoporosis sl. 16"},{"n":92,"t":"oa","q":"Seorang pasien laki-laki umur 61 tahun datang dengan keluhan nyeri pada lutut terutama akan makin sakit jika berjalan atau beraktivitas. Dari pemeriksaan fisik didapat lutut yang sakit agak bengkak. Pemeriksaan BMI didapat lebih dari 27. Apa faktor risiko pada pasien tersebut?","o":[["a","Sering berjalan"],["b","Usia tua"],["c","Lutut bengkak"],["d","Usia dan BMI tinggi"],["e","BMI tinggi"]],"k":"d","e":"Faktor risiko OA pada pasien ini adalah usia (61 tahun) dan IMT tinggi (>27). Usia adalah faktor risiko terkuat, obesitas faktor risiko yang dapat diubah.","w":"a: Sering berjalan bukan faktor risiko.|b: Usia benar, tapi belum lengkap.|c: Lutut bengkak adalah gejala, bukan faktor risiko.|e: BMI benar, tapi belum lengkap.","s":"PPT Osteoartritis sl. 9"},{"n":93,"t":"ana","q":"Yang termasuk otot-otot hipotenar adalah...","o":[["a","M. trapezius"],["b","M. opponens pollicis"],["c","M. adductor pollicis"],["d","M. flexor pollicis brevis"],["e","M. abductor digiti quinti"]],"k":"e","e":"Otot hipotenar (sisi kelingking): m. abductor digiti minimi (quinti), m. flexor digiti minimi brevis, dan m. opponens digiti minimi.","w":"a: Trapezius otot punggung.|b: Opponens pollicis otot tenar.|c: Adductor pollicis otot telapak tangan bagian tengah.|d: Flexor pollicis brevis otot tenar.","s":"PPT Anatomi Muskuloskeletal sl. 87"},{"n":94,"t":"osp","q":"Tulang yang paling sering mengalami osteoporosis adalah...","o":[["a","Tulang patella"],["b","Tulang ulna"],["c","Tulang vertebra"],["d","Tulang pubis"],["e","Tulang humerus"]],"k":"c","e":"Tulang yang paling sering mengalami osteoporosis adalah tulang dengan banyak tulang trabekular: vertebra, kemudian kolum femoris dan radius distal.","w":"a: Patella jarang terkena.|b: Ulna jarang terkena.|d: Pubis jarang terkena.|e: Humerus proksimal bisa terkena, tapi bukan yang tersering.","s":"PPT Osteoporosis sl. 17"},{"n":95,"t":"rem","q":"Seorang laki-laki usia 50 tahun datang ke praktik dokter dengan keluhan nyeri dan timbul benjolan pada ibu jari kaki kiri sejak 3 bulan ini. Pada pemeriksaan fisik tampak ibu jari kaki kiri nyeri bila digerakkan serta pada sisi lateralnya tampak benjolan dengan diameter 2 cm yang melekat pada dasar. Pemeriksaan serum uric acid 8,7 mg/dl. Diagnosis keadaan di atas adalah...","o":[["a","Osteoarthritis"],["b","Osteoporosis"],["c","Arthritis rheumatoid"],["d","Osteopenia"],["e","Arthritis gout"]],"k":"e","e":"Laki-laki 50 tahun dengan nyeri dan benjolan (tofus) di MTP-1 serta asam urat 8,7 mg/dl → artritis gout (gout kronik bertofus).","w":"a: OA tidak menimbulkan tofus dan asam urat tinggi.|b: Osteoporosis tidak menimbulkan nyeri sendi.|c: RA mengenai sendi kecil tangan secara simetris.|d: Osteopenia adalah massa tulang rendah, tidak menimbulkan benjolan atau hiperurisemia.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 30"},{"n":96,"t":"rem","q":"Seorang perempuan usia 35 tahun datang ke poliklinik puskesmas dengan keluhan nyeri pada persendian yang sudah dirasakan selama kurang lebih 3 bulan. Pemeriksaan fisik didapatkan pembengkakan dan nyeri tekan pada sendi interfalang proksimal (PIP) II sampai V kanan dan kiri, sendi metakarpofalang (MCP) II sampai V kanan dan kiri, pergelangan tangan kanan dan kiri, dan sendi lutut kanan dan kiri. Hasil laboratorium: hemoglobin 11,5 g/dl, leukosit 8.000/µL, trombosit 260.000/µL, laju endap darah (LED) 80 mm/jam. Pasien di atas dapat dirujuk ke spesialis penyakit dalam atau konsultan reumatologi untuk mendapat pengobatan. Penatalaksanaan awal apakah yang bisa dilakukan oleh dokter umum di puskesmas pada pasien tersebut?","o":[["a","Edukasi/penjelasan tentang penyakit dan program pengobatan yang akan diterima"],["b","Edukasi/penjelasan tentang penyakit dan program pengobatan yang akan diterima, metilprednisolon 4 mg/tablet (2 tablet/hari)"],["c","DMARD"],["d","OAINS"],["e","Metilprednisolon 4 mg/tablet (2 tablet/hari)"]],"k":"b","e":"Di layanan primer, terapi awal RA adalah edukasi tentang penyakit dan program pengobatan, serta kortikosteroid dosis rendah (metilprednisolon 4–8 mg/hari) sebagai bridging sambil merujuk untuk DMARD.","w":"a: Edukasi saja belum cukup untuk RA aktif.|c: DMARD dimulai oleh spesialis.|d: OAINS dapat diberikan untuk nyeri, tapi tidak lengkap (lihat catatan).|e: Steroid tanpa edukasi tidak lengkap.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 27–28","c":"Slide: OAINS adalah terapi awal untuk nyeri, steroid dosis rendah (<10 mg) sebagai bridging. Kombinasi edukasi + steroid dosis rendah sesuai rekomendasi IRA, tetapi OAINS ({d}) juga dapat dibenarkan.","amb":1},{"n":97,"t":"neo","q":"Seorang laki-laki berumur 45 tahun dengan keluhan nyeri tulang pinggul disertai badan yang terasa lemah dan kepala sering pusing. Pasien juga mengatakan sejak usia 25 tahun telah 3 kali menderita patah tulang spontan pada tulang kaki dan tangan. Pada pemeriksaan rontgen dijumpai lesi litik pada tulang pelvis kiri. Pada pemeriksaan laboratorium dijumpai Hb 10 g/dl, hematokrit 30%, kadar protein darah 9,3 g/dl, albumin 3 g/dl, globulin 6,3 g/dl; pada pemeriksaan serum protein elektroforesis dijumpai monoclonal gammopathy. Diagnosis pasien adalah...","o":[["a","Osteoarthritis"],["b","Osteomielitis"],["c","Rheumatoid arthritis"],["d","Osteoporosis"],["e","Multiple myeloma"]],"k":"e","e":"Nyeri tulang, anemia, fraktur patologis, lesi litik di pelvis, globulin tinggi dengan rasio albumin/globulin terbalik, dan gamopati monoklonal pada elektroforesis → multiple myeloma.","w":"a: OA tidak menimbulkan lesi litik atau gamopati.|b: Osteomielitis disertai tanda infeksi.|c: RA tidak menimbulkan gamopati monoklonal.|d: Osteoporosis tidak menyebabkan anemia dan lesi litik.","s":"Buku teks: Robbins / IPD · tidak dibahas di PPT"},{"n":98,"t":"bio","q":"Pada proses pemindahan elektron di mitokondria dari kompleks III ke kompleks IV dilakukan oleh...","o":[["a","NADH"],["b","FADH₂"],["c","Sitokrom C"],["d","Suksinat"],["e","Ubiquinon"]],"k":"c","e":"Pada rantai transpor elektron, sitokrom c membawa elektron dari kompleks III (sitokrom bc1) ke kompleks IV (sitokrom oksidase).","w":"a: NADH memberi elektron ke kompleks I.|b: FADH2 memberi elektron ke kompleks II.|d: Suksinat adalah substrat kompleks II.|e: Ubiquinon membawa elektron dari kompleks I/II ke kompleks III.","s":"Buku teks: Lehninger/Harper · tidak dibahas di PPT"},{"n":100,"t":"osp","q":"Seseorang dinyatakan osteoporosis pada pemeriksaan BMD jika skor T...","o":[["a","Lebih dari -1"],["b","Lebih atau sama dengan 3"],["c","Lebih atau sama dengan 1"],["d","Kurang atau sama dengan -2,5"],["e","-1 s.d. -2,5"]],"k":"d","e":"Kriteria WHO: T-score ≤ −2,5 berarti osteoporosis; −1 sampai −2,5 osteopenia; ≥ −1 normal.","w":"a: T-score > −1 adalah normal.|b: Nilai positif setinggi ini tidak dipakai untuk diagnosis.|c: T-score ≥ +1 adalah normal.|e: −1 sampai −2,5 adalah osteopenia.","s":"PPT Osteoporosis sl. 23"},{"n":101,"t":"bio","q":"Pada menit-menit pertama olahraga, sumber energi yang dijumpai berasal dari...","o":[["a","Oksigen"],["b","Kreatin fosfat"],["c","Glikolisis"],["d","ADP-Pi hasil dari siklus sitrat"],["e","Fosforilasi oksidatif"]],"k":"b","e":"Pada detik-detik hingga menit pertama olahraga, ATP diregenerasi paling cepat dari kreatin fosfat (sistem fosfagen), baru kemudian dari glikolisis dan fosforilasi oksidatif.","w":"a: Oksigen bukan sumber energi, melainkan akseptor elektron.|c: Glikolisis menyusul setelah kreatin fosfat menipis.|d: Siklus sitrat lambat dan butuh oksigen.|e: Fosforilasi oksidatif dipakai pada olahraga yang lama.","s":"PPT Biokimia Otot sl. 22; PPT Praktikum Muskuloskeletal sl. 41"},{"n":102,"t":"ort","q":"Seorang wanita merasa sesak dadanya oleh karena adanya tekanan di bahunya oleh penyakit skoliosis yang dideritanya. Indikasi operasi pasien ini adalah...","o":[["a","Pneumonia"],["b","Asma"],["c","Malaria"],["d","Kompresi"],["e","Anafilaktik"]],"k":"d","e":"Operasi skoliosis diindikasikan bila kurva progresif dan berat sehingga menekan rongga toraks (kompresi) dan menimbulkan gangguan paru restriktif atau sesak.","w":"a: Pneumonia bukan indikasi operasi skoliosis.|b: Asma bukan indikasi.|c: Malaria bukan indikasi operasi skoliosis.|e: Anafilaksis bukan indikasi.","s":"PPT Tulang Belakang sl. 36; Buku teks: Apley"},{"n":103,"t":"rem","q":"Indikasi pemeriksaan cairan sendi adalah:","o":[["a","Kaku sendi"],["b","Keterbatasan dalam menggerakkan sendi"],["c","Trauma sendi"],["d","Nyeri sendi"],["e","Bertambah banyaknya cairan sendi"]],"k":"e","e":"Artrosentesis (pemeriksaan cairan sendi) diindikasikan bila ada efusi atau bertambahnya cairan sendi, terutama untuk membedakan artritis septik, kristal (gout/pseudogout), dan inflamasi.","w":"a: Kaku sendi saja tidak memerlukan aspirasi.|b: Keterbatasan gerak saja bukan indikasi.|c: Trauma sendi tanpa efusi tidak perlu diaspirasi.|d: Nyeri sendi saja bukan indikasi.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 24; Buku teks: IPD"},{"n":104,"t":"neo","q":"Berdasarkan Sistem Klasifikasi AJCC edisi ke-7 untuk osteosarcoma, derajat IIB adalah...","o":[["a","Derajat keganasan tinggi, ukuran kurang atau sama dengan 4"],["b","Derajat keganasan rendah, ukuran kurang atau sama dengan 8"],["c","Derajat keganasan tinggi, ukuran lebih dari 8"],["d","Derajat keganasan rendah, diskontinuitas"],["e","Derajat keganasan tinggi, ukuran lebih dari 4"]],"k":"c","e":"AJCC edisi 7 tumor tulang: IIA = derajat tinggi, ukuran ≤8 cm; IIB = derajat tinggi, ukuran >8 cm.","w":"a: Batas ukurannya 8 cm, bukan 4 cm.|b: Derajat rendah ≤8 cm adalah stadium IA.|d: Diskontinuitas adalah stadium III.|e: Batas ukurannya 8 cm, bukan 4 cm.","s":"Buku teks: AJCC 7th · tidak dibahas di PPT"},{"n":105,"t":"oa","q":"Perempuan berusia 47 tahun datang ke IGD dengan keluhan nyeri ketika berjalan. Pada pemeriksaan fisik tampak bengkak pada lutut dan nyeri bila ditekan. Pasien adalah seorang wanita dengan tinggi badan 155 cm dan berat badan 85 kg. Pada pemeriksaan laboratorium dijumpai antibodi anti-CCP negatif dan rheumatoid factor (RF) negatif serta serum C-reactive protein normal. Diagnosis pasien adalah...","o":[["a","Rheumatoid arthritis"],["b","Multiple myeloma"],["c","Osteomielitis"],["d","Osteoarthritis"],["e","Osteoporosis"]],"k":"d","e":"Perempuan 47 tahun dengan IMT ±35 (obesitas), nyeri lutut saat berjalan, RF dan anti-CCP negatif, serta CRP normal → osteoartritis lutut.","w":"a: RA tidak cocok karena RF, anti-CCP, dan CRP normal.|b: Multiple myeloma menimbulkan lesi litik dan anemia.|c: Osteomielitis disertai tanda infeksi dan CRP tinggi.|e: Osteoporosis tidak menimbulkan bengkak sendi.","s":"PPT Osteoartritis sl. 9; PPT Penyakit Tulang & Sendi (RA, Gout) sl. 24"},{"n":106,"t":"far","q":"d-tubocurarine dapat memblok reseptor ganglion otonom sehingga dapat menyebabkan...","o":[["a","Menghambat histamin"],["b","Kehilangan kesadaran"],["c","Hipotensi"],["d","Mual muntah"],["e","Hipertensi"]],"k":"c","e":"d-tubokurarin dapat memblok reseptor nikotinik ganglion otonom dan melepas histamin, sehingga menimbulkan hipotensi (dan bronkospasme).","w":"a: d-tubokurarin justru melepas histamin.|b: Pelemas otot tidak menghilangkan kesadaran.|d: Mual muntah bukan efek khas.|e: Blokade ganglion menurunkan, bukan menaikkan, tekanan darah.","s":"Buku teks: Katzung · tidak dibahas di PPT"},{"n":107,"t":"far","q":"Pelemas otot yang digunakan sebagai obat pilihan pada liver failure dan kidney failure adalah...","o":[["a","d-tubocurarine"],["b","Vekuronium"],["c","Atrakurium"],["d","Pancuronium"],["e","Gallamin"]],"k":"c","e":"Atrakurium dieliminasi secara spontan di plasma (eliminasi Hofmann) dan hidrolisis ester, tidak bergantung pada hati maupun ginjal, sehingga menjadi pilihan pada gagal hati dan gagal ginjal.","w":"a: d-tubokurarin diekskresi ginjal.|b: Vekuronium bergantung pada hati.|d: Pankuronium terutama diekskresi ginjal.|e: Galamin diekskresi utuh lewat ginjal.","s":"Buku teks: Katzung · tidak dibahas di PPT"},{"n":108,"t":"trm","q":"Seorang laki-laki dibawa ke IGD rumah sakit oleh temannya dengan keluhan tungkai bawah kanan sakit dan sulit digerakkan serta tidak dapat berjalan akibat terjatuh dari sepeda motor. Tanda vital dalam batas normal. Dari hasil pemeriksaan pada tungkai bawah kanan tidak dijumpai luka, bengkak (+), nyeri tekan (+), dan pemeriksaan neurovaskular distal baik. Hasil radiologis kasus tersebut tampak seperti pada gambar. Berdasarkan gambar garis fraktur, maka tipe fraktur pada pasien adalah...","o":[["a","Fraktur simple (tipe oblique)"],["b","Fraktur compound"],["c","Fraktur segmental"],["d","Fraktur kominutif"],["e","Fraktur displacement"]],"k":"a","e":"Gambar menunjukkan satu garis fraktur miring tanpa luka terbuka → fraktur simpel (tertutup) tipe oblik.","w":"b: Fraktur compound adalah fraktur terbuka; pasien ini tidak punya luka.|c: Segmental memiliki dua garis fraktur pada satu tulang.|d: Kominutif memiliki lebih dari dua fragmen.|e: Displacement menggambarkan pergeseran fragmen, bukan bentuk garis fraktur.","s":"PPT Fraktur sl. 13","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAHkAz0DASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECAwQFBgf/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/aAAwDAQACEAMQAAAB9OUOW0qZa6VV6okWupFpWotdKLymZN1EWutkyCix1Ba6WWFYWFbLVWJYVhY6WTcYk4wRodEotUA yang dianjurkan adalah ANA (sensitivitas >95%).","w":"b: Komplemen dipakai untuk menilai aktivitas penyakit, bukan skrining.|c: CRP tidak spesifik.|d: RF untuk artritis reumatoid.|e: Sel LE sudah jarang dipakai dan kurang sensitif.","s":"Buku teks: IPD (SLE) · tidak dibahas di PPT"},{"n":111,"t":"neo","q":"Diagnosis banding osteosarcoma adalah...","o":[["a","Fibrosarcoma"],["b","Rhabdomyosarcoma"],["c","Fibrous dysplasia"],["d","Liposarcoma"],["e","Chondroblastoma"]],"k":"a","e":"Osteosarkoma memiliki varian fibroblastik yang secara histologis mirip fibrosarkoma, sehingga fibrosarkoma menjadi diagnosis banding utama dari opsi yang ada.","w":"b: Rhabdomyosarcoma adalah tumor jaringan lunak.|c: Fibrous dysplasia jinak, kadang disebut sebagai DD radiologis (lihat catatan).|d: Liposarkoma adalah tumor jaringan lunak.|e: Chondroblastoma di epifisis dan jinak.","s":"PPT Neoplasma Muskuloskeletal sl. 18; Buku teks: Robbins","c":"PPT tidak menyebut diagnosis banding osteosarkoma. Fibrosarkoma (mirip varian fibroblastik secara histologis) paling tepat; fibrous dysplasia kadang disebut sebagai diagnosis banding radiologis yang jinak.","amb":1},{"n":112,"t":"osp","q":"Seorang perempuan berusia 65 tahun mengeluhkan nyeri punggung setelah jatuh dalam posisi duduk di kamar mandi 2 hari yang lalu. Pasien masih dapat berdiri dan berjalan setelah jatuh. Pasien memiliki riwayat histerektomi total pada usia 43 tahun sehingga sudah menopause sejak usia tersebut. Pasien sebelumnya bekerja sebagai salah satu manajer perusahaan swasta, sehingga rutin melakukan pemeriksaan kesehatan saat bekerja dan saat ini didapatkan tinggi badannya 165 cm, padahal sebelum purnatugas tinggi badannya 168 cm. Salah satu tanda osteoporosis pada pasien di atas adalah...","o":[["a","Pekerja berat"],["b","Perempuan"],["c","Terjatuh"],["d","Tinggi badan berkurang"],["e","Nyeri"]],"k":"d","e":"Tanda klinis osteoporosis adalah berkurangnya tinggi badan (akibat fraktur kompresi vertebra), kifosis (dowager hump), dan fraktur akibat trauma ringan.","w":"a: Pekerja berat bukan tanda osteoporosis.|b: Perempuan adalah faktor risiko, bukan tanda.|c: Terjatuh adalah pemicu fraktur, bukan tanda.|e: Nyeri tidak spesifik.","s":"PPT Osteoporosis sl. 17"},{"n":113,"t":"osp","q":"Seorang anak gadis usia 17 tahun dibawa ke poli Anda oleh ibunya dengan keluhan makin bongkok. Pada pemeriksaan dijumpai dowager hump. Diagnosis yang mungkin adalah...","o":[["a","Ankilosing spondilitis"],["b","Kifosis"],["c","Iskialgia"],["d","Radikulopati"],["e","Skoliosis"]],"k":"b","e":"Dowager hump adalah punuk akibat kifosis torakal, yang biasanya disebabkan fraktur kompresi vertebra pada osteoporosis.","w":"a: Ankilosing spondilitis membuat tulang belakang kaku (bamboo spine).|c: Iskialgia adalah nyeri sepanjang n. ischiadicus, tidak menimbulkan punuk.|d: Radikulopati adalah gangguan akar saraf.|e: Skoliosis adalah kelengkungan ke lateral.","s":"PPT Osteoporosis sl. 18"},{"n":114,"t":"ana","q":"Yang termasuk otot-otot tenar adalah...","o":[["a","M. flexor digiti quinti"],["b","M. abductor digiti quinti"],["c","M. adductor digiti quinti"],["d","M. opponens pollicis"],["e","M. palmaris brevis"]],"k":"d","e":"Otot tenar (sisi ibu jari): m. abductor pollicis brevis, m. flexor pollicis brevis, dan m. opponens pollicis.","w":"a: Flexor digiti quinti otot hipotenar.|b: Abductor digiti quinti otot hipotenar.|c: Tidak ada otot adductor digiti quinti.|e: Palmaris brevis adalah otot kecil di kulit hipotenar.","s":"PPT Anatomi Muskuloskeletal sl. 87"},{"n":115,"t":"osp","q":"Standar baku emas (gold standard) pemeriksaan osteoporosis adalah...","o":[["a","MRI"],["b","DEXA scan"],["c","CT scan"],["d","Quantitative ultrasound"],["e","Foto rontgen"]],"k":"b","e":"Baku emas pengukuran densitas mineral tulang untuk diagnosis osteoporosis adalah DEXA (DXA) scan.","w":"a: MRI bukan alat ukur densitas tulang.|c: QCT bisa mengukur densitas, tapi bukan baku emas dan radiasinya tinggi.|d: QUS hanya alat skrining.|e: Foto rontgen baru terlihat abnormal bila massa tulang hilang 30–40%.","s":"PPT Osteoporosis sl. 21, 24"},{"n":116,"t":"trm","q":"Seorang perempuan berusia 25 tahun dibawa ke rumah sakit oleh temannya dengan keluhan nyeri pada lutut kanan akibat terjatuh saat berlari dan lutut terbentur. Hal lain yang juga dialami penderita adalah lutut sulit digerakkan dan diregangkan, lutut terasa tidak stabil, dan kesulitan berjalan. Dokter melakukan pemeriksaan dan menduga adanya cedera pada ligamentum cruciatum anterior. Penatalaksanaan awal yang sesuai dengan kasus tersebut adalah...","o":[["a","Pemasangan gips"],["b","Berjalan memakai tongkat"],["c","Fisioterapi"],["d","Imobilisasi dan melakukan balutan"],["e","Reposisi"]],"k":"d","e":"Penatalaksanaan awal cedera ligamen lutut fase akut adalah imobilisasi dan balut tekan (prinsip RICE) untuk mengurangi nyeri dan bengkak; rekonstruksi/rehabilitasi menyusul kemudian.","w":"a: Gips tidak rutin untuk cedera ligamen.|b: Tongkat membantu, tapi bukan terapi awal utama.|c: Fisioterapi dimulai setelah fase akut.|e: Reposisi untuk fraktur atau dislokasi.","s":"PPT Fraktur sl. 81"},{"n":117,"t":"oml","q":"Wanita berusia 40 tahun datang dengan keluhan nyeri di panggul dan punggung belakang sejak 2 tahun lalu. Nyeri dirasakan menyebar sampai ke lutut dan pundak. Pada pemeriksaan fisik didapatkan fleksi di sendi lutut dan panggul. Pasien mengatakan bahwa ia seorang vegetarian sejak berusia 19 tahun. Pada pasien ini terjadi defisiensi apa?","o":[["a","Vitamin D"],["b","Protein"],["c","Kalsium"],["d","Karbohidrat"],["e","Besi"]],"k":"a","e":"Nyeri tulang difus di panggul dan punggung, kelemahan otot proksimal, deformitas fleksi, pada vegetarian lama → osteomalasia akibat defisiensi vitamin D (asupan dan paparan sinar matahari kurang).","w":"b: Defisiensi protein tidak menimbulkan gambaran ini.|c: Kalsium dari sayuran masih bisa tercukupi; masalah utamanya vitamin D.|d: Karbohidrat cukup pada vegetarian.|e: Defisiensi besi menimbulkan anemia.","s":"Buku teks: IPD (osteomalasia) · tidak dibahas di PPT"},{"n":118,"t":"osp","q":"Seorang laki-laki usia 65 tahun diajak temannya untuk melakukan pemeriksaan laboratorium gratis di suatu rumah sakit. Hasil pemeriksaan massa tulangnya -2. Laki-laki tersebut bertanya kepada dokter apa arti nilai tersebut. Penjelasan yang sesuai adalah...","o":[["a","Itu artinya kepadatan tulang Bapak sudah sangat kurang dan Bapak mengalami osteoporosis"],["b","Itu artinya kepadatan tulang Bapak sudah berkurang dan dapat berakibat osteoporosis"],["c","Bapak tidak usah khawatir, semua akan baik-baik saja"],["d","Itu artinya tulang Bapak masih baik, Pak"],["e","Bapak harus hati-hati kalau berjalan, tidak boleh jatuh"]],"k":"b","e":"T-score −2 berada di rentang −1 sampai −2,5, yaitu osteopenia: kepadatan tulang sudah berkurang dan berisiko menjadi osteoporosis.","w":"a: Osteoporosis bila T-score ≤ −2,5.|c: Menenangkan tanpa penjelasan tidak tepat.|d: Tulang tidak lagi normal.|e: Tidak menjelaskan arti nilai tersebut.","s":"PPT Osteoporosis sl. 23"},{"n":119,"t":"ana","q":"Bentuk istimewa costa I adalah...","o":[["a","Dijumpai tuberculum scaleni"],["b","Paling melengkung"],["c","Lebar dan kuat"],["d","Paling cembung"],["e","Angulus costae tidak jelas"]],"k":"a","e":"Costa I adalah yang paling pendek, lebar, dan paling melengkung, serta memiliki tuberculum m. scaleni anterior yang memisahkan sulcus a. subclavia dan v. subclavia. Ciri yang paling khas (istimewa) adalah tuberculum scaleni.","w":"b: Costa I memang paling melengkung, tapi ciri ini tidak khusus seperti tuberculum scaleni.|c: Lebar juga dimiliki costa I, tapi bukan ciri istimewanya.|d: \"Paling cembung\" bukan deskripsi baku.|e: Angulus costae tidak jelas juga pada costa lain.","s":"PPT Anatomi Muskuloskeletal sl. 21 (gambar); Buku teks: Snell"},{"n":120,"t":"oa","q":"Klasifikasi OA berdasarkan etiologi adalah...","o":[["a","Metabolik"],["b","Sekunder, OA iatrogenik"],["c","Primer/idiopatik, sekunder"],["d","Lutut"],["e","Primer/idiopatik, sekunder, tersier"]],"k":"c","e":"Berdasarkan etiologi, OA dibagi menjadi OA primer (idiopatik) dan OA sekunder (akibat trauma, kelainan metabolik, kongenital, dan lain-lain).","w":"a: Metabolik adalah salah satu penyebab OA sekunder.|b: Tidak ada klasifikasi \"OA iatrogenik\".|d: Lutut adalah klasifikasi berdasarkan lokasi.|e: Tidak ada OA tersier.","s":"PPT Osteoartritis sl. 16"},{"n":121,"t":"trm","q":"Seorang laki-laki usia 17 tahun yang sedang berolahraga lari tiba-tiba berhenti berlari akibat nyeri pada paha bagian belakang. Laki-laki tersebut kurang melakukan warm up sebelum berlari. Dari hasil pemeriksaan penderita mengalami cedera otot paha derajat 1. Otot yang mengalami cedera sesuai kasus tersebut adalah...","o":[["a","M. gastrocnemius"],["b","M. supraspinatus"],["c","M. soleus"],["d","M. vastus lateralis"],["e","M. semimembranosus"]],"k":"e","e":"Nyeri paha belakang mendadak saat sprint tanpa pemanasan → strain otot hamstring (m. biceps femoris, m. semitendinosus, m. semimembranosus).","w":"a: Gastrocnemius di betis.|b: Supraspinatus di bahu.|c: Soleus di betis.|d: Vastus lateralis di paha depan.","s":"PPT Fraktur sl. 67, 69"},{"n":122,"t":"rem","q":"Pemeriksaan yang mendukung untuk RA adalah...","o":[["a","Rheumatoid factor (RF), anti-cyclic citrullinated peptide antibodies (ACPA/anti-CCP/anti-MCV)"],["b","Rheumatoid factor (RF), LDH, anti-cyclic citrullinated peptide antibodies (ACPA/anti-CCP/anti-MCV)"],["c","Rheumatoid factor (RF), LDH"],["d","Rheumatoid factor (RF), LDH, anti-cyclic citrullinated peptide antibodies (ACPA)"],["e","Anti-cyclic citrullinated peptide antibodies (ACPA/anti-CCP/anti-MCV)"]],"k":"a","e":"Pemeriksaan serologi pendukung RA adalah rheumatoid factor (RF) dan antibodi anti-CCP (ACPA). Anti-MCV (anti-mutated citrullinated vimentin) juga termasuk ACPA. LDH tidak dipakai.","w":"b: LDH tidak dipakai untuk RA.|c: LDH tidak dipakai, anti-CCP tidak disebut.|d: LDH tidak dipakai.|e: Belum lengkap karena RF tidak disebut.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 24"},{"n":123,"t":"bio","q":"Pada kerusakan otot jantung, terjadi kenaikan enzim...","o":[["a","Isoenzim CK-MM"],["b","Isoenzim CK-BB"],["c","Kreatin fosfokinase"],["d","Kreatin kinase (CK)"],["e","Isoenzim CK-MB"]],"k":"e","e":"Isoenzim CK-MB terutama terdapat di otot jantung, sehingga naik pada kerusakan miokard.","w":"a: CK-MM khas otot rangka.|b: CK-BB khas otak.|c: Kreatin fosfokinase total tidak spesifik.|d: CK total tidak spesifik.","s":"Buku teks: Harper/Biokimia klinik · tidak dibahas di PPT"},{"n":124,"t":"bio","q":"Pada kerusakan otot bergaris (otot rangka), terjadi kenaikan enzim...","o":[["a","Isoenzim CK-MB"],["b","Isoenzim CK-BB"],["c","Kreatin kinase"],["d","Kreatin fosfokinase"],["e","Isoenzim CK-MM"]],"k":"e","e":"Isoenzim CK-MM (sekitar 98% CK otot rangka) naik pada kerusakan otot bergaris.","w":"a: CK-MB khas otot jantung.|b: CK-BB khas otak.|c: CK total tidak spesifik.|d: Kreatin fosfokinase total tidak spesifik.","s":"Buku teks: Harper/Biokimia klinik · tidak dibahas di PPT"},{"n":125,"t":"oa","q":"Moderat dengan osteofit moderat, deformitas ujung tulang, dan celah sendi sempit tergolong dalam","o":[["a","OA grade 3"],["b","OA grade 2"],["c","OA grade 4"],["d","OA grade 1"],["e","OA grade 0"]],"k":"a","e":"Kellgren–Lawrence derajat 3 (moderat): osteofit moderat, deformitas ujung tulang, dan celah sendi menyempit.","w":"b: Derajat 2: osteofit minimal di 2 tempat, celah baik.|c: Derajat 4: celah hilang, sklerosis, kista.|d: Derajat 1: sendi normal dengan osteofit minimal.|e: Derajat 0: normal.","s":"PPT Osteoartritis sl. 25"},{"n":126,"t":"ana","q":"Pada vertebra cervicalis, processus spinosusnya...","o":[["a","Berbentuk taji"],["b","Bercabang dua"],["c","Dijumpai fovea costalis"],["d","Bercabang tiga"],["e","Datar"]],"k":"b","e":"Vertebra servikal (C3–C6) memiliki processus spinosus yang pendek dan bercabang dua (bifid). C7 tidak bercabang dan panjang.","w":"a: Berbentuk taji (miring ke bawah) khas vertebra torakal.|c: Fovea costalis khas vertebra torakal.|d: Tidak ada processus spinosus bercabang tiga.|e: Processus spinosus datar dan lebar khas vertebra lumbal.","s":"PPT Anatomi Muskuloskeletal sl. 17; PPT Kuliah Muskuloskeletal dr. Erwin sl. 32"},{"n":127,"t":"bio","q":"Saat berolahraga jalan jarak jauh, sumber ATP yang digunakan berasal dari... karena...","o":[["a","Fosforilasi oksidatif, karena merupakan sumber ATP dengan laju yang relatif lambat karena banyak tahap enzimatik yang terlibat"],["b","Lipid, karena paling banyak disimpan di otot"],["c","Glikolisis, karena merupakan sumber energi paling cepat"],["d","Karbohidrat, karena merupakan sumber energi utama"],["e","Kreatin fosfat, karena merupakan sumber energi paling banyak disimpan"]],"k":"a","e":"Pada olahraga lama berintensitas sedang (jalan jauh), ATP dipasok terutama oleh fosforilasi oksidatif (aerob). Lajunya lambat karena melibatkan banyak tahap enzimatik, tetapi hasil ATP-nya paling besar.","w":"b: Lipid dioksidasi juga lewat fosforilasi oksidatif, tapi alasannya salah (lipid paling banyak disimpan di jaringan adiposa).|c: Glikolisis cepat, dipakai pada olahraga intensitas tinggi singkat.|d: Alasannya terlalu umum dan tidak menjelaskan jalurnya.|e: Kreatin fosfat jumlahnya sedikit dan cepat habis.","s":"PPT Biokimia Otot sl. 24"},{"n":128,"t":"ana","q":"Tulang panjang yang mempunyai fossa poplitea adalah...","o":[["a","Os femur"],["b","Os tibia"],["c","Os humerus"],["d","Crista colli costae"],["e","Os fibula"]],"k":"a","e":"Facies poplitea terdapat di permukaan posterior distal os femur, membentuk dasar fossa poplitea.","w":"b: Tibia membentuk batas bawah, tidak memiliki facies poplitea di distal.|c: Humerus tulang lengan atas.|d: Crista colli costae bagian dari tulang iga.|e: Fibula tidak memiliki facies poplitea.","s":"PPT Kuliah Muskuloskeletal dr. Erwin sl. 76","c":"Teks soal menulis \"fossa poplitea\". Fossa poplitea adalah nama regio di belakang lutut; yang terdapat pada tulang femur adalah facies poplitea."},{"n":129,"t":"rem","q":"Awitan penyakit RA umumnya terjadi pada usia...","o":[["a","35–60 tahun"],["b","60–70 tahun"],["c","Pada semua umur"],["d","20–50 tahun"],["e","50–60 tahun"]],"k":"a","e":"Awitan RA umumnya pada usia 35–60 tahun (puncak dekade 4–5), dengan perempuan 2–3 kali lebih sering.","w":"b: 60–70 tahun terlalu tua sebagai rentang awitan umum.|c: RA tidak merata di semua umur.|d: Rentang 20–50 tahun juga disebut di beberapa referensi (lihat catatan).|e: 50–60 tahun terlalu sempit.","s":"Buku teks: IPD","c":"PPT RA tidak menyebut usia awitan. Buku IPD menyebut puncak awitan dekade 4–5; rentang 35–60 maupun 20–50 tahun sama-sama dipakai di referensi berbeda.","amb":1},{"n":130,"t":"ana","q":"Otot yang memulai suatu gerakan abduksi lengan atas adalah...","o":[["a","M. deltoideus"],["b","M. trapezius"],["c","M. supraspinatus"],["d","M. infraspinatus"],["e","M. subscapularis"]],"k":"c","e":"M. supraspinatus memulai abduksi lengan atas pada 0–15° pertama; selanjutnya diteruskan oleh m. deltoideus.","w":"a: Deltoideus meneruskan abduksi setelah 15°.|b: Trapezius merotasi scapula untuk abduksi di atas 90°.|d: Infraspinatus melakukan rotasi eksternal.|e: Subscapularis melakukan rotasi internal.","s":"PPT Anatomi Muskuloskeletal sl. 74"},{"n":131,"t":"oml","q":"Di bawah ini yang termasuk penyebab dari osteomalasia, kecuali...","o":[["a","Defisiensi vitamin D"],["b","Lesi pada tubulus proksimal"],["c","Renal osteodistrofi"],["d","Hipofosfatasia"],["e","Kelebihan vitamin D"]],"k":"e","e":"Penyebab osteomalasia: defisiensi vitamin D, gangguan tubulus proksimal (hipofosfatemia), osteodistrofi renal, dan hipofosfatasia. Kelebihan vitamin D tidak menyebabkan osteomalasia.","w":"a: Defisiensi vitamin D penyebab utama.|b: Lesi tubulus proksimal menyebabkan kehilangan fosfat.|c: Osteodistrofi renal mengganggu aktivasi vitamin D.|d: Hipofosfatasia (defisiensi ALP) mengganggu mineralisasi.","s":"PPT Farmakologi Homeostasis Tulang sl. 16; Buku teks: IPD"},{"n":132,"t":"fis","q":"Pada saat berkontraksi terjadi pemendekan sarkomer. Berikut pernyataan yang benar tentang terjadinya pemendekan sarkomer saat berkontraksi:","o":[["a","Pita A tidak berubah, pita I dan zona H melebar"],["b","Pita A melebar, pita I dan Zona H melebar"],["c","Pita A tidak berubah, pita I dan zona H tidak berubah"],["d","Pita A melebar, pita I dan zona H memendek"],["e","Pita A tidak berubah, pita I dan zona H memendek"]],"k":"e","e":"Saat kontraksi, filamen tipis bergeser ke tengah sarkomer. Pita A (panjang filamen tebal) tetap, sedangkan pita I dan zona H memendek.","w":"a: Pita I dan zona H memendek, bukan melebar.|b: Pita A tetap; pita I dan zona H memendek.|c: Pita I dan zona H berubah (memendek).|d: Pita A tidak melebar.","s":"PPT Biokimia Otot sl. 7; Buku teks: Guyton"},{"n":133,"t":"oa","q":"Pada pengobatan non farmakologis OA tidak dianjurkan","o":[["a","Penambahan berat badan"],["b","Aplikasi lokal panas atau dingin"],["c","Olahraga aerobik"],["d","Menghindari aktivitas yang menyebabkan pembebanan pada sendi"],["e","Penggunaan penyokong sendi"]],"k":"a","e":"Terapi nonfarmakologis OA meliputi edukasi, penurunan berat badan, olahraga aerobik ringan, kompres panas/dingin, menghindari beban berlebih, dan penyokong sendi. Penambahan berat badan justru memperberat OA.","w":"b: Kompres panas/dingin dianjurkan.|c: Olahraga aerobik ringan dianjurkan.|d: Menghindari pembebanan sendi dianjurkan.|e: Penyokong sendi dianjurkan.","s":"PPT Osteoartritis sl. 29"},{"n":134,"t":"rem","q":"Perempuan 50 tahun pergi ke dokter dengan jari-jari tangan yang membengkak. Dari anamnesis pasien tersebut telah menderita penyakit sejak 6 bulan yang lalu. Pada pemeriksaan fisik ditemukan bahwa jari tangan kaku di mana inter-falangeal tidak dapat digerakkan. Hasil dari pemeriksaan laboratorium menunjukkan anti-CCP meningkat. Maka diagnosis penyakit ini adalah:","o":[["a","Soft tissue disorders"],["b","Gout arthritis"],["c","Osteomielitis"],["d","Osteoarthritis"],["e","Reumatoid arthritis"]],"k":"e","e":"Perempuan 50 tahun dengan bengkak dan kaku sendi interfalang selama 6 bulan disertai anti-CCP meningkat → artritis reumatoid. Anti-CCP sangat spesifik untuk RA.","w":"a: Soft tissue disorder tidak meningkatkan anti-CCP.|b: Gout tidak meningkatkan anti-CCP.|c: Osteomielitis adalah infeksi tulang.|d: OA tidak meningkatkan anti-CCP.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 24"},{"n":135,"t":"oml","q":"Osteomalasia ditandai oleh gangguan mineralisasi pada matriks tulang, antara lain:","o":[["a","Fosfat, Vitamin C, Kalsium"],["b","Vitamin A, vitamin D, fosfat"],["c","Vitamin A, kalsium, fosfat"],["d","Kalsium, vitamin A, vitamin C"],["e","Kalsium, fosfat, vitamin D"]],"k":"e","e":"Osteomalasia adalah gangguan mineralisasi matriks tulang akibat kekurangan kalsium, fosfat, atau vitamin D.","w":"a: Vitamin C berperan pada sintesis kolagen (skorbut), bukan mineralisasi.|b: Vitamin A tidak berperan langsung.|c: Vitamin A tidak berperan langsung.|d: Vitamin A dan C bukan penyebab osteomalasia.","s":"PPT Farmakologi Homeostasis Tulang sl. 14; Buku teks: IPD"},{"n":136,"t":"neo","q":"Seorang pasien laki-laki berusia 30 tahun datang ke poli bedah dengan keluhan benjolan di lengan atas kanan sejak 3 bulan yang lalu, semakin lama semakin membesar. Pada inspeksi tidak didapatkan tanda kemerahan dan tidak nyeri. Pada X-foto lengan atas kanan didapatkan gambaran benjolan pada tulang humerus bentuk onion skin. Diagnosis radiologis yang mungkin pada pasien ini adalah","o":[["a","Chondrosarcoma"],["b","Ewing sarcoma"],["c","Aneurysmal bone cyst"],["d","Enchondroma"],["e","Osteosarcoma"]],"k":"b","e":"Benjolan tulang humerus pada usia muda dengan reaksi periosteal berlapis seperti kulit bawang (onion skin) khas sarkoma Ewing.","w":"a: Chondrosarcoma: kalsifikasi matriks \"ring and arc\" pada usia tua.|c: ABC: lesi litik ekspansil multikistik dengan fluid–fluid level.|d: Enchondroma: lesi litik sentral di tulang tangan.|e: Osteosarkoma: sunburst dan segitiga Codman.","s":"PPT Neoplasma Muskuloskeletal sl. 19"},{"n":137,"t":"rem","q":"Anti-nuclear antibody test (ANA test) positif menunjukkan adanya antibodi yang menyerang sistem tubuh kita sendiri (reaksi autoimun). Yang merupakan penyakit autoimun pada sistem muskuloskeletal adalah...","o":[["a","Osteoarthritis"],["b","Low back pain"],["c","Soft tissue disorder"],["d","Penyakit pirai atau gout arthritis"],["e","Reumatoid arthritis"]],"k":"e","e":"RA adalah penyakit autoimun sistemik. OA, nyeri punggung bawah, gangguan jaringan lunak, dan gout bukan penyakit autoimun.","w":"a: OA penyakit degeneratif.|b: LBP umumnya mekanis/degeneratif.|c: Gangguan jaringan lunak umumnya mekanis atau akibat penggunaan berlebih.|d: Gout adalah penyakit deposit kristal (metabolik).","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 4"},{"n":138,"t":"bio","q":"Di bawah mikroskop, otot skelet tampak bercorak lurik dan kerjanya terkontrol secara sadar. Sel otot skelet merupakan serabut silindris yang panjang hingga sepanjang ototnya sendiri. Serabut/sel otot mengandung sejumlah inti (multinucleated) yang dikarenakan terjadi fusi sel semasa embrio. Sumber energi utama bagi kontraksi otot dalam bentuk ATP/kreatin fosfat. Energi kedua senyawa berenergi tinggi ini secara prioritas berasal dari:","o":[["a","Glikogen otot"],["b","Asam amino"],["c","Asam lemak"],["d","Glikogen hati"],["e","Glukosa darah"]],"k":"a","e":"Untuk kontraksi, otot terutama memakai glikogen otot sendiri sebagai sumber energi untuk membentuk ATP dan kreatin fosfat. Glikogen otot tidak dapat dilepas ke darah dan khusus dipakai otot itu sendiri.","w":"b: Asam amino bukan sumber prioritas.|c: Asam lemak dipakai saat istirahat dan olahraga lama, bukan prioritas kontraksi.|d: Glikogen hati menjaga glukosa darah, tidak langsung.|e: Glukosa darah dipakai, tapi setelah glikogen otot.","s":"PPT Biokimia Otot sl. 5; Buku teks: Harper"},{"n":139,"t":"bio","q":"Di bawah mikroskop, otot skelet tampak bercorak lurik dan kerjanya terkontrol secara sadar. Sel otot skelet merupakan serabut silindris yang panjang hingga sepanjang ototnya sendiri. Serabut/sel otot mengandung sejumlah inti (multinucleated) yang dikarenakan terjadi fusi sel semasa embrio. Protein abnormal otot skelet yang berasal dari gen abnormal akibat mutasi dan menyebabkan timbulnya penyakit Duchenne muscular dystrophy adalah:","o":[["a","Nebulin"],["b","Dystrophin"],["c","Troponin"],["d","Desmin"],["e","Myosin"]],"k":"b","e":"Distrofi muskular Duchenne disebabkan mutasi gen distrofin (kromosom Xp21) sehingga protein distrofin yang menambatkan sitoskeleton ke sarkolema tidak terbentuk.","w":"a: Nebulin mengatur panjang filamen aktin.|c: Troponin adalah protein regulator kontraksi.|d: Mutasi desmin menyebabkan miopati desmin.|e: Mutasi miosin menyebabkan kardiomiopati/miopati lain.","s":"Buku teks: Robbins · tidak dibahas di PPT"},{"n":140,"t":"ana","q":"Os radius terletak pada sisi lateral dari...","o":[["a","Facies dorsalis"],["b","Antebrachium"],["c","Facies volaris"],["d","Facies lateralis"],["e","Facies medialis"]],"k":"b","e":"Radius terletak di sisi lateral antebrachium (lengan bawah) pada posisi anatomis, sedangkan ulna di sisi medial.","w":"a: Facies dorsalis adalah permukaan belakang, bukan regio.|c: Facies volaris adalah permukaan depan.|d: Facies lateralis bukan regio.|e: Facies medialis bukan regio.","s":"PPT Anatomi Muskuloskeletal sl. 28–29"},{"n":141,"t":"bio","q":"Di bawah mikroskop, otot skelet tampak bercorak lurik dan kerjanya terkontrol secara sadar. Sel otot skelet merupakan serabut silindris yang panjang hingga sepanjang ototnya sendiri. Serabut/sel otot mengandung sejumlah inti (multinucleated) yang dikarenakan terjadi fusi sel semasa embrio. Komponen filamen tipis yang terdiri dari 2 utas berbentuk seperti tali adalah:","o":[["a","Troponin T"],["b","Tropomiosin"],["c","Actin"],["d","Troponin C"],["e","Troponin I"]],"k":"b","e":"Tropomiosin terdiri dari dua rantai α-heliks yang berpilin seperti tali, terletak di alur filamen aktin dan menutupi situs aktif miosin saat istirahat.","w":"a: Troponin T adalah protein globular pengikat tropomiosin.|c: F-aktin juga berbentuk dua untai berpilin (lihat catatan).|d: Troponin C adalah protein globular pengikat Ca2+.|e: Troponin I adalah protein globular penghambat.","s":"PPT Biokimia Otot sl. 8; Buku teks: Harper","c":"Tropomiosin terdiri dari dua rantai α-heliks berbentuk tali. Namun F-aktin juga sering digambarkan sebagai dua untai yang berpilin, sehingga opsi {c} bisa dibenarkan.","amb":1},{"n":142,"t":"bio","q":"Di bawah mikroskop, otot skelet tampak bercorak lurik dan kerjanya terkontrol secara sadar. Sel otot skelet merupakan serabut silindris yang panjang hingga sepanjang ototnya sendiri. Serabut/sel otot mengandung sejumlah inti (multinucleated) yang dikarenakan terjadi fusi sel semasa embrio. Protein berikut ikut membentuk filamen tipis sel otot dan berfungsi mengikat Ca2+...","o":[["a","Tropomiosin"],["b","Troponin C"],["c","Troponin T"],["d","Aktin"],["e","Troponin I"]],"k":"b","e":"Troponin C adalah bagian kompleks troponin di filamen tipis yang mengikat Ca2+, sehingga tropomiosin bergeser dan situs aktif aktin terbuka.","w":"a: Tropomiosin menutupi situs aktif aktin.|c: Troponin T mengikat tropomiosin.|d: Aktin berikatan dengan miosin.|e: Troponin I menghambat interaksi aktin–miosin.","s":"PPT Biokimia Otot sl. 8"},{"n":143,"t":"oa","q":"Inflamasi pada osteoartritis (OA) timbul akibat","o":[["a","Trauma"],["b","Produk degradasi tulang"],["c","Produk degradasi rawan sendi saja"],["d","Infeksi"],["e","Produk degradasi rawan sendi dan tulang"]],"k":"e","e":"Pada OA, produk degradasi rawan sendi dan tulang subkondral dilepas ke cairan sendi dan memicu sinovitis (inflamasi sekunder).","w":"a: Trauma adalah faktor risiko, bukan mekanisme inflamasi OA.|b: Produk degradasi tulang saja kurang lengkap.|c: Kata \"saja\" membuatnya kurang lengkap (lihat catatan).|d: OA bukan penyakit infeksi.","s":"PPT Osteoartritis sl. 4; Buku teks: IPD","c":"Buku IPD menyebut inflamasi OA dipicu produk degradasi rawan sendi. Opsi {c} (rawan sendi \"saja\") dan {e} (rawan sendi dan tulang) sama-sama bisa dibenarkan; {e} dipilih karena lebih lengkap.","amb":1},{"n":144,"t":"bio","q":"Berikut ini adalah keadaan-keadaan yang dapat memicu terjadinya kontraksi...","o":[["a","Turunnya kadar Ca2+ di dalam sel, troponin menghambat interaksi aktin-miosin, adanya ATP"],["b","Meningkatnya kadar Ca2+ di dalam sel, troponin menghambat interaksi aktin-miosin, adanya ATP"],["c","Meningkatnya kadar Ca2+ di dalam sel, troponin menghambat interaksi aktin-miosin, tidak adanya ATP"],["d","Meningkatnya kadar Ca2+ di dalam sel, troponin merangsang interaksi aktin-miosin, adanya ATP"],["e","Turunnya kadar Ca2+ di dalam sel, troponin menghambat interaksi aktin-miosin, tidak adanya ATP"]],"k":"d","e":"Kontraksi terjadi bila Ca2+ intrasel meningkat, troponin (C) mengikat Ca2+ sehingga interaksi aktin–miosin terbuka, dan ATP tersedia untuk siklus cross bridge.","w":"a: Ca2+ turun dan troponin menghambat menyebabkan relaksasi.|b: Troponin yang menghambat interaksi tidak memicu kontraksi.|c: Tanpa ATP, kepala miosin terkunci (rigor).|e: Ini kondisi rigor, bukan kontraksi.","s":"PPT Biokimia Otot sl. 8, 11; PPT Praktikum Muskuloskeletal sl. 34"},{"n":145,"t":"bio","q":"Berikut ini adalah keadaan-keadaan yang dapat memicu terjadinya relaksasi...","o":[["a","Meningkatnya kadar Ca2+ di dalam sel, troponin menghambat interaksi aktin-miosin, adanya ATP"],["b","Turunnya kadar Ca2+ di dalam sel, troponin menghambat interaksi aktin-miosin, adanya ATP"],["c","Turunnya kadar Ca2+ di dalam sel, troponin menghambat interaksi aktin-miosin, tidak adanya ATP"],["d","Meningkatnya kadar Ca2+ di dalam sel, troponin menghambat interaksi aktin-miosin, tidak adanya ATP"],["e","Meningkatnya kadar Ca2+ di dalam sel, troponin merangsang interaksi aktin-miosin, adanya ATP"]],"k":"b","e":"Relaksasi terjadi bila Ca2+ dipompa kembali ke retikulum sarkoplasma (Ca2+ intrasel turun), troponin–tropomiosin kembali menghambat interaksi aktin–miosin, dan ATP tersedia untuk melepas cross bridge serta menjalankan pompa Ca2+.","w":"a: Ca2+ yang meningkat memicu kontraksi.|c: Tanpa ATP cross bridge tidak dapat lepas (rigor).|d: Ca2+ meningkat dan tanpa ATP bukan kondisi relaksasi.|e: Ini kondisi kontraksi.","s":"PPT Biokimia Otot sl. 8, 11; PPT Praktikum Muskuloskeletal sl. 34"},{"n":146,"t":"rem","q":"Pemeriksaan asam urat darah diperlukan untuk mendiagnosis...","o":[["a","Osteonekrosis"],["b","Artritis gout"],["c","Charcot artritis"],["d","Artritis reumatoid"],["e","Osteoartritis"]],"k":"b","e":"Kadar asam urat darah diperiksa untuk mendiagnosis dan memantau artritis gout (hiperurisemia).","w":"a: Osteonekrosis didiagnosis dengan pencitraan.|c: Artropati Charcot terkait neuropati.|d: RA didiagnosis dengan RF dan anti-CCP.|e: OA didiagnosis secara klinis dan radiologis.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 30"},{"n":148,"t":"oml","q":"Gangguan proses tulang yang terjadi pada pasien rakitis adalah","o":[["a","Mineralisasi tulang"],["b","Proses osteoklas tulang"],["c","Proses osteoblas tulang"],["d","Osifikasi endokondral (intrakartilaginosa)"],["e","Osifikasi intramembran"]],"k":"a","e":"Rakitis (rickets) adalah gangguan mineralisasi tulang dan lempeng pertumbuhan pada anak, terutama akibat defisiensi vitamin D.","w":"b: Fungsi osteoklas tidak menjadi masalah utama.|c: Osteoblas tetap membentuk osteoid; mineralisasinya yang gagal.|d: Osifikasi endokondral terganggu akibat gagal mineralisasi, bukan prosesnya sendiri.|e: Osifikasi intramembran tidak menjadi masalah utama.","s":"Buku teks: IPD/Robbins · tidak dibahas di PPT"},{"n":149,"t":"oa","q":"Yang tidak termasuk kriteria diagnosis OA sendi lutut adalah...","o":[["a","Nyeri lutut"],["b","Pada pemeriksaan radiologi dijumpai osteofit"],["c","Kaku sendi lebih dari 30 menit"],["d","LED lebih dari 20 mm/jam"],["e","Usia lebih dari 50 tahun"]],"k":"c","e":"Kriteria klasifikasi OA lutut (ACR): nyeri lutut + osteofit + minimal satu dari: usia >50 tahun, kaku pagi <30 menit, krepitus. Jadi kaku sendi >30 menit tidak termasuk kriteria.","w":"a: Nyeri lutut adalah kriteria utama.|b: Osteofit adalah kriteria radiologis.|d: Kriteria laboratorium adalah LED <40 mm/jam, jadi opsi ini juga bermasalah (lihat catatan).|e: Usia >50 tahun termasuk kriteria.","s":"PPT Osteoartritis sl. 21–22","c":"Kriteria ACR memakai kaku sendi <30 menit dan LED <40 mm/jam, sehingga opsi {c} (kaku >30 menit) dan {d} (LED >20 mm/jam) sama-sama bukan kriteria.","amb":1},{"n":150,"t":"trm","q":"Seorang pria berusia 27 tahun datang ke IGD dengan keluhan kaki kanan sulit digerakkan sejak 2 jam yang lalu. Pasien mengalami kecelakaan lalu lintas saat mengendarai sepeda motor, ditabrak oleh mobil dengan kecepatan lebih dari 40 km/jam. Pingsan (-), muntah (-), sesak (+). Tatalaksana pasien ini adalah...","o":[["a","ORIF cito fraktur femur dextra"],["b","Water sealed drainage"],["c","Eksternal fiksasi fraktur femur dextra + ATLS survey"],["d","ATLS survey"],["e","Specialist referral"]],"k":"d","e":"Pasien trauma multipel dengan sesak (gangguan breathing) harus ditangani dengan primary survey ATLS (ABCDE) terlebih dahulu sebelum menangani fraktur.","w":"a: ORIF tidak dilakukan sebelum pasien stabil.|b: WSD hanya dilakukan bila terbukti pneumotoraks/hematotoraks.|c: Fiksasi eksternal + ATLS juga bisa dibenarkan sebagai damage control (lihat catatan).|e: Rujukan dilakukan setelah stabilisasi awal.","s":"PPT Fraktur sl. 21","c":"Sesak (+) menandakan gangguan breathing, sehingga primary survey ATLS didahulukan. Opsi {c} (fiksasi eksternal + ATLS) juga dapat dibenarkan sebagai damage control orthopaedics.","amb":1},{"n":151,"t":"trm","q":"Seorang perempuan 20 tahun mengeluh nyeri pergelangan kaki kanan belakang setelah melakukan smash pada permainan bulu tangkis 1 jam yang lalu. Dari pemeriksaan fisik ditemukan bulging M. gastrocnemius dan tidak dapat melakukan gerakan dorsofleksi dari ankle joint. Apakah diagnosis yang tepat pada kasus di atas?","o":[["a","Peroneal palsy"],["b","Fraktur malleolus"],["c","Ruptur tendon Achilles"],["d","Fraktur calcaneus"],["e","Dislokasi ankle joint"]],"k":"c","e":"Nyeri mendadak di belakang pergelangan kaki saat gerakan dorong (smash), otot gastrocnemius tampak menggembung karena tertarik ke atas (retraksi), dan fungsi pergelangan kaki terganggu → ruptur tendon Achilles.","w":"a: Peroneal palsy menimbulkan foot drop tanpa trauma lokal.|b: Fraktur malleolus nyeri di sisi medial/lateral, bukan belakang.|d: Fraktur calcaneus akibat jatuh dari ketinggian.|e: Dislokasi ankle disertai deformitas jelas.","s":"PPT Fraktur sl. 73","c":"Teks soal menulis \"tidak dapat melakukan gerakan dorsofleksi\". Pada ruptur tendon Achilles yang hilang adalah plantar fleksi (tidak bisa berjinjit, tes Thompson positif); dorsofleksi justru tetap bisa."},{"n":152,"t":"bio","q":"Di bawah mikroskop, otot skelet tampak bercorak lurik dan kerjanya terkontrol secara sadar. Sel otot skelet merupakan serabut silindris yang panjang hingga sepanjang ototnya sendiri. Serabut/sel otot mengandung sejumlah inti (multinucleated) yang dikarenakan terjadi fusi sel semasa embrio. Protein berikut merupakan bagian dari filamen tipis:","o":[["a","Titin"],["b","Tropomiosin"],["c","Nebulin"],["d","Dystrophin"],["e","Desmin"]],"k":"b","e":"Filamen tipis tersusun dari aktin, tropomiosin, dan kompleks troponin.","w":"a: Titin adalah protein elastik raksasa penghubung miosin ke garis Z.|c: Nebulin adalah protein pengatur panjang aktin, bukan komponen utama filamen tipis di slide.|d: Distrofin menambatkan sitoskeleton ke sarkolema.|e: Desmin adalah filamen intermediat penghubung garis Z.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 12; PPT Praktikum Muskuloskeletal sl. 24"},{"n":153,"t":"fis","q":"Pada kontraksi otot, retikulum sarkoplasma berfungsi untuk...","o":[["a","Mengeluarkan ion Ca++ ke sitosol"],["b","Pembebasan Ca++ dari troponin"],["c","Filament sliding"],["d","Melepaskan ikatan aktin dan miosin"],["e","Power stroke"]],"k":"a","e":"Saat potensial aksi menjalar lewat tubulus T, retikulum sarkoplasma (sisterna terminalis) melepaskan Ca2+ ke sitosol sehingga kontraksi dimulai.","w":"b: Lepasnya Ca2+ dari troponin terjadi saat relaksasi.|c: Filament sliding adalah kerja aktin–miosin.|d: Pelepasan ikatan aktin–miosin membutuhkan ATP.|e: Power stroke dilakukan kepala miosin.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 15; PPT Praktikum Muskuloskeletal sl. 34"},{"n":154,"t":"oa","q":"Pada penderita dengan keluhan nyeri sendi perlu ditanyakan kecuali","o":[["a","Tidak perlu ditanyakan riwayat keluarga"],["b","Faktor meringankan keluhan"],["c","Gejala ekstra artikular"],["d","Faktor memperberat keluhan"],["e","Faktor risiko"]],"k":"a","e":"Anamnesis nyeri sendi harus mencakup faktor yang memperberat dan meringankan, gejala ekstraartikular, faktor risiko, dan riwayat keluarga. Jadi pernyataan \"tidak perlu ditanyakan riwayat keluarga\" salah.","w":"b: Faktor yang meringankan perlu ditanyakan.|c: Gejala ekstraartikular perlu ditanyakan.|d: Faktor yang memperberat perlu ditanyakan.|e: Faktor risiko perlu ditanyakan.","s":"PPT Osteoartritis sl. 9"},{"n":155,"t":"far","q":"Seorang laki-laki berusia 54 tahun datang ke poli umum RS dengan keluhan nyeri dan bengkak pada jempol kaki kanan berwarna kemerahan sehingga pasien sulit berjalan. Pasien pernah mengalami keluhan yang sama 6 bulan yang lalu dan 2 hari yang lalu sudah pernah diperiksa kadar asam urat dalam darahnya saat itu 9,1 mg/dL. Di bawah ini yang merupakan jenis terapi urikosurik untuk pasien di atas adalah:","o":[["a","Alopurinol"],["b","Natrium bikarbonat"],["c","Kolkisin"],["d","Probenesid"],["e","Furosemid"]],"k":"d","e":"Probenesid adalah obat urikosurik yang menghambat reabsorpsi asam urat di tubulus proksimal sehingga ekskresi asam urat meningkat.","w":"a: Alopurinol adalah inhibitor xantin oksidase (menurunkan produksi).|b: Natrium bikarbonat untuk alkalinisasi urin.|c: Kolkisin adalah antiinflamasi untuk serangan akut.|e: Furosemid justru meningkatkan asam urat.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 34"},{"n":156,"t":"trm","q":"Seorang anak laki-laki 10 tahun diantar ke Unit Gawat Darurat RS dengan keluhan tangan kanan sakit. Keluhan dirasakan setelah jatuh dari pohon dengan posisi telapak tangan menekan ke tanah satu jam yang lalu. Pada pemeriksaan fisik didapatkan nyeri saat digerakkan, nyeri tekan pada epifisis searah ibu jari, lengan bawah bengkak, serta fungsio laesa (+). Hasil foto rontgen dijumpai fraktur pada antebrachii dextra. Apakah fraktur pada kasus di atas?","o":[["a","Humerus fracture"],["b","Carpal fracture"],["c","Metacarpal fracture"],["d","Smith fracture"],["e","Colles fracture"]],"k":"e","e":"Jatuh bertumpu telapak tangan dengan nyeri tekan di distal radius (sisi ibu jari) → fraktur radius distal tipe Colles (fragmen distal bergeser ke dorsal).","w":"a: Fraktur humerus berada di lengan atas.|b: Fraktur karpal (skafoid) nyeri di snuffbox, bukan antebrachii.|c: Fraktur metakarpal di telapak tangan.|d: Fraktur Smith terjadi akibat jatuh bertumpu punggung tangan (fragmen bergeser ke volar).","s":"PPT Fraktur sl. 7; PPT Anatomi Muskuloskeletal sl. 32"},{"n":157,"t":"trm","q":"Seorang wanita datang ke IGD dengan percobaan bunuh diri melompat dari lantai 2 suatu ruko. Pasien adalah pemakai narkoba dan pada bulan Februari 2013 mengalami overdosis namun dapat diselamatkan. Saat ini pasien tidak dapat menggerakkan kaki sebelah kiri. Mual muntah (+), pingsan (-). Tatalaksana pasien ini adalah...","o":[["a","ORIF fraktur femur sinistra"],["b","FAST"],["c","Specialist referral"],["d","ATLS 2nd survey"],["e","Open laparatomi cito"]],"k":"d","e":"Pasien trauma jatuh dari ketinggian yang sudah stabil pada primary survey dilanjutkan dengan secondary survey ATLS (pemeriksaan head-to-toe) untuk mencari cedera lain sebelum tindakan definitif.","w":"a: ORIF dilakukan setelah survei selesai dan pasien stabil.|b: FAST adalah adjunct primary survey, juga dapat dibenarkan bila curiga trauma abdomen (lihat catatan).|c: Rujukan dilakukan setelah stabilisasi.|e: Laparotomi cito hanya bila ada bukti perdarahan intraabdomen dengan hemodinamik tidak stabil.","s":"PPT Fraktur sl. 21; Buku teks: ATLS","c":"Muntah (+) bisa mengarah ke trauma abdomen, sehingga FAST (adjunct primary survey) juga dapat dibenarkan.","amb":1},{"n":158,"t":"fis","q":"Di bawah mikroskop, otot skelet tampak bercorak lurik dan kerjanya terkontrol secara sadar. Sel otot skelet merupakan serabut silindris yang panjang hingga sepanjang ototnya sendiri. Serabut/sel otot mengandung sejumlah inti (multinucleated) yang dikarenakan terjadi fusi sel semasa embrio. Sarkolema adalah komponen sel otot. Sarkolema ini sama dengan komponen sel berikut:","o":[["a","Inti sel"],["b","Retikulum endoplasma"],["c","Sitosol"],["d","Apparatus Golgi"],["e","Membran plasma"]],"k":"e","e":"Sarkolema adalah membran plasma sel otot.","w":"a: Inti sel otot disebut nukleus.|b: Retikulum endoplasma pada otot disebut retikulum sarkoplasma.|c: Sitosol pada otot disebut sarkoplasma.|d: Aparatus Golgi tidak punya nama khusus.","s":"PPT Praktikum Muskuloskeletal sl. 22; PPT Sistem Muskuloskeletal (Fisiologi) sl. 14"},{"n":159,"t":"trm","q":"Pada suatu malam di suatu jalan raya terlihat kendaraan sangat padat. Dari kejauhan, tepatnya di perempatan jalan, nampak sekumpulan pemuda geng motor sedang asyik mengendarai motornya dengan kecepatan tinggi. Saat berbelok ke arah jalan yang padat merayap tersebut, nampak seorang pemuda dari geng tersebut kehilangan kendali motornya. Akibatnya, ia menabrak pembatas jalan dengan keras sehingga mengakibatkan tulang lengan atasnya patah dan terlihat dari luar. Selain itu pemuda tersebut juga mengalami perdarahan hebat. Akibat dari kecelakaan itu, gangguan/kelainan apakah yang terjadi pada pemuda tersebut?","o":[["a","Swelling wound"],["b","Fraktur tertutup pada lengan atas"],["c","Hematoma"],["d","Perdarahan hebat"],["e","Gangguan sistem muskuloskeletal yakni fraktur terbuka pada lengan atas dan gangguan sistem kardiovaskular karena terjadi perdarahan hebat"]],"k":"e","e":"Tulang lengan atas patah dan tampak dari luar berarti fraktur terbuka (sistem muskuloskeletal), disertai perdarahan hebat yang mengganggu sistem kardiovaskular. Opsi {e} paling lengkap.","w":"a: Swelling wound tidak menggambarkan fraktur.|b: Tulang tampak dari luar berarti fraktur terbuka, bukan tertutup.|c: Hematoma tidak menggambarkan keseluruhan kondisi.|d: Perdarahan hebat benar, tapi belum lengkap.","s":"PPT Fraktur sl. 7, 9"},{"n":160,"t":"ort","q":"Kuman terbanyak penyebab osteomielitis adalah...","o":[["a","H. influenzae"],["b","N. gonorrhoeae"],["c","S. aureus"],["d","M. tuberculosis"],["e","S. epidermidis"]],"k":"c","e":"Staphylococcus aureus adalah penyebab tersering osteomielitis pada semua kelompok umur.","w":"a: H. influenzae dulu sering pada anak kecil, tapi sudah jarang sejak vaksinasi.|b: N. gonorrhoeae penyebab artritis septik pada dewasa muda aktif seksual.|d: M. tuberculosis penyebab spondilitis TB, bukan tersering.|e: S. epidermidis tersering pada infeksi implan.","s":"PPT Infeksi Tulang sl. 20"},{"n":161,"t":"ana","q":"Pada vertebra thoracalis, processus spinosusnya panjang, menuju ke bawah, dan mempunyai...","o":[["a","Bercabang tiga"],["b","Bercabang dua"],["c","Berbentuk taji menghadap kaudal"],["d","Datar"],["e","Dijumpai fovea costalis"]],"k":"c","e":"Vertebra torakal memiliki processus spinosus yang panjang, mengarah ke bawah, dan berbentuk taji menghadap kaudal.","w":"a: Tidak ada processus spinosus bercabang tiga.|b: Bercabang dua khas vertebra servikal.|d: Datar dan lebar khas vertebra lumbal.|e: Fovea costalis ada di corpus dan processus transversus torakal, bukan di processus spinosus (lihat catatan).","s":"PPT Anatomi Muskuloskeletal sl. 17; PPT Kuliah Muskuloskeletal dr. Erwin sl. 32","c":"Tabel di slide: processus spinosus torakal berbentuk taji mengarah ke bawah; fovea costalis ada di korpus dan processus transversus. Kalimat soal bisa dibaca ke dua arah.","amb":1},{"n":162,"t":"far","q":"Celebrex adalah obat antiinflamasi nonsteroid golongan...","o":[["a","Celecoxib"],["b","Piroksikam"],["c","Indometasin"],["d","Ketoprofen"],["e","Nabumetone"]],"k":"a","e":"Celebrex adalah nama dagang celecoxib, OAINS penghambat selektif COX-2.","w":"b: Piroksikam OAINS golongan oksikam (nonselektif).|c: Indometasin OAINS golongan asam asetat.|d: Ketoprofen OAINS golongan asam propionat.|e: Nabumeton OAINS golongan non-asam.","s":"Buku teks: Katzung · tidak dibahas di PPT"},{"n":163,"t":"ana","q":"Seorang laki-laki berusia 12 tahun dibawa ke UGD dengan luka pada articulatio cubiti dextra setelah jatuh dari sepeda. Hasil radiologis menunjukkan fraktur pada epicondylus medialis humeri. Otot manakah yang paling mungkin mengalami paralisis akibat trauma tersebut?","o":[["a","M. flexor digitorum superficialis"],["b","M. biceps brachii"],["c","M. flexor carpi ulnaris"],["d","M. brachioradialis"],["e","M. supinator"]],"k":"c","e":"Epicondylus medialis humeri adalah origo otot fleksor lengan bawah, dan n. ulnaris berjalan tepat di belakangnya. Cedera di sini paling mungkin mengganggu m. flexor carpi ulnaris yang dipersarafi n. ulnaris.","w":"a: FDS dipersarafi n. medianus.|b: Biceps brachii dipersarafi n. musculocutaneus.|d: Brachioradialis berorigo di sisi lateral, dipersarafi n. radialis.|e: Supinator berorigo di epicondylus lateralis, dipersarafi n. radialis.","s":"PPT Anatomi Muskuloskeletal sl. 79; Buku teks: Snell"},{"n":164,"t":"oml","q":"Penyebab terjadinya osteomalasia salah satunya adalah defisiensi fosfat. Hal di bawah ini dapat menyebabkan defisiensi fosfat...","o":[["a","Tidak ada kelainan ginjal"],["b","Adanya kelainan genetik"],["c","Konsumsi obat antikejang"],["d","Tersedianya diet yang tinggi fosfat"],["e","Konsumsi antasida"]],"k":"e","e":"Antasida (terutama yang mengandung aluminium) mengikat fosfat di usus sehingga absorpsinya turun dan dapat menimbulkan hipofosfatemia dan osteomalasia.","w":"a: Ginjal normal tidak menyebabkan defisiensi fosfat.|b: Kelainan genetik (hipofosfatemia X-linked) juga penyebab (lihat catatan).|c: Obat antikejang menyebabkan osteomalasia lewat gangguan metabolisme vitamin D, bukan defisiensi fosfat langsung.|d: Diet tinggi fosfat tidak menimbulkan defisiensi.","s":"Buku teks: IPD (osteomalasia)","c":"Antasida (aluminium) mengikat fosfat. Kelainan genetik (hipofosfatemia X-linked) juga penyebab defisiensi fosfat, sehingga opsi {b} juga bisa dibenarkan.","amb":1},{"n":166,"t":"bio","q":"Kontraksi otot skelet terjadi via suatu sistem dorong/pergeseran filamen dan keadaan ini di bawah regulasi osilasi/naik turunnya kadar Ca2+ intrasel. Tubulus-T (transverse tubules) pada sarkolema merupakan ribuan invaginasi yang masing-masing membentuk saluran (tunnel) dari permukaan hingga pusat serabut/sel otot dan berkontak dengan cisterna terminalis dari retikulum sarkoplasma. Action potential dari serabut saraf berjalan menuju sel otot dan tiba di retikulum sarkoplasma setelah melalui tubulus-T. Kalsium ini dilepaskan ke dalam sarkoplasma melalui reseptor yang dinamakan:","o":[["a","DHPR"],["b","Dihydropyridine receptor"],["c","Ryanodine receptor-1"],["d","Ca2+ voltage channel"],["e","Tubulus T"]],"k":"c","e":"Potensial aksi di tubulus T diterima oleh reseptor dihidropiridin (DHPR) sebagai sensor tegangan, yang kemudian membuka reseptor rianodin-1 (RyR1) di retikulum sarkoplasma sehingga Ca2+ dilepaskan ke sarkoplasma.","w":"a: DHPR adalah sensor tegangan di tubulus T, bukan kanal pelepas Ca2+ dari RS.|b: Sama dengan DHPR.|d: Kanal Ca2+ voltase adalah DHPR, bukan kanal pelepas RS.|e: Tubulus T adalah struktur, bukan reseptor.","s":"Buku teks: Harper/Guyton · tidak dibahas di PPT"},{"n":167,"t":"osp","q":"Di bawah ini yang tidak termasuk faktor risiko osteoporosis adalah","o":[["a","Penggunaan steroid"],["b","Merokok"],["c","Trauma"],["d","Kekurangan androgen"],["e","Kelebihan estrogen"]],"k":"e","e":"Estrogen bersifat protektif terhadap tulang (menghambat osteoklas), sehingga kelebihan estrogen bukan faktor risiko osteoporosis. Justru kekurangan estrogen yang menjadi faktor risiko.","w":"a: Steroid adalah faktor risiko osteoporosis sekunder.|b: Merokok adalah faktor risiko.|c: Trauma adalah faktor risiko fraktur, bukan osteoporosis (lihat catatan).|d: Kekurangan androgen adalah faktor risiko.","s":"PPT Osteoporosis sl. 11, 13","c":"Estrogen bersifat protektif sehingga kelebihannya bukan faktor risiko. Trauma ({c}) juga bukan faktor risiko osteoporosis, melainkan pemicu fraktur.","amb":1},{"n":168,"t":"oml","q":"Di bawah ini yang bukan merupakan pemeriksaan penunjang yang dapat membantu penegakan diagnosis rakitis dan osteomalasia adalah:","o":[["a","Foto X ray"],["b","Pemeriksaan kadar serum transaminase darah"],["c","Pemeriksaan kadar alkali fosfatase"],["d","Pengukuran kalsium dan fosfat serum"],["e","Biopsi tulang"]],"k":"b","e":"Pemeriksaan penunjang rakitis/osteomalasia: foto X-ray (Looser zone, metafisis melebar), alkali fosfatase (naik), kalsium dan fosfat serum (turun), 25(OH)D, PTH, dan biopsi tulang. Transaminase menilai fungsi hati.","w":"a: Foto X-ray membantu diagnosis.|c: ALP meningkat pada keduanya.|d: Ca dan P serum menurun.|e: Biopsi tulang adalah baku emas osteomalasia.","s":"PPT Osteoporosis sl. 19; Buku teks: IPD"},{"n":169,"t":"fis","q":"Sarkomer adalah unit fungsional kontraksi. Yang dikatakan zona satu unit sarkomer adalah...","o":[["a","Daerah antara dua garis Z"],["b","Daerah antara dua garis M"],["c","Daerah antara dua zona H"],["d","Daerah antara dua pita I"],["e","Daerah antara dua pita A"]],"k":"a","e":"Sarkomer adalah daerah di antara dua garis Z yang berdekatan.","w":"b: Garis M berada di tengah sarkomer.|c: Zona H berada di tengah pita A.|d: Pita I terbelah oleh garis Z.|e: Pita A berada di tengah sarkomer.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 12; PPT Praktikum Muskuloskeletal sl. 24"},{"n":170,"t":"rem","q":"Seorang perempuan berumur 32 tahun mengeluh sering merasa lelah, timbul kemerahan di kulit terutama di wajah bila terkena sinar matahari. Keluhan juga disertai nyeri pada pergelangan tangan dan sendi-sendi sehingga pasien sulit berjalan. Keluhan ini sudah dirasakan sejak 3 bulan yang lalu. Pada pemeriksaan fisik didapatkan ruam malar, ulkus di mulut, dan lesi diskoid. Pada pemeriksaan laboratorium didapatkan titer anti-dsDNA dan ANA meningkat. Diagnosis pada pasien tersebut adalah...","o":[["a","Osteoporosis"],["b","Gout arthritis"],["c","SLE"],["d","Osteomalasia"],["e","Reumatoid arthritis"]],"k":"c","e":"Perempuan muda dengan fotosensitivitas, ruam malar, ulkus mulut, lesi diskoid, artritis, serta ANA dan anti-dsDNA positif → lupus eritematosus sistemik (SLE).","w":"a: Osteoporosis tidak menimbulkan ruam dan artritis.|b: Gout tidak menimbulkan ruam dan autoantibodi.|d: Osteomalasia tidak menimbulkan gejala kulit.|e: RA tidak menimbulkan ruam malar dan anti-dsDNA.","s":"Buku teks: IPD (kriteria SLE) · tidak dibahas di PPT"},{"n":171,"t":"ort","q":"Seorang ibu membawa anaknya ke poli orthopaedi dengan keluhan anaknya sulit berjalan sejak 2 tahun yang lalu. Usia anak laki-lakinya saat ini adalah 5 tahun. Pada pemeriksaan dijumpai adanya flat foot pada pedis kanan. Patologi pasien ini adalah:","o":[["a","Musculus peroneus brevis"],["b","Os kalkaneus"],["c","Musculus plantaris pedis"],["d","Posterior talofibular ligament"],["e","Anterior talofibular ligament"]],"k":"b","e":"Flat foot (pes planus) pada anak terkait hilangnya lengkung medial kaki dengan calcaneus yang berposisi valgus. Dari opsi, patologinya paling sesuai di os calcaneus.","w":"a: M. peroneus brevis bukan penyebab utama.|c: \"M. plantaris pedis\" bukan otot yang membentuk lengkung.|d: Ligamen talofibular posterior tidak berperan pada lengkung kaki.|e: Ligamen talofibular anterior cedera pada sprain ankle.","s":"Buku teks: Apley (flat foot)","c":"Flat foot anak melibatkan lengkung medial kaki (calcaneus valgus, tendon tibialis posterior). Opsi yang tersedia tidak ideal; calcaneus paling mendekati.","amb":1},{"n":172,"t":"ort","q":"Pott cervical mendeskripsikan...","o":[["a","Spondilitis TB"],["b","Septic arthritis"],["c","Ankilosing spondilitis"],["d","Garre osteomyelitis"],["e","Cellulitis"]],"k":"a","e":"Penyakit Pott adalah spondilitis tuberkulosis, infeksi TB pada vertebra (termasuk servikal) yang dapat menyebabkan gibbus dan defisit neurologis.","w":"b: Artritis septik adalah infeksi bakteri pada sendi.|c: Ankilosing spondilitis adalah spondiloartropati autoimun.|d: Osteomielitis Garre adalah osteomielitis sklerosing kronik.|e: Selulitis adalah infeksi jaringan lunak.","s":"PPT Tulang Belakang sl. 35"},{"n":173,"t":"bio","q":"Di bawah mikroskop, otot skelet tampak bercorak lurik dan kerjanya terkontrol secara sadar. Sel otot skelet merupakan serabut silindris yang panjang hingga sepanjang ototnya sendiri. Serabut/sel otot mengandung sejumlah inti (multinucleated) yang dikarenakan terjadi fusi sel semasa embrio. Struktur salah satu protein filamen tebal myofibril terdiri dari globular region (head), fibrous portion (alpha-helices) dan Light chain. Mana dari protein berikut yang memiliki struktur demikian?","o":[["a","Dystrophin"],["b","Troponin C"],["c","Myosin"],["d","Desmin"],["e","Troponin T"]],"k":"c","e":"Miosin terdiri dari bagian globular (kepala), ekor fibrosa berupa α-heliks, dan rantai ringan (light chain) di sekitar leher.","w":"a: Distrofin adalah protein sitoskeleton.|b: Troponin C protein globular kecil pengikat Ca2+.|d: Desmin adalah filamen intermediat.|e: Troponin T protein globular pengikat tropomiosin.","s":"PPT Praktikum Muskuloskeletal sl. 24"},{"n":174,"t":"rem","q":"Yang tidak menyebabkan artritis adalah","o":[["a","Artritis psoriatik"],["b","Sindrom Sjögren"],["c","Trauma"],["d","Alkoholisme"],["e","Sklerosis sistemik"]],"k":"d","e":"Artritis dapat disebabkan psoriasis, sindrom Sjögren, trauma, dan sklerosis sistemik. Alkoholisme hanya memicu serangan gout atau osteonekrosis, tetapi bukan penyebab artritis tersendiri.","w":"a: Artritis psoriatik termasuk spondiloartropati.|b: Sjögren dapat disertai artritis.|c: Trauma dapat menimbulkan artritis pascatrauma.|e: Sklerosis sistemik dapat disertai artritis.","s":"Buku teks: IPD","c":"Psoriasis, Sjögren, trauma, dan sklerosis sistemik dapat menimbulkan artritis. Alkoholisme hanya pemicu serangan gout atau osteonekrosis.","amb":1},{"n":175,"t":"oml","q":"Seseorang dapat lebih mudah terkena rakitis jika memiliki faktor-faktor:","o":[["a","Diet yang baik"],["b","Berkulit gelap"],["c","Lahir lebih bulan"],["d","Lahir cukup bulan"],["e","Berkulit putih"]],"k":"b","e":"Kulit gelap (melanin tinggi) mengurangi sintesis vitamin D di kulit, sehingga meningkatkan risiko rakitis.","w":"a: Diet yang baik justru mencegah rakitis.|c: Lahir lebih bulan bukan faktor risiko.|d: Lahir cukup bulan bukan faktor risiko; prematur yang berisiko.|e: Kulit putih memproduksi vitamin D lebih efisien.","s":"Buku teks: IPD/Nelson (rakitis) · tidak dibahas di PPT"},{"n":176,"t":"rem","q":"Pemeriksaan darah rutin pada reumatoid arthritis akan kita dapatkan nilai:","o":[["a","Limfositopenia"],["b","Leukositosis"],["c","LED meningkat"],["d","Hb normal"],["e","Neutrofilia"]],"k":"c","e":"Pada RA aktif, darah rutin menunjukkan LED meningkat, anemia penyakit kronik, dan bisa trombositosis.","w":"a: Limfositopenia lebih khas SLE.|b: Leukositosis tidak khas.|d: Hb biasanya turun (anemia penyakit kronik).|e: Neutrofilia tidak khas.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 24"},{"n":177,"t":"ort","q":"Seorang anak perempuan berusia 12 tahun didiagnosa immature tulang dengan riwayat deformitas ekstremitas bawah selama beberapa tahun. Riwayat medis menunjukkan (+) asma dan eksema. Pasien menolak mengakui mengalami gejala tersebut dan neurovascular intak pada kedua ekstremitas. Pada foto rontgen tampak gambaran genu valgum bilateral. Kemungkinan diagnosis pasien ini adalah:","o":[["a","Hemiepiphysiodesis partial tibia"],["b","Osteosarcoma"],["c","Blount disease"],["d","Kongenital tibia vara"],["e","Jumper's knee"]],"k":"a","e":"Genu valgum bilateral pada tulang yang masih imatur ditangani dengan guided growth (hemiepifisiodesis parsial). Opsi lain tidak sesuai genu valgum.","w":"b: Osteosarkoma adalah tumor ganas, tidak menyebabkan deformitas angular bilateral.|c: Blount disease menyebabkan genu varum (tibia vara).|d: Tibia vara kongenital juga varum.|e: Jumper knee adalah tendinopati patela.","s":"Buku teks: Apley","c":"Opsi {a} sebenarnya tatalaksana (guided growth) genu valgum pada tulang imatur, bukan diagnosis. Opsi lain tidak sesuai dengan genu valgum.","amb":1},{"n":178,"t":"far","q":"Seorang perempuan berusia 68 tahun, selain metotreksat juga mengkonsumsi prednison 5mg/hari untuk artritis rheumatoid yang diderita. Pasien takut terhadap kemungkinan osteoporosis karena kakak perempuannya pernah mengalami fraktur panggul tahun lalu. Selain rutin beraktivitas, dia berolahraga jalan kaki 30 menit setiap pagi, minum susu 2 gelas sehari, tidak merokok dan tidak minum alkohol. DXA pasien menunjukkan osteopenia. Rencana tatalaksana yang paling tepat pada pasien ini adalah:","o":[["a","Bisfosfonat"],["b","Raloksifen"],["c","Perbaikan gaya hidup"],["d","Recombinant parathyroid hormone"],["e","Asupan kalsium dan vitamin D yang adekuat"]],"k":"a","e":"Perempuan 68 tahun pengguna glukokortikoid jangka panjang dengan osteopenia dan riwayat fraktur panggul pada keluarga → risiko fraktur tinggi. Terapi pilihan osteoporosis akibat glukokortikoid adalah bisfosfonat (ditambah kalsium dan vitamin D).","w":"b: Raloksifen bukan pilihan pertama pada osteoporosis akibat steroid.|c: Gaya hidup pasien sudah baik.|d: PTH rekombinan (teriparatid) untuk risiko sangat tinggi atau gagal terapi.|e: Kalsium dan vitamin D wajib, tapi tidak cukup sendiri (lihat catatan).","s":"PPT Farmakologi Homeostasis Tulang sl. 18–20; PPT Osteoporosis sl. 28","c":"Pengguna glukokortikoid dengan osteopenia dan riwayat fraktur panggul pada keluarga tergolong risiko tinggi sehingga diberi bisfosfonat. Kalsium dan vitamin D ({e}) tetap wajib untuk semua pengguna steroid.","amb":1},{"n":179,"t":"ort","q":"Kelainan kongenital pada anak di tulang belakang meliputi...","o":[["a","Spina bifida"],["b","Spondilitis TB"],["c","Osteochondritis"],["d","Degenerative disc disease"],["e","Ankilosing spondilitis"]],"k":"a","e":"Spina bifida adalah kelainan kongenital akibat kegagalan penutupan arkus vertebra (defek tabung saraf).","w":"b: Spondilitis TB adalah infeksi.|c: Osteokondritis adalah kelainan didapat pada tulang rawan.|d: Degenerative disc disease adalah penyakit degeneratif, bukan kongenital.|e: Ankilosing spondilitis adalah penyakit autoimun.","s":"Buku teks: Apley · tidak dibahas di PPT"},{"n":180,"t":"rem","q":"Analisis cairan sinovial pada penyakit muskuloskeletal yang mengenai sendi merupakan pemeriksaan penunjang yang sangat penting, yang terdiri dari: pemeriksaan makroskopis dan mikroskopis, pemeriksaan kimia, pemeriksaan mikrobiologi yaitu dilakukan kultur dan uji sensitivitas. Yang termasuk salah satu pemeriksaan mikroskopis adalah:","o":[["a","Viskositas"],["b","Hitung jenis sel"],["c","Volume"],["d","Warna dan kejernihan"],["e","Bekuan musin"]],"k":"b","e":"Analisis cairan sendi terdiri dari makroskopis (warna, kejernihan, viskositas, volume, bekuan musin), mikroskopis (hitung sel dan hitung jenis, kristal), kimia, dan mikrobiologi.","w":"a: Viskositas pemeriksaan makroskopis.|c: Volume pemeriksaan makroskopis.|d: Warna dan kejernihan pemeriksaan makroskopis.|e: Bekuan musin pemeriksaan makroskopis.","s":"Buku teks: IPD (analisis cairan sendi) · tidak dibahas di PPT"},{"n":181,"t":"fis","q":"Otot skelet merupakan kumpulan otot yang melekat pada tulang dan memfasilitasi pergerakan skeleton. Banyak otot skelet yang dijumpai berpasangan yang bertujuan untuk mengkoordinir arah gerakan yang berlawanan. Proses yang terjadi di dalam fibril sehingga terjadi pemendekan dan pencembungan otot skelet pada saat kontraksi adalah:","o":[["a","Myosin mendorong actin"],["b","Myosin menekuk"],["c","Actin menekuk"],["d","Actin mendorong myosin"],["e","Filamen actin dan filament myosin mendekat satu sama lain"]],"k":"e","e":"Menurut teori sliding filament, saat kontraksi filamen aktin dan miosin bergeser mendekat satu sama lain sehingga sarkomer memendek dan otot mencembung. Panjang filamennya sendiri tidak berubah.","w":"a: Miosin menarik, bukan mendorong, aktin.|b: Yang menekuk hanya kepala miosin.|c: Aktin tidak menekuk.|d: Aktin tidak mendorong miosin.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 13; PPT Praktikum Muskuloskeletal sl. 27"},{"n":183,"t":"rem","q":"Faktor plasma yang berperan pada inflamasi adalah","o":[["a","Molekul adhesi"],["b","Sitokin"],["c","Komplemen"],["d","Fagosit"],["e","Sel mast"]],"k":"c","e":"Mediator inflamasi yang berasal dari plasma adalah sistem komplemen, kinin, dan koagulasi. Sitokin, sel mast, dan fagosit berasal dari sel.","w":"a: Molekul adhesi diekspresikan oleh sel endotel/leukosit.|b: Sitokin adalah mediator dari sel.|d: Fagosit adalah sel.|e: Sel mast adalah sel jaringan.","s":"Buku teks: Robbins · tidak dibahas di PPT"},{"n":184,"t":"oml","q":"Di bawah ini merupakan gejala dari penyakit rakitis, kecuali:","o":[["a","Pigeon chest"],["b","Craniotabes"],["c","Akromegali"],["d","Pembengkakan Costochondral"],["e","Masalah gigi"]],"k":"c","e":"Gejala rakitis: craniotabes, rachitic rosary (pembengkakan costochondral), pigeon chest, kelainan gigi, dan kaki bengkok. Akromegali disebabkan kelebihan growth hormone pada dewasa.","w":"a: Pigeon chest gejala rakitis.|b: Craniotabes gejala rakitis.|d: Rachitic rosary gejala rakitis.|e: Gangguan erupsi gigi gejala rakitis.","s":"Buku teks: Nelson (rakitis) · tidak dibahas di PPT"},{"n":185,"t":"oa","q":"Pada palpasi sendi dijumpai sendi bengkak, nyeri, dan kemerahan. Hal ini merupakan","o":[["a","Efusi"],["b","Deformitas"],["c","Inflamasi"],["d","Kontraktur"],["e","Krepitasi"]],"k":"c","e":"Sendi yang bengkak, nyeri, dan kemerahan (dan teraba hangat) adalah tanda inflamasi.","w":"a: Efusi hanya penambahan cairan sendi.|b: Deformitas adalah perubahan bentuk.|d: Kontraktur adalah pemendekan jaringan sehingga gerak terbatas.|e: Krepitasi adalah bunyi gesekan saat sendi digerakkan.","s":"PPT Osteoartritis sl. 10"},{"n":187,"t":"fis","q":"Panjang, memiliki nukleus tunggal, umumnya membentuk bagian otot yang mengelilingi dinding suatu lumen, terdapat di berbagai sistem organ (seperti dinding saluran cerna, dinding arteri), dipengaruhi saraf otonom. Itu ciri-ciri dari...","o":[["a","Semua benar"],["b","Otot polos"],["c","Otot skelet"],["d","Otot rangka"],["e","Otot jantung"]],"k":"b","e":"Otot polos: sel panjang berbentuk gelendong, berinti tunggal, membentuk dinding organ berongga (usus, arteri), dan dipersarafi saraf otonom (involunter).","w":"a: Tidak semua jenis otot punya ciri ini.|c: Otot skelet berinti banyak dan volunter.|d: Otot rangka sama dengan otot skelet.|e: Otot jantung bercabang, punya diskus interkalaris, dan hanya ada di jantung.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 8; PPT Anatomi Muskuloskeletal sl. 60"},{"n":188,"t":"bio","q":"Otot skelet merupakan kumpulan otot yang melekat pada tulang dan memfasilitasi pergerakan skeleton. Banyak otot skelet yang dijumpai berpasangan yang bertujuan untuk mengkoordinir arah gerakan yang berlawanan. Rigor mortis (kaku mayat) terjadi karena sirkulasi sudah berhenti sehingga suplai oksigen juga terhenti. Kondisi filamen-filamen otot adalah sebagai berikut:","o":[["a","Miosin-ATP"],["b","Miosin-ADP-Pi"],["c","Actin-miosin-ADP-Pi"],["d","Actin-miosin"],["e","Actin-miosin-ATP"]],"k":"d","e":"Setelah kematian, sirkulasi dan suplai oksigen berhenti sehingga ATP tidak terbentuk. Kepala miosin tetap terikat ke aktin tanpa ATP dan ADP-Pi (kompleks aktin–miosin/rigor).","w":"a: Miosin-ATP terjadi saat ATP mengikat miosin dan melepasn
