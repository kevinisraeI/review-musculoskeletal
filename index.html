<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Soal Muskuloskeletal</title>
<meta name="description" content="Bank soal Modul Muskuloskeletal FK UISU: 267 soal dengan pembahasan, simulasi ujian, dan flashcard. Disusun oleh Jory Ganteng.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Palet dan tata letak sama dengan Bank Soal Persarafan: biru Luxol fast blue sebagai aksen, eosin untuk penanda ragu.
   Ornamen header: kurva kontraksi otot (twitch → sumasi → tetanus). */
:root{
  --paper:#f3f5f8; --surface:#ffffff; --ink:#132130; --muted:#5b6b7b; --line:#d7dee6;
  --lfb:#1c5ea8; --lfb-soft:#e3edf8; --eosin:#b8386f; --eosin-soft:#f8e4ed;
  --ok:#1d7f53; --ok-soft:#e1f2e9; --bad:#b9363a; --bad-soft:#f9e3e3; --warn:#9a6a00; --warn-soft:#fbf0d6;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px; --shadow:0 1px 2px rgba(19,33,48,.06), 0 4px 16px rgba(19,33,48,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d141b; --surface:#141f29; --ink:#e4ebf2; --muted:#93a3b2; --line:#24333f;
    --lfb:#6ea9ea; --lfb-soft:#16293d; --eosin:#e57aa7; --eosin-soft:#3a1a29;
    --ok:#4cc08a; --ok-soft:#12301f; --bad:#f07070; --bad-soft:#3a1717; --warn:#e3b44a; --warn-soft:#33270c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d141b; --surface:#141f29; --ink:#e4ebf2; --muted:#93a3b2; --line:#24333f;
  --lfb:#6ea9ea; --lfb-soft:#16293d; --eosin:#e57aa7; --eosin-soft:#3a1a29;
  --ok:#4cc08a; --ok-soft:#12301f; --bad:#f07070; --bad-soft:#3a1717; --warn:#e3b44a; --warn-soft:#33270c;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,6vw,48px);font-weight:700;letter-spacing:-.02em}
h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;font-weight:700}
h4{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--lfb);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn:hover{border-color:var(--lfb)}
.btn.primary{background:var(--lfb);border-color:var(--lfb);color:var(--paper)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.flag[aria-pressed="true"]{background:var(--eosin-soft);border-color:var(--eosin);color:var(--eosin)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:15px}

/* Hero */
.hero{position:relative;padding:28px 0 22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.hero .eyebrow{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--lfb);margin-bottom:10px}
.hero .lede{max-width:60ch;color:var(--muted);margin-top:10px}
.trace{display:block;width:100%;height:56px;margin-top:18px}
.trace path{fill:none;stroke:var(--lfb);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trace .base{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.trace text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}

/* Modes */
.section{margin-bottom:34px}
.section > h2{margin-bottom:6px}
.section > .sub{color:var(--muted);margin-bottom:14px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:620px){.modes{grid-template-columns:1fr}}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.mode.lead{border-color:var(--lfb);border-width:2px}
.mode p{color:var(--muted);font-size:15px}
.mode .tag{align-self:flex-start}
.mode .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px;font-family:var(--f-mono);font-size:14px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--lfb-soft);color:var(--lfb);font-weight:700}
.tag{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:999px;background:var(--lfb-soft);color:var(--lfb)}

/* Topics */
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:620px){.topics{grid-template-columns:1fr}}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.topic .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.topic h3{font-size:17px}
.topic .meta{font-size:14px;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .ok{background:var(--ok)}
.meter .bad{background:var(--bad)}
.topic .row{display:flex;gap:8px;flex-wrap:wrap}
.acc{font-family:var(--f-mono);font-size:14px;font-weight:700;white-space:nowrap}
.acc.lo{color:var(--bad)} .acc.mid{color:var(--warn)} .acc.hi{color:var(--ok)}

/* History */
.hist{width:100%;border-collapse:collapse;font-size:15px}
.hist th,.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.hist td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

footer.foot{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14px;display:grid;gap:10px}

/* Quiz */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.bar .title{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .count{font-family:var(--f-mono);font-size:15px;color:var(--muted)}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--lfb-soft);color:var(--lfb)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.thin{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:-6px 0 16px}
.thin i{display:block;height:100%;background:var(--lfb)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:13px}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.flagged{border-color:var(--eosin);color:var(--eosin);background:var(--eosin-soft)}
.stem{font-size:18px;line-height:1.6;max-width:68ch}
.qimg{margin:14px 0 4px;max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:52px;line-height:1.45}
.opt .L{font-family:var(--f-mono);font-weight:700;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--lfb)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--lfb);background:var(--lfb-soft)}
.opt.sel .L{background:var(--lfb);color:var(--paper);border-color:var(--lfb)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.opt.dim{opacity:.7}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px;border-left:5px solid var(--ok);background:var(--ok-soft)}
.fb.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.fb.neutral{border-left-color:var(--lfb);background:var(--lfb-soft)}
.fb .verdict{font-family:var(--f-display);font-weight:700;font-size:19px}
.fb p,.fb li{max-width:68ch}
.fb ul{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.fb li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.fb li b{font-family:var(--f-mono)}
.note{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);border:1px solid var(--warn)}
.note h4{margin-top:0;color:var(--warn)}
.src{margin-top:14px;font-size:14px;color:var(--muted)}
.src b{color:var(--ink)}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.nav .spacer{flex:1}
.hint{margin-top:12px;font-size:13px;color:var(--muted)}
@media (hover:none){.hint{display:none}}

/* Sim grid */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:10px}
.qgrid button{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--f-mono);font-size:14px;position:relative}
.qgrid button.done{background:var(--lfb-soft);border-color:var(--lfb);color:var(--lfb);font-weight:700}
.qgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.qgrid button.flag::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--eosin)}
.qgrid button.r-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qgrid button.r-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
details.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-top:16px}
details.panel summary{cursor:pointer;font-weight:700}

/* Result */
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.score .big{font-family:var(--f-mono);font-size:48px;font-weight:700;line-height:1}
.score .big small{font-size:22px;color:var(--muted)}
.tbar{display:grid;grid-template-columns:minmax(120px,1.2fr) 70px 2fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.tbar .mono{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.review{display:grid;gap:10px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.review summary{cursor:pointer;display:flex;gap:10px;align-items:baseline}
.review summary .st{font-family:var(--f-mono);font-weight:700;min-width:64px}
.review .st.ok{color:var(--ok)} .review .st.bad{color:var(--bad)} .review .st.skip{color:var(--muted)}
.review summary span.txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}

/* Flashcards */
.deck{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.deck button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.deck button[aria-pressed="true"]{background:var(--lfb);border-color:var(--lfb);color:var(--paper)}
.card{position:relative;min-height:280px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;gap:14px;cursor:pointer;width:100%;text-align:left}
.card .side{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .front{font-family:var(--f-display);font-size:clamp(22px,4vw,30px);font-weight:700;line-height:1.2;text-wrap:balance}
.card .back{font-size:18px;line-height:1.6;max-width:62ch}
.card.flipped{border-color:var(--lfb)}
.card .src{margin-top:auto}
.card.known::after{content:"Sudah hafal";position:absolute;top:16px;right:16px;font-family:var(--f-mono);font-size:12px;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:2px 8px}
.check{display:inline-flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.check input{width:18px;height:18px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,16,22,.5);display:grid;place-items:center;padding:18px;z-index:50}
.modal .box{background:var(--surface);border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);display:grid;gap:14px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;z-index:60}
.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
@media (prefers-reduced-motion: no-preference){
  .opt,.btn,.card{transition:border-color .15s, background-color .15s, transform .15s}
  .card:active{transform:scale(.995)}
}

/* Muskuloskeletal additions */
.hero .credit{margin-top:12px;font-size:15px;color:var(--muted)}
.hero .credit b{color:var(--eosin);font-family:var(--f-display);font-weight:700}
.trace .stim{stroke:var(--muted);stroke-width:1;opacity:.6}
.trace-labels{position:relative;height:16px;margin-top:2px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--muted)}
.trace-labels span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
@media (max-width:520px){.trace-labels span.opt-l{display:none}}
.foot .credit{color:var(--ink)}
.foot .credit b{color:var(--eosin);font-family:var(--f-display)}
.review{grid-template-columns:minmax(0,1fr)}
.review details{min-width:0}
.chip.info{border-color:var(--lfb);color:var(--lfb);background:var(--lfb-soft)}
.qimg{cursor:zoom-in;background:#fff}
.qimg-hint{font-size:13px;color:var(--muted);margin-top:2px}
.lightbox{background:rgba(5,9,13,.86);cursor:zoom-out;overflow:auto;place-items:center}
.lightbox img{max-width:min(1400px,100%);max-height:92vh;border-radius:8px;background:#fff;display:block}
.lightbox .close{position:fixed;top:12px;right:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:6px 12px;font-weight:700}
.xl{margin-top:14px}
.xlink{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--lfb);border-radius:999px;color:var(--lfb);font-weight:700;font-size:15px;text-decoration:none;background:var(--lfb-soft)}
.xlink:hover{filter:brightness(1.05)}
a.btn{text-decoration:none;color:inherit}
</style>
</head>

<script id="data" type="application/json">{"topics":[["ana","Anatomi Muskuloskeletal"],["fis","Fisiologi Otot & Tulang"],["bio","Biokimia Otot"],["osp","Osteoporosis & Homeostasis Kalsium"],["oml","Osteomalasia & Rakitis"],["oa","Osteoartritis"],["rem","Artritis Reumatoid, Gout & SLE"],["neo","Neoplasma Muskuloskeletal"],["trm","Fraktur, Dislokasi & Cedera Otot-Tendon"],["ort","Ortopedi Klinik, Tulang Belakang & Rehabilitasi"],["far","Farmakologi Muskuloskeletal"]],"questions":[{"n":1,"t":"rem","q":"Kriteria remisi pada artritis reumatoid dapat menggunakan ACR/EULAR yaitu apabila...","o":[["a","Jumlah sendi yang bengkak kurang atau sama dengan 5"],["b","Sendi tidak ada yang sakit"],["c","Jumlah sendi yang bengkak kurang atau sama dengan 3"],["d","Jumlah sendi yang nyeri kurang atau sama dengan 3"],["e","Jumlah sendi yang nyeri kurang atau sama dengan 1"]],"k":"e","e":"Remisi RA menurut ACR/EULAR (definisi Boolean) tercapai bila jumlah sendi nyeri ≤1, sendi bengkak ≤1, CRP ≤1 mg/dl, dan penilaian global pasien ≤1 (skala 0–10). Dari opsi, hanya \"sendi nyeri ≤1\" yang sesuai.","w":"a: Batasnya ≤1 sendi bengkak, bukan ≤5.|b: Tidak harus nol sendi nyeri; batasnya ≤1.|c: Batasnya ≤1 sendi bengkak, bukan ≤3.|d: Batasnya ≤1 sendi nyeri, bukan ≤3.","s":"Buku teks: ACR/EULAR 2011 (Boolean remission) · tidak dibahas di PPT"},{"n":2,"t":"fis","q":"Apakah yang tidak mempengaruhi pembentukan osteoklas oleh osteoprogenitor?","o":[["a","Ion kalsium"],["b","Ion fosfor"],["c","Hormon tiroid"],["d","Hormon paratiroid"],["e","Growth hormone"]],"k":"b","e":"Menurut slide, pembentukan osteoklas oleh osteoprogenitor dipengaruhi rangsangan hormon tiroid, hormon paratiroid, hormon pertumbuhan, dan ion kalsium. Ion fosfor tidak disebut.","w":"a: Ion kalsium disebut di slide sebagai pemicu.|c: Hormon tiroid disebut di slide.|d: Hormon paratiroid disebut di slide.|e: Hormon pertumbuhan (growth hormone) disebut di slide.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 40"},{"n":3,"t":"ort","q":"Seorang anak muda usia 17 tahun hendak melamar tentara, namun tinggi badan tidak cukup. Beliau minta dioperasi meninggikan tulang, maka tulang yang dioperasi adalah...","o":[["a","Tibia"],["b","Femur"],["c","Cervical"],["d","Torakal"],["e","Lumbal"]],"k":"b","e":"Pemanjangan tungkai untuk menambah tinggi badan dilakukan pada tulang panjang ekstremitas bawah dengan teknik distraksi osteogenesis (Ilizarov). Femur memberi tambahan panjang terbesar dan paling sering dipilih untuk kosmetik tinggi badan.","w":"a: Tibia juga bisa dipanjangkan, tapi tambahan tinggi lebih kecil (lihat catatan).|c: Vertebra servikal tidak dipanjangkan.|d: Vertebra torakal tidak dipanjangkan.|e: Vertebra lumbal tidak dipanjangkan.","s":"Buku teks: Apley (limb lengthening/Ilizarov)","c":"Pemanjangan tungkai untuk tinggi badan bisa dilakukan di femur maupun tibia. Femur dipilih karena memberi tambahan tinggi terbesar, tetapi tibia juga sering dipakai.","amb":1},{"n":4,"t":"fis","q":"Apa sebutan periode pemberian rangsang sampai terjadinya respon...","o":[["a","Maksimal"],["b","Periode laten"],["c","Periode kontraksi"],["d","Periode relaksasi"],["e","Supra maksimal"]],"k":"b","e":"Periode laten adalah waktu sejak rangsang diberikan (potensial aksi sampai di tubulus T) hingga terjadi respons/cross bridge, sekitar 0,005–0,01 detik.","w":"a: Maksimal adalah istilah intensitas rangsang, bukan periode.|c: Periode kontraksi adalah fase pemendekan sarkomer (±0,04 detik).|d: Periode relaksasi adalah fase kembalinya otot ke panjang semula.|e: Supra maksimal adalah intensitas rangsang di atas maksimal.","s":"PPT Praktikum Muskuloskeletal sl. 53; PPT Sistem Muskuloskeletal (Fisiologi) sl. 26"},{"n":5,"t":"fis","q":"Apakah sebutan untuk membran plasma yang mengelilingi sel-sel serat otot dan dapat tereksitasi oleh listrik...","o":[["a","Sarkomer"],["b","Sarkoplasma"],["c","Miofibril"],["d","Retikulum sarkoplasma"],["e","Sarkolema"]],"k":"e","e":"Sarkolema adalah membran plasma serat otot yang dapat tereksitasi oleh impuls saraf/listrik.","w":"a: Sarkomer adalah unit kontraksi di antara dua garis Z.|b: Sarkoplasma adalah sitoplasma serat otot.|c: Miofibril adalah serabut kontraktil di dalam serat otot.|d: Retikulum sarkoplasma adalah tempat penyimpanan Ca2+.","s":"PPT Biokimia Otot sl. 5"},{"n":6,"t":"osp","q":"Apakah pemeriksaan yang dilakukan untuk mengukur densitas mineral tulang?","o":[["a","Pemeriksaan DXA"],["b","Skor FRAX"],["c","Foto vertebra"],["d","Pemeriksaan BMI"],["e","Pemeriksaan BMD"]],"k":"a","e":"Densitas mineral tulang (BMD) diukur dengan pemeriksaan DXA (dual-energy X-ray absorptiometry), standar baku emas diagnosis osteoporosis.","w":"b: FRAX adalah skor risiko fraktur 10 tahun, bukan pengukuran densitas.|c: Foto vertebra baru tampak abnormal pada osteoporosis lanjut.|d: BMI (IMT) mengukur status gizi, bukan tulang.|e: BMD adalah besaran yang diukur oleh DXA (lihat catatan).","s":"PPT Osteoporosis sl. 20–24","c":"BMD adalah besaran yang diukur, sedangkan DXA adalah alat/pemeriksaannya. Slide menulis \"BMD DXA Scan\", sehingga opsi {a} dan {e} sama-sama bisa dibenarkan. Kunci memilih DXA sebagai nama pemeriksaan.","amb":1},{"n":7,"t":"rem","q":"Apakah manifestasi ekstraartikular RA...","o":[["a","Anemia penyakit kronik"],["b","Anemia aplastik"],["c","Anemia def.Fe"],["d","Bisitopenia"],["e","Anemia hemolitik autoimun"]],"k":"a","e":"Manifestasi hematologi ekstraartikular RA yang tersering adalah anemia penyakit kronik, disertai trombositosis, eosinofilia, dan sindrom Felty.","w":"b: Anemia aplastik bukan manifestasi RA.|c: Anemia defisiensi besi bisa terjadi akibat OAINS, bukan manifestasi penyakitnya.|d: Bisitopenia bukan manifestasi khas RA.|e: Anemia hemolitik autoimun lebih khas SLE.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 22"},{"n":8,"t":"fis","q":"Apakah yang merupakan rangsangan otot terbaik adalah...","o":[["a","Khemis"],["b","Elektris"],["c","Mekanis"],["d","Thermis"],["e","Refleks"]],"k":"b","e":"Dari empat jenis stimulus (mekanis, thermis, khemis, elektris), rangsang elektris paling baik karena intensitas, frekuensi, dan durasinya dapat diatur dengan alat.","w":"a: Rangsang kimia tidak dapat dikontrol intensitasnya.|c: Rangsang mekanis (memijit, memukul) sulit dikontrol dan dapat merusak jaringan.|d: Rangsang panas/dingin sulit dikontrol.|e: Refleks bukan salah satu dari empat jenis stimulus di praktikum.","s":"PPT Praktikum Muskuloskeletal sl. 48"},{"n":9,"t":"ana","q":"Fungsi M. deltoideus pars acromialis adalah...","o":[["a","Abduksi lengan atas"],["b","Antefleksi lengan atas"],["c","Antefleksi dan adduksi lengan atas"],["d","Adduksi lengan atas"],["e","Retrofleksi lengan atas"]],"k":"a","e":"Pars acromialis (bagian tengah) M. deltoideus adalah abduktor utama lengan atas (setelah 15° pertama oleh M. supraspinatus).","w":"b: Antefleksi dilakukan pars clavicularis (anterior).|c: Antefleksi + adduksi adalah kerja pars clavicularis.|d: Adduksi bukan fungsi pars acromialis.|e: Retrofleksi dilakukan pars spinalis (posterior).","s":"PPT Anatomi Muskuloskeletal sl. 71–72 (gambar); Buku teks: Snell"},{"n":10,"t":"fis","q":"Apakah yang BUKAN merupakan rangsangan kontraksi otot?","o":[["a","Thermis"],["b","Refleks"],["c","Khemis"],["d","Mekanis"],["e","Elektris"]],"k":"b","e":"Stimulus yang dapat menimbulkan kontraksi otot di praktikum ada empat: mekanis, thermis, khemis, dan elektris. Refleks tidak termasuk.","w":"a: Thermis (panas/dingin) termasuk stimulus otot.|c: Khemis (asam, basa, garam) termasuk stimulus.|d: Mekanis (memijit, memukul) termasuk stimulus.|e: Elektris adalah stimulus terbaik.","s":"PPT Praktikum Muskuloskeletal sl. 48"},{"n":11,"t":"ana","q":"Os ilium, os pubis, dan os ischium bersatu membentuk os coxae. Penyatuan ketiga tulang ini terdapat pada...","o":[["a","Symphysis pubis"],["b","Tuber ischiadicum"],["c","Foramen obturatum"],["d","Acetabulum"],["e","Spina iliaca anterior superior"]],"k":"d","e":"Os ilium, os pubis, dan os ischium bertemu di acetabulum dalam bentuk huruf Y dan menyatu saat pubertas.","w":"a: Symphysis pubis menyatukan os pubis kanan dan kiri.|b: Tuber ischiadicum hanya bagian os ischium.|c: Foramen obturatum dibatasi pubis dan ischium, bukan tempat penyatuan ketiganya.|e: Spina iliaca hanya bagian os ilium.","s":"PPT Anatomi Muskuloskeletal sl. 34"},{"n":12,"t":"fis","q":"Apakah yang BUKAN merupakan tahapan kontraksi otot?","o":[["a","Pembebasan Ca++ dari troponin"],["b","Kepala miosin akan terikat pada active site filamen aktin"],["c","Ion Ca++ akan mengaktifkan filamen aktin"],["d","Potensial aksi merangsang retikulum sarkoplasma mengeluarkan ion kalsium"],["e","Kepala miring ke pertengahan miosin"]],"k":"a","e":"Tahap kontraksi: potensial aksi → retikulum sarkoplasma melepas Ca2+ → Ca2+ berikatan dengan troponin (aktin aktif) → kepala miosin terikat ke aktin → kepala miring ke tengah (power stroke). Lepasnya Ca2+ dari troponin terjadi saat relaksasi.","w":"b: Pengikatan kepala miosin ke aktin adalah tahap kontraksi (cross bridge).|c: Aktivasi aktin oleh Ca2+ adalah tahap kontraksi.|d: Pelepasan Ca2+ dari RS adalah awal kontraksi.|e: Kepala miring ke tengah adalah power stroke.","s":"PPT Praktikum Muskuloskeletal sl. 34; PPT Sistem Muskuloskeletal (Fisiologi) sl. 19"},{"n":13,"t":"osp","q":"Seorang perempuan berusia 65 tahun mengeluhkan nyeri punggung setelah jatuh dalam posisi duduk di kamar mandi 2 hari yang lalu. Pasien masih dapat berdiri dan berjalan setelah jatuh. Pasien memiliki riwayat histerektomi total pada usia 43 tahun sehingga sudah menopause sejak usia tersebut. Pasien sebelumnya bekerja sebagai salah satu manajer perusahaan swasta, sehingga rutin melakukan pemeriksaan kesehatan saat bekerja dan saat ini didapatkan tinggi badannya 165 cm, padahal sebelum purnatugas tinggi badannya 168 cm. Apakah kemungkinan diagnosis pasien?","o":[["a","Osteoporosis"],["b","Spondilosis"],["c","Reumatoid artritis"],["d","Spondiloartropati"],["e","Osteoartritis"]],"k":"a","e":"Perempuan pascamenopause dini (histerektomi usia 43) dengan nyeri punggung setelah jatuh ringan dan tinggi badan berkurang 3 cm → osteoporosis dengan kemungkinan fraktur kompresi vertebra.","w":"b: Spondilosis tidak menyebabkan berkurangnya tinggi badan setelah trauma ringan.|c: RA mengenai sendi kecil secara simetris.|d: Spondiloartropati khas pada laki-laki muda dengan nyeri inflamasi.|e: OA mengenai sendi penumpu, tidak menurunkan tinggi badan.","s":"PPT Osteoporosis sl. 17–18"},{"n":14,"t":"bio","q":"Karbohidrat merupakan sumber energi utama. Ketika karbohidrat yang dimakan lebih banyak dari pada yang digunakan, maka glukosa akan disimpan di dalam hati dan otot dalam bentuk glikogen. Di dalam apakah glikogen disimpan otot?","o":[["a","Tubulus T"],["b","Sarkomer"],["c","Sarkoplasma"],["d","Sarkolema"],["e","Retikulum sarkoplasma"]],"k":"c","e":"Sarkoplasma (sitoplasma serat otot) berisi glikogen, ATP, fosfokreatin, dan enzim glikolisis.","w":"a: Tubulus T adalah invaginasi sarkolema untuk hantaran impuls.|b: Sarkomer adalah unit kontraksi.|d: Sarkolema adalah membran plasma.|e: Retikulum sarkoplasma menyimpan Ca2+, bukan glikogen.","s":"PPT Biokimia Otot sl. 5"},{"n":15,"t":"ana","q":"Malleolus lateralis terdapat pada tulang...","o":[["a","Os patella"],["b","Os fibula"],["c","Os calcaneus"],["d","Os femur"],["e","Os tibia"]],"k":"b","e":"Malleolus lateralis adalah ujung distal os fibula; malleolus medialis milik os tibia.","w":"a: Patella tidak punya malleolus.|c: Calcaneus adalah tulang tarsal tumit.|d: Femur berujung pada condylus, bukan malleolus.|e: Tibia membentuk malleolus medialis.","s":"PPT Anatomi Muskuloskeletal sl. 38; PPT Kuliah Muskuloskeletal dr. Erwin sl. 81"},{"n":16,"t":"fis","q":"Apakah yang merupakan sumber tercepat yang bisa segera dihidrolisis menjadi ATP?","o":[["a","Glikolisis"],["b","Siklus Krebs"],["c","Vitamin"],["d","Hidrolisis kreatin fosfat"],["e","Protein"]],"k":"d","e":"Kreatin fosfat adalah sumber tercepat yang langsung dihidrolisis menjadi ATP (substrate phosphorylation), tetapi jumlahnya terbatas dan cepat habis.","w":"a: Glikolisis lebih lambat dari kreatin fosfat.|b: Siklus Krebs paling lambat dan butuh oksigen.|c: Vitamin bukan sumber ATP.|e: Protein bukan sumber energi cepat otot.","s":"PPT Praktikum Muskuloskeletal sl. 41; PPT Sistem Muskuloskeletal (Fisiologi) sl. 23"},{"n":17,"t":"ana","q":"Tendon dari otot-otot M. semitendinosus, M. gracilis, dan M. sartorius membentuk...","o":[["a","Pes anserinus"],["b","Tabatière anatomique"],["c","Triceps surae"],["d","Quadriceps femoris"],["e","Thenar"]],"k":"a","e":"Tendon M. sartorius, M. gracilis, dan M. semitendinosus berinsersi bersama di medial tibia proksimal membentuk pes anserinus.","w":"b: Tabatière anatomique dibentuk tendon M. extensor pollicis longus dan brevis.|c: Triceps surae adalah gastrocnemius + soleus.|d: Quadriceps femoris adalah rectus femoris + tiga vastus.|e: Thenar adalah kelompok otot ibu jari di telapak tangan, bukan tendon tungkai.","s":"Buku teks: Snell/Sobotta · tidak dibahas di PPT"},{"n":19,"t":"neo","q":"Neoplasma kartilaginosa jinak yang sangat langka, kurang dari 1% tumor tulang, menyerang anak dan dewasa muda, pertumbuhan sangat lambat. Lokasi terutama pada daerah metafisis tulang panjang atau tulang kecil pada tarsal dan metatarsal. Pengobatan untuk yang berpotensi ganas dilakukan kuretase dan eksisi lokal, dan pemeriksaan radiologisnya menunjukkan gambaran radiolusen yang bulat/oval yang terletak eksentrik pada jaringan miksoid, disebut...","o":[["a","Chondromyxoid fibroma"],["b","Osteoid osteoma"],["c","Chondroblastoma"],["d","Chondroma"],["e","Osteosarcoma"]],"k":"a","e":"Chondromyxoid fibroma: tumor kartilaginosa jinak sangat jarang (<1%), di metafisis tulang panjang/tarsal, radiologis lesi radiolusen oval eksentrik dengan matriks miksoid; diterapi kuretase.","w":"b: Osteoid osteoma adalah tumor osteoblastik kecil dengan nyeri malam.|c: Chondroblastoma khas di epifisis.|d: Chondroma terutama di tulang kecil tangan/kaki, matriks hialin.|e: Osteosarkoma ganas, membentuk osteoid.","s":"Buku teks: Robbins / WHO tumor tulang · tidak dibahas di PPT"},{"n":21,"t":"rem","q":"Apakah sendi-sendi yang pada umumnya terlibat pada RA?","o":[["a","Lutut"],["b","Sendi pergelangan tangan"],["c","Sendi panggul"],["d","Sendi pergelangan tangan, proksimal interfalang (PIP), metakarpofalang (MCP), Calcaneus"],["e","Sendi pergelangan tangan, proksimal interfalang (PIP), metakarpofalang (MCP), dan Metatarsofalang II-V (MTPII-V)"]],"k":"e","e":"RA terutama mengenai sendi kecil secara simetris: pergelangan tangan, PIP, MCP, dan MTP II–V di kaki.","w":"a: Lutut bisa terkena tapi bukan pola khas.|b: Pergelangan tangan saja kurang lengkap.|c: Sendi panggul jarang terkena di awal.|d: Calcaneus bukan sendi khas RA.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 13"},{"n":22,"t":"ana","q":"Yang membentuk angka 7 pada plantar pedis disebut...","o":[["a","M. flexor digitorum superficialis"],["b","M. adductor hallucis"],["c","M. flexor digitorum profundus"],["d","M. flexor hallucis brevis"],["e","M. flexor hallucis longus"]],"k":"b","e":"M. adductor hallucis punya caput obliquum dan caput transversum yang bersama membentuk angka 7 di telapak kaki.","w":"a: Fleksor digitorum superficialis adalah otot lengan bawah.|c: Fleksor digitorum profundus juga di lengan bawah.|d: Flexor hallucis brevis berada di sisi medial, tidak berbentuk 7.|e: Flexor hallucis longus adalah otot tungkai bawah.","s":"PPT Kuliah Muskuloskeletal dr. Erwin sl. 114; Buku teks: Sobotta"},{"n":23,"t":"ana","q":"Os coxae merupakan tulang...","o":[["a","Ossa cinguli extremitatis superioris"],["b","Ossa liberae extremitatis superioris"],["c","Ossa cinguli extremitatis inferioris"],["d","Ossa liberae extremitatis inferioris"],["e","Ossa tarsalia"]],"k":"c","e":"Os coxae termasuk ossa cinguli extremitatis inferioris (gelang panggul); terdiri dari os ilium, pubis, dan ischium.","w":"a: Gelang bahu (scapula, clavicula).|b: Tulang bebas ekstremitas atas (humerus, radius, ulna, manus).|d: Tulang bebas ekstremitas bawah (femur, patella, tibia, fibula, pedis).|e: Ossa tarsalia hanya tulang pergelangan kaki.","s":"PPT Anatomi Muskuloskeletal sl. 33"},{"n":24,"t":"rem","q":"Apakah sebutan untuk gejala oligoartikular yang melibatkan 4 persendian atau kurang?","o":[["a","Monoarticular rheumatism"],["b","Pauciarticular rheumatism"],["c","Poli rheumatism"],["d","Palindromic rheumatism"],["e","Pandromic rheumatism"]],"k":"b","e":"Artritis yang melibatkan ≤4 sendi disebut oligoartikular/pauciarticular.","w":"a: Monoarticular hanya melibatkan satu sendi.|c: Poliartikular melibatkan ≥5 sendi.|d: Palindromic rheumatism adalah serangan artritis berulang yang hilang sendiri.|e: \"Pandromic\" bukan istilah medis yang dikenal.","s":"Buku teks: IPD/IRA · tidak dibahas di PPT"},{"n":25,"t":"ana","q":"Os ulna terletak pada sisi medial dari...","o":[["a","Crus"],["b","Brachii"],["c","Antebrachium"],["d","Manus"],["e","Femoris"]],"k":"c","e":"Os ulna terletak di sisi medial antebrachium (lengan bawah), sedangkan radius di sisi lateral.","w":"a: Crus (tungkai bawah) berisi tibia dan fibula.|b: Brachium (lengan atas) hanya berisi humerus.|d: Manus berisi carpal, metacarpal, falang.|e: Femur adalah tulang paha.","s":"PPT Anatomi Muskuloskeletal sl. 22, 28"},{"n":26,"t":"fis","q":"Apakah proses melekatnya kepala miosin ke binding site di aktin?","o":[["a","Relaksasi otot"],["b","Cross bridge"],["c","Filament sliding"],["d","Power stroke"],["e","Kontraksi otot"]],"k":"b","e":"Cross bridge adalah proses melekatnya kepala miosin ke binding site di aktin; power stroke adalah gerakan menekuk kepala miosin berikutnya.","w":"a: Relaksasi adalah lepasnya ikatan aktin–miosin.|c: Filament sliding adalah bergesernya filamen akibat power stroke.|d: Power stroke adalah gerakan fleksi cross bridge.|e: Kontraksi otot adalah keseluruhan proses.","s":"PPT Praktikum Muskuloskeletal sl. 27; PPT Sistem Muskuloskeletal (Fisiologi) sl. 13"},{"n":27,"t":"ort","q":"Seorang pria datang ke poli setelah terjatuh terduduk 2 hari lalu dengan keluhan tidak bisa ereksi. Beliau usia 26 tahun sudah berumah tangga, problematika pasien ini ada pada saraf","o":[["a","Otonom dan sensorik"],["b","Otonom"],["c","Sensorik"],["d","Otonom dan motorik"],["e","Motorik"]],"k":"b","e":"Ereksi diatur saraf parasimpatis (otonom) dari segmen S2–S4 lewat nn. splanchnici pelvici. Trauma jatuh terduduk dapat mengenai radiks sakral/konus.","w":"a: Aferen sensorik ikut berperan pada ereksi refleks (lihat catatan).|c: Saraf sensorik saja tidak menimbulkan ereksi.|d: Saraf motorik tidak berperan pada ereksi.|e: Saraf motorik somatik tidak berperan pada ereksi.","s":"Buku teks: Guyton/Snell (persarafan ereksi S2–S4)","c":"Ereksi diatur saraf parasimpatis (otonom) S2–S4. Ereksi refleks juga membutuhkan aferen sensorik n. pudendus, sehingga opsi {a} (otonom dan sensorik) juga bisa dibenarkan.","amb":1},{"n":28,"t":"bio","q":"Apakah yang BUKAN merupakan komponen miofibril?","o":[["a","Troponin"],["b","Aktin"],["c","Miosin"],["d","Tropomiosin"],["e","Epimisium"]],"k":"e","e":"Miofibril tersusun dari filamen aktin, miosin, tropomiosin, dan troponin. Epimisium adalah jaringan ikat pembungkus seluruh otot.","w":"a: Troponin bagian filamen tipis.|b: Aktin bagian filamen tipis.|c: Miosin menyusun filamen tebal.|d: Tropomiosin bagian filamen tipis.","s":"PPT Biokimia Otot sl. 8; PPT Sistem Muskuloskeletal (Fisiologi) sl. 11"},{"n":29,"t":"fis","q":"Apakah hormon yang TIDAK terlibat pada metabolisme tulang?","o":[["a","Hormon insulin"],["b","Hormon paratiroid"],["c","Hormon kalsitonin"],["d","Growth Hormon"],["e","Hormon tiroid"]],"k":"a","e":"Metabolisme tulang dipengaruhi vitamin D, hormon paratiroid, kalsitonin, hormon pertumbuhan, dan hormon tiroid. Insulin tidak disebut.","w":"b: PTH merangsang resorpsi tulang.|c: Kalsitonin menghambat osteoklas.|d: Growth hormone merangsang pertumbuhan tulang.|e: Hormon tiroid memengaruhi pembentukan osteoklas.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 42"},{"n":30,"t":"ort","q":"Degenerative disc disease atau penyakit tulang belakang pada orang tua yang dideskripsikan oleh Modic pada awal dekade 90-an menggambarkan tidak semua kelainan tulang belakang harus dioperasi. Ketika Anda menerima seorang wanita usia 65 tahun dengan keluhan kebas di tapak kaki dan hasil MRI terdapat lesi lebih dari satu level, maka saran Anda adalah...","o":[["a","Operasi"],["b","Konservatif"],["c","Fisioterapi"],["d","Rujuk ke spesialis"],["e","Medikamentosa"]],"k":"b","e":"Modic menunjukkan banyak kelainan tulang belakang degeneratif yang tidak perlu dioperasi. Lesi multilevel dengan gejala ringan (kebas) ditangani konservatif dulu.","w":"a: Operasi tidak dipilih pertama pada degenerative disc disease multilevel.|c: Fisioterapi adalah bagian terapi konservatif, bukan jawaban paling luas.|d: Rujukan bukan inti pesan Modic.|e: Medikamentosa juga bagian dari konservatif.","s":"PPT Tulang Belakang sl. 38"},{"n":31,"t":"rem","q":"Seorang perempuan 35 tahun datang ke poliklinik dengan keluhan nyeri pada persendian yang sudah dirasakan selama kurang lebih 3 bulan. Pemeriksaan fisik didapatkan pembengkakan dan nyeri tekan pada sendi interfalang proksimal (PIP) II sampai V kanan dan kiri, sendi metakarpofalang (MCP) II sampai V kanan dan kiri, pergelangan tangan kanan dan kiri dan sendi lutut kanan dan kiri. Hasil laboratorium: hemoglobin 11,5 g/dl, leukosit 8.000/mm3, Trombosit 260.000/mm3, laju endap darah (LED) 80 mm/jam. Apakah tanda pada pasien yang memenuhi kriteria klasifikasi artritis reumatoid menurut ACR/EULAR 2010?","o":[["a","LED bernilai normal"],["b","Keterlibatan sendi 4"],["c","Lama sakit lebih dari 12 minggu"],["d","Keterlibatan sendi simetris"],["e","Keterlibatan lebih dari 10 sendi"]],"k":"e","e":"Kriteria ACR/EULAR 2010: keterlibatan >10 sendi (minimal 1 sendi kecil) diberi skor 5. Pasien: PIP II–V dan MCP II–V bilateral + pergelangan tangan + lutut = 20 sendi.","w":"a: LED pasien tinggi (80 mm/jam).|b: Pasien melibatkan jauh lebih dari 4 sendi.|c: Kriteria durasi adalah ≥6 minggu, bukan >12 minggu.|d: Simetris bukan bagian kriteria 2010 (dahulu ada di kriteria 1987).","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 23"},{"n":32,"t":"rem","q":"Seorang perempuan 35 tahun datang ke poliklinik dengan keluhan nyeri pada persendian yang sudah dirasakan selama kurang lebih 3 bulan. Pemeriksaan fisik didapatkan pembengkakan dan nyeri tekan pada sendi interfalang proksimal (PIP) II sampai V kanan dan kiri, sendi metakarpofalang (MCP) II sampai V kanan dan kiri, pergelangan tangan kanan dan kiri dan sendi lutut kanan dan kiri. Hasil laboratorium: hemoglobin 11,5 g/dl, leukosit 8.000/mm3, Trombosit 260.000/mm3, laju endap darah (LED) 80 mm/jam. Apa diagnosis pasien tersebut?","o":[["a","Gout artritis"],["b","Osteoartritis"],["c","Reumatoid artritis"],["d","Artritis septik"],["e","Osteoporosis"]],"k":"c","e":"Poliartritis simetris sendi kecil tangan (PIP, MCP, pergelangan) >6 minggu dengan LED tinggi → artritis reumatoid.","w":"a: Gout biasanya monoartikular akut (MTP-1).|b: OA mengenai sendi penumpu, LED normal.|d: Artritis septik umumnya monoartikular akut dengan demam.|e: Osteoporosis tidak menimbulkan artritis.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 13, 23"},{"n":33,"t":"oa","q":"Seorang pasien laki-laki umur 51 tahun datang dengan keluhan nyeri pada kedua lutut terutama kanan dan terasa makin sakit jika berjalan atau beraktivitas. Dari pemeriksaan fisik didapat lutut yang sakit agak bengkak. Pemeriksaan TB 176 cm, BB 95 kg. Pemeriksaan apakah yang harus dilakukan untuk mendiagnosis pasien tersebut?","o":[["a","CT scan"],["b","USG"],["c","BMD"],["d","DXA"],["e","Foto genu"]],"k":"e","e":"Nyeri lutut saat aktivitas pada pasien obesitas usia >50 tahun → curiga OA lutut; pemeriksaan penunjang utama adalah foto genu (AP dan lateral).","w":"a: CT scan tidak rutin untuk OA.|b: USG bukan pemeriksaan standar OA.|c: BMD untuk osteoporosis.|d: DXA juga untuk osteoporosis.","s":"PPT Osteoartritis sl. 12–13"},{"n":34,"t":"fis","q":"Apakah yang BUKAN merupakan fungsi sistem otot rangka?","o":[["a","Menyokong jaringan lunak"],["b","Menghasilkan gerakan rangka"],["c","Mempertahankan suhu tubuh"],["d","Mengubah panas menjadi energi"],["e","Mempertahankan sikap dan posisi tubuh"]],"k":"d","e":"Fungsi otot rangka: menghasilkan gerakan, mempertahankan sikap tubuh, menyokong jaringan lunak, dan mempertahankan suhu tubuh (energi kontraksi diubah menjadi panas). Otot tidak mengubah panas menjadi energi.","w":"a: Menyokong jaringan lunak termasuk fungsi.|b: Menghasilkan gerakan termasuk fungsi.|c: Mempertahankan suhu tubuh termasuk fungsi.|e: Mempertahankan sikap tubuh termasuk fungsi.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 10"},{"n":35,"t":"oa","q":"Seorang pasien laki-laki umur 51 tahun datang dengan keluhan nyeri pada kedua lutut terutama kanan dan terasa makin sakit jika berjalan atau beraktivitas. Dari pemeriksaan fisik didapat lutut yang sakit agak bengkak. Pemeriksaan TB 176 cm, BB 95 kg. Berapa IMT pasien tersebut?","o":[["a","30,74 kg/m²"],["b","28,9 kg/m²"],["c","26,7 kg/m²"],["d","40 kg/m²"],["e","25 kg/m²"]],"k":"a","e":"IMT = BB / TB² = 95 / (1,76)² = 30,67 kg/m², paling dekat dengan 30,74 (obesitas).","w":"b: 28,9 kg/m² terlalu kecil.|c: 26,7 kg/m² terlalu kecil.|d: 40 kg/m² terlalu besar.|e: 25 kg/m² terlalu kecil.","s":"Perhitungan IMT (BB/TB²); PPT Osteoartritis sl. 10"},{"n":36,"t":"fis","q":"Apakah yang BUKAN merupakan bahan dasar anorganik pembentuk tulang?","o":[["a","Magnesium"],["b","Fosfat"],["c","Kalsium"],["d","Fluorida"],["e","Kondroitin"]],"k":"e","e":"Bahan dasar anorganik tulang adalah mineral (kalsium, fosfat, magnesium, fluorida). Kondroitin termasuk bahan organik (glikosaminoglikan).","w":"a: Magnesium mineral anorganik.|b: Fosfat mineral anorganik.|c: Kalsium mineral anorganik utama.|d: Fluorida mineral anorganik.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 38"},{"n":37,"t":"fis","q":"Apakah tempat ion kalsium otot?","o":[["a","Tubulus T"],["b","Mitokondria"],["c","Sarkolema"],["d","Terminal cisternae"],["e","Triad"]],"k":"d","e":"Terminal cisternae (ujung retikulum sarkoplasma) adalah tempat penyimpanan ion kalsium otot.","w":"a: Tubulus T menghantarkan potensial aksi.|b: Mitokondria tempat sintesis ATP.|c: Sarkolema adalah membran plasma.|e: Triad adalah satu tubulus T + dua terminal cisternae (struktur gabungan).","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 14; PPT Praktikum Muskuloskeletal sl. 22"},{"n":38,"t":"rem","q":"Apakah tatalaksana non-farmakologi pada RA?","o":[["a","Edukasi, proteksi sendi pada stadium akut, foot orthotic/splint (jika perlu). Latihan fisik (dynamic strength training) 30 menit setiap latihan 2-3 kali seminggu dengan intensitas sedang"],["b","Edukasi, proteksi sendi pada stadium akut, foot orthotic/splint (jika perlu). Latihan fisik (dynamic strength training) 30 menit setiap latihan 7 kali seminggu dengan intensitas sedang"],["c","Edukasi, proteksi sendi pada stadium akut, foot orthotic/splint (jika perlu). Latihan fisik (dynamic strength training) 30 menit setiap latihan 2-3 kali seminggu dengan intensitas berat"],["d","Edukasi, proteksi sendi pada stadium akut, foot orthotic/splint (jika perlu). Latihan fisik (dynamic strength training) 90 menit setiap latihan 2-3 kali seminggu dengan intensitas sedang"],["e","Latihan fisik (dynamic strength training) 30 menit setiap latihan 2-3 kali seminggu dengan intensitas tinggi"]],"k":"a","e":"Rekomendasi IRA: edukasi, proteksi sendi saat akut, ortotik/splint bila perlu, dan latihan dynamic strength training 30 menit, 2–3 kali seminggu, intensitas sedang.","w":"b: Frekuensinya 2–3 kali, bukan 7 kali seminggu.|c: Intensitasnya sedang, bukan berat.|d: Durasinya 30 menit, bukan 90 menit.|e: Tidak lengkap dan intensitasnya bukan tinggi.","s":"Buku teks: Rekomendasi IRA RA 2014 · tidak dibahas di PPT"},{"n":39,"t":"ana","q":"Trigonum femorale yang penting dalam klinis dibentuk oleh otot-otot...","o":[["a","Tepi lateral M. rectus femoris dan tepi lateral M. sartorius"],["b","Tepi medial M. semimembranosus dan tepi medial M. semitendinosus"],["c","Tepi medial M. rectus femoris dan tepi lateral M. sartorius"],["d","Lig. inguinale, tepi medial M. sartorius, tepi medial M. adductor longus"],["e","Lig. inguinale, tepi lateral M. sartorius, tepi lateral M. adductor longus"]],"k":"d","e":"Trigonum femorale dibatasi lig. inguinale (atas), tepi medial M. sartorius (lateral), dan tepi medial M. adductor longus (medial).","w":"a: Rectus femoris tidak membentuk batas trigonum femorale.|b: Semimembranosus dan semitendinosus di paha posterior.|c: Rectus femoris bukan batas.|e: Batasnya tepi medial, bukan lateral.","s":"PPT Anatomi Muskuloskeletal sl. 94"},{"n":40,"t":"bio","q":"Pada filamen tebal dan tipis, masing-masing mengandung protein. Apa fungsi dari troponin T?","o":[["a","Tempat mengikat tropomiosin dan dua komponen troponin lainnya"],["b","Tempat mengikatnya miosin"],["c","Tempat mengikatnya kalsium"],["d","Mempunyai aktivitas ATPase"],["e","Tempat menghambatnya interaksi aktin dan miosin"]],"k":"a","e":"Troponin T mengikat tropomiosin dan dua komponen troponin lain. Troponin I menghambat interaksi aktin–miosin; troponin C mengikat kalsium.","w":"b: Pengikatan miosin terjadi di aktin.|c: Fungsi troponin C.|d: Aktivitas ATPase milik kepala miosin.|e: Fungsi troponin I.","s":"PPT Biokimia Otot sl. 8"},{"n":41,"t":"ana","q":"Trigonum femorale dilalui oleh...","o":[["a","M. gluteus"],["b","Arteri, vena, nervus femoralis"],["c","Arteri dan vena tibialis"],["d","Arteri dan nervus peroneus"],["e","Nervus ischiadicus"]],"k":"b","e":"Isi trigonum femorale dari lateral ke medial: nervus, arteri, dan vena femoralis.","w":"a: M. gluteus di regio gluteal.|c: A./v. tibialis di tungkai bawah.|d: Peroneus di tungkai bawah lateral.|e: N. ischiadicus di paha posterior.","s":"PPT Anatomi Muskuloskeletal sl. 94"},{"n":42,"t":"neo","q":"Tumor tulang yang langka, jinak, dan agresif secara lokal yang biasanya menyerang epifisis atau apofisis tulang panjang, berasal dari pertumbuhan sel tulang rawan yang belum matang dari pusat osifikasi sekunder yang berasal dari lempeng epifisis, biasanya dijumpai pada usia 10–25 tahun, tumbuh lambat, perempuan lebih sering daripada laki-laki, nyeri sendi, disebut...","o":[["a","Chondromyxoid fibroma"],["b","Chondroblastoma"],["c","Chondroma"],["d","Chondrofibroma"],["e","Chondrosarcoma"]],"k":"b","e":"Chondroblastoma: tumor jinak tetapi agresif lokal, berasal dari kondroblas di pusat osifikasi sekunder, khas di epifisis tulang panjang, usia 10–25 tahun.","w":"a: Chondromyxoid fibroma di metafisis.|c: Chondroma di tulang kecil tangan/kaki.|d: Chondrofibroma bukan entitas baku.|e: Chondrosarcoma ganas, usia >40 tahun.","s":"Buku teks: Robbins / WHO tumor tulang · tidak dibahas di PPT"},{"n":43,"t":"ana","q":"Tendon otot yang kelihatan tepat di tengah-tengah lengan bawah adalah...","o":[["a","M. flexor carpi ulnaris"],["b","M. extensor carpi radialis"],["c","M. flexor carpi radialis"],["d","M. palmaris longus"],["e","M. palmaris brevis"]],"k":"d","e":"Tendon M. palmaris longus terletak tepat di garis tengah pergelangan tangan bagian volar.","w":"a: FCU di sisi ulnar.|b: Ekstensor ada di sisi dorsal.|c: FCR lebih ke radial dari palmaris longus.|e: Palmaris brevis adalah otot kecil di hipotenar, tanpa tendon panjang.","s":"PPT Anatomi Muskuloskeletal sl. 80; Buku teks: Snell"},{"n":44,"t":"ana","q":"Pada sisi lateral regio antebrachii terdapat tulang-tulang","o":[["a","Os radius"],["b","Os scapula"],["c","Os clavicula"],["d","Os ulna"],["e","Os humerus"]],"k":"a","e":"Radius terletak di sisi lateral antebrachium; ulna di medial.","w":"b: Scapula adalah tulang gelang bahu.|c: Clavicula adalah tulang gelang bahu.|d: Ulna di sisi medial.|e: Humerus di lengan atas.","s":"PPT Anatomi Muskuloskeletal sl. 28"},{"n":45,"t":"trm","q":"Saat Anda jaga di IGD tadi malam, seorang laki-laki 45 tahun datang dengan fraktur terbuka pinggang belakang setelah dilindas truk. Yang menjadi tatalaksana prioritas pada pasien adalah...","o":[["a","Jalan napas"],["b","Kesadaran pasien"],["c","Fraktur terbuka"],["d","Perdarahan"],["e","Kaki yang lumpuh"]],"k":"a","e":"Primary survey ATLS dimulai dari airway (dengan proteksi servikal), lalu breathing, circulation (perdarahan), disability, dan exposure.","w":"b: Kesadaran dinilai pada tahap D.|c: Fraktur terbuka ditangani setelah ABC stabil.|d: Kontrol perdarahan tahap C, setelah airway dan breathing.|e: Kelumpuhan dinilai di tahap D/secondary survey.","s":"PPT Fraktur sl. 21"},{"n":46,"t":"oa","q":"Seorang pasien laki-laki umur 51 tahun datang dengan keluhan nyeri pada kedua lutut terutama kanan dan terasa makin sakit jika berjalan atau beraktivitas. Dari pemeriksaan fisik didapat lutut yang sakit agak bengkak. Pemeriksaan TB 176 cm, BB 95 kg. Dilakukan foto genu dengan gambaran sendi normal, tetapi terdapat osteofit minimal. Apakah derajat penyakit pasien?","o":[["a","OA grade 2"],["b","OA grade 4"],["c","OA grade 3"],["d","OA grade 0"],["e","OA grade 1"]],"k":"e","e":"Derajat 1 OA: gambaran sendi normal tetapi ada osteofit minimal.","w":"a: Derajat 2: osteofit di 2 tempat.|b: Derajat 4: celah sendi hilang, sklerosis, kista.|c: Derajat 3: osteofit moderat, deformitas ujung tulang.|d: Derajat 0: tidak ada gambaran OA.","s":"PPT Osteoartritis sl. 25"},{"n":47,"t":"oa","q":"Seorang pasien laki-laki umur 51 tahun datang dengan keluhan nyeri pada kedua lutut terutama kanan dan terasa makin sakit jika berjalan atau beraktivitas. Dari pemeriksaan fisik didapat lutut yang sakit agak bengkak. Pemeriksaan TB 176 cm, BB 95 kg. Minimal dengan osteofit pada 2 tempat, tidak terdapat sklerosis dan kista subkondral, serta celah sendi baik. Apakah derajat penyakit pasien?","o":[["a","OA grade 2"],["b","OA grade 3"],["c","OA grade 0"],["d","OA grade 1"],["e","OA grade 4"]],"k":"a","e":"Derajat 2 OA: osteofit minimal di 2 tempat, tanpa sklerosis atau kista subkondral, celah sendi baik.","w":"b: Derajat 3: osteofit moderat dan celah sempit.|c: Derajat 0: tidak ada osteofit.|d: Derajat 1: osteofit minimal dengan sendi normal.|e: Derajat 4: celah hilang, sklerosis, kista.","s":"PPT Osteoartritis sl. 25"},{"n":48,"t":"neo","q":"Tumor tulang jinak yang muncul dari osteoblas dan beberapa komponen osteoklas, berukuran kurang dari 1,5 cm, bisa berada di tulang mana pun, paling sering terjadi di tulang panjang seperti tulang paha dan tibia, disebut...","o":[["a","Osteoid osteoma"],["b","Osteoblastoma"],["c","Osteosarcoma"],["d","Osteofibroma"],["e","Osteoid fibroma"]],"k":"a","e":"Osteoid osteoma: tumor osteoblastik jinak berukuran <1,5–2 cm, tersering di korteks femur dan tibia, khas nyeri malam yang membaik dengan aspirin/OAINS. Bila >2 cm disebut osteoblastoma.","w":"b: Osteoblastoma ukurannya >2 cm dan sering di vertebra posterior.|c: Osteosarkoma adalah tumor ganas.|d: Osteofibroma bukan istilah baku tumor tulang.|e: Osteoid fibroma bukan istilah baku.","s":"Buku teks: Robbins · tidak dibahas di PPT"},{"n":49,"t":"neo","q":"Keganasan yang berasal dari epitel disebut...","o":[["a","Carcinoma"],["b","Dysplasia"],["c","Metaplasia"],["d","Hiperplasia"],["e","Sarcoma"]],"k":"a","e":"Tumor ganas yang berasal dari sel epitel disebut karsinoma; dari jaringan mesenkim (tulang, otot, lemak) disebut sarkoma.","w":"b: Displasia adalah pertumbuhan sel yang tidak teratur, belum tentu ganas.|c: Metaplasia adalah pergantian satu jenis sel dewasa menjadi jenis lain.|d: Hiperplasia adalah pertambahan jumlah sel, bukan keganasan.|e: Sarkoma berasal dari jaringan mesenkim.","s":"Buku teks: Robbins · tidak dibahas di PPT"},{"n":50,"t":"fis","q":"Apakah yang BUKAN merupakan fungsi dari osteoblas?","o":[["a","Pembentukan dan mineralisasi tulang"],["b","Berfungsi membentuk tulang menjadi keras"],["c","Merupakan sel pembentuk tulang yang berasal dari sel osteoprogenitor"],["d","Menghasilkan alkali fosfatase"],["e","Perbaikan kerusakan tulang"]],"k":"d","e":"Slide osteoblas menyebut fungsinya: sel pembentuk tulang dari osteoprogenitor, membentuk dan memineralisasi tulang, mengeraskan tulang, dan memperbaiki kerusakan tulang. Alkali fosfatase tidak disebut di daftar tersebut, sehingga dipilih sebagai jawaban.","w":"a: Pembentukan dan mineralisasi tulang tercantum di slide.|b: Mengeraskan tulang tercantum di slide.|c: Asal dari osteoprogenitor tercantum di slide.|e: Perbaikan kerusakan tulang tercantum di slide.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 36–37","c":"Daftar fungsi osteoblas di slide 36 tidak menyebut alkali fosfatase, padahal slide 37 dan buku teks menyatakan osteoblas menghasilkan ALP. Sebenarnya semua opsi adalah fungsi osteoblas; kunci mengikuti daftar di slide osteoblas.","amb":1},{"n":51,"t":"fis","q":"Bagaimana terjadinya kaku mayat?","o":[["a","Pada terjadinya kematian, tubuh akan kehilangan glukosa yang diawali dengan kekakuan otot"],["b","Pada terjadinya kematian, tubuh tidak akan merespon asetilkolin sehingga otot menjadi kaku"],["c","Pada terjadinya kematian, tubuh akan meningkatkan asam laktat karena tidak adanya oksigen"],["d","Pada terjadinya kematian, tubuh mayat akan kehilangan ATP, sehingga ikatan aktin dan myosin tidak bisa terlepas"],["e","Pada terjadinya kematian, kadar kalsium meningkat yang menyebabkan tubuh menjadi kaku"]],"k":"d","e":"Setelah kematian, ATP tidak lagi dibentuk. ATP dibutuhkan untuk melepas ikatan kepala miosin dari aktin, sehingga cross bridge tetap terkunci dan otot menjadi kaku (rigor mortis).","w":"a: Hilangnya glukosa bukan penyebab langsung kekakuan.|b: Asetilkolin tidak berperan pada rigor mortis.|c: Asam laktat memang naik, tapi bukan penyebab kaku.|e: Kalsium memang bocor, tapi kekakuan menetap karena tidak ada ATP untuk melepas ikatan.","s":"PPT Praktikum Muskuloskeletal sl. 34"},{"n":52,"t":"bio","q":"Otot adalah mesin biokimia yang mengubah energi potensial (kimiawi) menjadi energi kinetik (mekanis). Otot rangka bersifat volunter, yaitu terkontrol oleh saraf. Otot rangka juga disebut otot striata karena pada pemeriksaan mikroskop tampak bergaris-garis atau lurik-lurik. Hal ini karena miofibril terdiri dari dua jenis filamen, yaitu filamen tebal dan filamen tipis. Apa peran enzim ATPase yang terikat di kepala miosin?","o":[["a","Mengubah ATP menjadi ADP dan Pi"],["b","Mengikat kepala miosin ke aktin sehingga membentuk jembatan silang"],["c","Mengagregasi ekor miosin sehingga mengubah miosin inaktif menjadi miosin aktif"],["d","Menangkap kalsium dan membawanya ke troponin C"],["e","Mengubah ADP dan Pi menjadi ATP"]],"k":"a","e":"Kepala miosin memiliki aktivitas ATPase yang menghidrolisis ATP menjadi ADP + Pi. Energinya dipakai untuk \"mengokang\" kepala miosin sebelum power stroke.","w":"b: Pengikatan miosin ke aktin terjadi setelah situs aktin terbuka oleh Ca2+, bukan fungsi ATPase.|c: Ini bukan fungsi ATPase.|d: Kalsium diikat troponin C, bukan dibawa miosin.|e: Pembentukan ATP dari ADP + Pi terjadi di mitokondria/glikolisis.","s":"PPT Biokimia Otot sl. 11"},{"n":53,"t":"oa","q":"Seorang pasien laki-laki umur 51 tahun datang dengan keluhan nyeri pada kedua lutut terutama kanan dan terasa makin sakit jika berjalan atau beraktivitas. Dari pemeriksaan fisik didapat lutut yang sakit agak bengkak. Pemeriksaan TB 176 cm, BB 95 kg. Faktor risiko apakah yang dapat diubah pada pasien di atas?","o":[["a","Kerja keras"],["b","Obesitas"],["c","Aktivitas"],["d","Keturunan"],["e","Kurang hormon"]],"k":"b","e":"Faktor risiko OA yang dapat diubah: obesitas, trauma/beban sendi, kelemahan otot. Pasien ini BB 95 kg, TB 176 cm (IMT ±30,7) sehingga obesitas adalah faktor yang bisa diubah.","w":"a: Kerja keras bukan faktor risiko spesifik pada kasus ini.|c: Aktivitas tidak spesifik, justru olahraga ringan dianjurkan.|d: Keturunan tidak dapat diubah.|e: Kurang hormon tidak relevan pada laki-laki ini.","s":"PPT Osteoartritis sl. 9"},{"n":54,"t":"ort","q":"Seorang anak muda usia 17 tahun hendak melamar tentara, namun tinggi badan tidak cukup. Beliau minta dioperasi meninggikan tulang. Kontraindikasi untuk melaksanakan operasi di atas adalah...","o":[["a","Osteopenia"],["b","Pneumonia"],["c","Malaria"],["d","Growth arrest"],["e","Osteogenesis imperfecta"]],"k":"a","e":"Pemanjangan tulang (distraksi osteogenesis) membutuhkan tulang yang sehat untuk membentuk regenerat. Osteopenia (kualitas tulang buruk) merupakan kontraindikasi.","w":"b: Pneumonia bukan kontraindikasi khas prosedur ini (cukup ditunda).|c: Malaria bukan kontraindikasi khas; cukup diobati dulu, operasinya ditunda.|d: Growth arrest justru bisa menjadi indikasi pemanjangan.|e: Osteogenesis imperfecta juga kontraindikasi relatif (lihat catatan).","s":"Buku teks: Apley (distraction osteogenesis)","c":"Osteopenia (kualitas tulang buruk) dan osteogenesis imperfecta sama-sama kontraindikasi relatif pemanjangan tulang.","amb":1},{"n":55,"t":"ort","q":"Seorang anak usia 10 tahun dibawa ayahnya ke poli dengan keluhan demam dan tidak bisa jalan sejak pagi tadi. Pada pemeriksaan dijumpai bengkak pada daerah pinggang ke pelvis. Pemeriksaan yang Anda lakukan adalah...","o":[["a","X-ray"],["b","MRI"],["c","Stretch test"],["d","CT scan"],["e","Fisik diagnostik"]],"k":"a","e":"Anak dengan demam, tidak bisa berjalan mendadak, dan bengkak di pinggang–pelvis → curiga infeksi tulang/sendi (osteomielitis atau artritis septik panggul). Pemeriksaan penunjang pertama adalah foto polos (X-ray).","w":"b: MRI paling sensitif untuk infeksi dini, tetapi bukan pemeriksaan awal (lihat catatan).|c: Stretch test untuk saraf/otot, bukan infeksi.|d: CT scan bukan pemeriksaan awal.|e: Pemeriksaan fisik sudah dilakukan; soal menanyakan pemeriksaan penunjang.","s":"PPT Infeksi Tulang sl. 14; Buku teks: Apley","c":"Foto polos adalah pemeriksaan penunjang awal. MRI paling sensitif untuk osteomielitis atau artritis septik dini, karena foto polos sering masih normal pada 10 hari pertama.","amb":1},{"n":56,"t":"ana","q":"Persendian antara lengan bawah dengan pergelangan tangan disebut...","o":[["a","Art. metacarpophalangea"],["b","Art. cubiti"],["c","Art. poplitea"],["d","Art. radioulnaris"],["e","Art. radiocarpea"]],"k":"e","e":"Articulatio radiocarpea menghubungkan ujung distal radius (lengan bawah) dengan tulang karpal proksimal (scaphoideum, lunatum, triquetrum).","w":"a: MCP menghubungkan metacarpal dan falang.|b: Art. cubiti adalah sendi siku.|c: Poplitea adalah regio belakang lutut.|d: Art. radioulnaris menghubungkan radius dengan ulna.","s":"PPT Anatomi Muskuloskeletal sl. 32; Buku teks: Snell"},{"n":57,"t":"fis","q":"Apakah yang BUKAN merupakan ciri-ciri otot rangka?","o":[["a","Awal kontraksi cepat"],["b","Sumber energi dari metabolisme aerobik dan anaerobik"],["c","Memiliki banyak inti"],["d","Dipersarafi oleh saraf motorik somatik"],["e","Tahan terhadap kelelahan"]],"k":"e","e":"Slide fisiologi menyebut ciri otot rangka: berinti banyak, dipersarafi saraf motorik somatik (volunter), awal kontraksi cepat, energi dari metabolisme aerob dan anaerob, dan cepat lelah. Jadi \"tahan terhadap kelelahan\" bukan ciri otot rangka.","w":"a: Awal kontraksi cepat adalah ciri otot rangka.|b: Energi aerob dan anaerob adalah ciri otot rangka.|c: Berinti banyak adalah ciri otot rangka.|d: Dipersarafi saraf motorik somatik adalah ciri otot rangka.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 9","c":"Buku teks (Guyton): sifat lelah otot rangka bergantung tipe serat. Serat tipe I (lambat) tahan lelah, serat tipe II (cepat) mudah lelah. Untuk ujian, ikuti PPT: otot rangka cepat lelah.","ppt":1},{"n":58,"t":"fis","q":"Berapakah periode pemendekan otot atau kontraksi?","o":[["a","0,07 detik"],["b","0,005–0,01 detik"],["c","0,05 detik"],["d","0,08 detik"],["e","0,04 detik"]],"k":"e","e":"Pada kurva twitch otot, periode kontraksi (pemendekan) berlangsung ±0,04 detik, setelah periode laten ±0,005–0,01 detik, lalu periode relaksasi ±0,05 detik.","w":"a: 0,07 detik tidak sesuai slide.|b: 0,005–0,01 detik adalah periode laten, bukan periode kontraksi.|c: 0,05 detik adalah periode relaksasi.|d: 0,08 detik tidak sesuai slide.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 26; PPT Praktikum Muskuloskeletal sl. 53"},{"n":59,"t":"neo","q":"Diagnosis banding dari osteoblastoma adalah","o":[["a","Chondroblastoma"],["b","Fibrosarcoma"],["c","Aneurysmal bone cyst"],["d","Rhabdomyosarcoma"],["e","Chondrosarcoma"]],"k":"c","e":"Diagnosis banding osteoblastoma adalah osteoid osteoma, aneurysmal bone cyst (ABC), dan osteosarkoma. ABC sering ditemukan bersama osteoblastoma (komponen ABC sekunder).","w":"a: Chondroblastoma tumor kartilago di epifisis.|b: Fibrosarkoma tumor ganas fibroblastik.|d: Rhabdomyosarcoma tumor jaringan lunak (otot rangka).|e: Chondrosarcoma tumor kartilago ganas pada dewasa tua.","s":"Buku teks: Robbins / WHO tumor tulang · tidak dibahas di PPT"},{"n":60,"t":"neo","q":"Keganasan yang berasal dari sel di dalam jaringan lunak (otot, lemak, tendon/sambungan otot dengan tulang, saraf, pembuluh darah, persendian) dan tulang, disebut...","o":[["a","Hiperplasia"],["b","Carcinoma"],["c","Papiloma"],["d","Sarcoma"],["e","Metaplasia"]],"k":"d","e":"Sarkoma adalah keganasan yang berasal dari jaringan mesenkim: tulang, otot, lemak, tendon, saraf, pembuluh darah, dan sinovium.","w":"a: Hiperplasia bukan keganasan.|b: Karsinoma berasal dari epitel.|c: Papiloma tumor jinak epitel.|e: Metaplasia bukan keganasan.","s":"PPT Neoplasma Muskuloskeletal sl. 2–4; Buku teks: Robbins"},{"n":61,"t":"ana","q":"Os atlas adalah nama lain dari...","o":[["a","Vertebra cervicalis IV"],["b","Vertebra cervicalis II"],["c","Vertebra cervicalis III"],["d","Vertebra cervicalis VII"],["e","Vertebra cervicalis I"]],"k":"e","e":"Atlas adalah vertebra cervicalis I (C1), tidak punya corpus dan processus spinosus; axis adalah C2.","w":"a: C4 vertebra servikal tipikal.|b: C2 disebut axis.|c: C3 vertebra servikal tipikal.|d: C7 disebut vertebra prominens.","s":"PPT Anatomi Muskuloskeletal sl. 13"},{"n":62,"t":"oa","q":"Apakah hasil yang akan didapat pada pemeriksaan radiologi OA?","o":[["a","Edema sendi"],["b","Osteofit"],["c","Peningkatan vaskular"],["d","Tanda sepsis"],["e","Perluasan celah sendi"]],"k":"b","e":"Gambaran radiologis OA: osteofit, penyempitan celah sendi yang tidak simetris, sklerosis subkondral, dan kista subkondral.","w":"a: Edema sendi tidak terlihat pada foto polos.|c: Peningkatan vaskular bukan gambaran OA.|d: Tanda sepsis bukan gambaran OA.|e: Celah sendi justru menyempit.","s":"PPT Osteoartritis sl. 13"},{"n":63,"t":"rem","q":"Bagaimanakah karakteristik gejala nyeri reumatoid artritis?","o":[["a","Kaku pada pagi saat istirahat yang berlangsung lebih dari 1 jam atau memburuk dengan beraktivitas"],["b","Terdapat gejala konstitusional seperti kelemahan"],["c","Kaku pada siang hari yang berlangsung lebih dari 1 jam atau membaik dengan beraktivitas"],["d","Kaku pada pagi hari yang berlangsung lebih dari 1 jam atau memburuk dengan beraktivitas"],["e","Kaku pada pagi hari yang berlangsung lebih dari 1 jam atau membaik dengan beraktivitas"]],"k":"e","e":"Kekakuan sendi pada RA khas di pagi hari, berlangsung >1 jam, dan membaik dengan aktivitas. Ini berbeda dengan OA yang kakunya singkat (<30 menit) dan nyerinya memburuk dengan aktivitas.","w":"a: Nyeri RA membaik, bukan memburuk, dengan aktivitas.|b: Gejala konstitusional juga ada pada RA, tapi tidak menggambarkan karakter nyeri (lihat catatan).|c: Kekakuan khas di pagi hari, bukan siang.|d: Membaik, bukan memburuk, dengan aktivitas.","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 13; Buku teks: IPD","c":"Opsi {b} (gejala konstitusional seperti lemah) juga ditemukan pada RA, tetapi soal menanyakan karakter nyeri/kaku sendi, sehingga E lebih tepat.","amb":1},{"n":64,"t":"oa","q":"Apakah klasifikasi OA berdasarkan lokasi?","o":[["a","OA lutut, OA tangan, OA vertebra"],["b","OA lutut, OA vertebra"],["c","OA lutut, OA tangan, OA kepala"],["d","OA lutut, OA kepala, OA vertebra"],["e","OA lutut, OA tangan"]],"k":"a","e":"Klasifikasi OA berdasarkan lokasi sendi yang terkena: OA lutut, OA tangan, OA panggul, dan OA vertebra. Opsi yang paling lengkap: lutut, tangan, vertebra.","w":"b: Tidak menyebut OA tangan.|c: \"OA kepala\" bukan klasifikasi.|d: \"OA kepala\" bukan klasifikasi.|e: Tidak menyebut OA vertebra.","s":"PPT Osteoartritis sl. 18–19"},{"n":66,"t":"oa","q":"Seorang pasien laki-laki umur 51 tahun datang dengan keluhan nyeri pada kedua lutut terutama kanan dan terasa makin sakit jika berjalan atau beraktivitas. Dari pemeriksaan fisik didapat lutut yang sakit agak bengkak. Pemeriksaan TB 176 cm, BB 95 kg. Pemeriksaan radiologi dijumpai osteofit moderat, deformitas ujung tulang, dan celah sendi sempit. Apakah kemungkinan diagnosis pasien tersebut?","o":[["a","Osteoartritis"],["b","Reumatoid artritis"],["c","Spondilosis"],["d","Spondiloartropati"],["e","Osteoporosis"]],"k":"a","e":"Laki-laki 51 tahun obesitas, nyeri lutut memberat saat berjalan, dengan radiologis osteofit moderat, deformitas ujung tulang, dan celah sendi sempit → osteoartritis (derajat 3).","w":"b: RA mengenai sendi kecil simetris, tanpa osteofit.|c: Spondilosis adalah degenerasi tulang belakang.|d: Spondiloartropati mengenai sendi aksial/sakroiliaka.|e: Osteoporosis tidak menyebabkan osteofit.","s":"PPT Osteoartritis sl. 25"},{"n":67,"t":"ort","q":"Seorang anak muda usia 17 tahun hendak melamar tentara, namun tinggi badan tidak cukup. Beliau minta dioperasi meninggikan tulang. Indikasi untuk melaksanakan operasi di atas adalah...","o":[["a","Klippel-Feil"],["b","SCFE"],["c","Blount"],["d","Akondroplasia"],["e","Osgood-Schlatter"]],"k":"d","e":"Akondroplasia (displasia skeletal dengan perawakan pendek tungkai pendek) adalah indikasi pemanjangan tulang ekstremitas.","w":"a: Klippel-Feil adalah fusi vertebra servikal.|b: SCFE (slipped capital femoral epiphysis) ditangani dengan fiksasi in situ.|c: Blount adalah deformitas varus tibia.|e: Osgood-Schlatter adalah apofisitis tuberositas tibia.","s":"Buku teks: Apley · tidak dibahas di PPT"},{"n":68,"t":"fis","q":"Pada periode apakah ikatan Cross bridge dilepas?","o":[["a","Periode laten"],["b","Periode kontraksi"],["c","Supra maksimal"],["d","Periode relaksasi"],["e","Maksimal"]],"k":"d","e":"Saat periode relaksasi, Ca2+ dipompa kembali ke retikulum sarkoplasma, troponin–tropomiosin menutup situs aktif aktin, dan cross bridge terlepas.","w":"a: Periode laten adalah jeda sebelum kontraksi.|b: Saat periode kontraksi cross bridge terbentuk dan bekerja.|c: Supra maksimal adalah intensitas rangsang.|e: Maksimal adalah intensitas rangsang.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 26; PPT Praktikum Muskuloskeletal sl. 53"},{"n":69,"t":"fis","q":"Enzim yang berperan dalam metabolisme tulang adalah...","o":[["a","Acid fosfatase"],["b","Aldolase"],["c","Alkali fosfatase"],["d","Hidrolase"],["e","Kreatin fosfokinase"]],"k":"c","e":"Alkali fosfatase (dihasilkan osteoblas) berperan dalam mineralisasi tulang dan menjadi penanda pembentukan tulang.","w":"a: Acid fosfatase (TRAP) penanda osteoklas, bukan enzim utama yang disebut slide.|b: Aldolase enzim glikolisis/penanda kerusakan otot.|d: Hidrolase istilah umum.|e: Kreatin fosfokinase penanda kerusakan otot.","s":"PPT Sistem Muskuloskeletal (Fisiologi) sl. 37"},{"n":70,"t":"trm","q":"Seorang laki-laki usia 28 tahun datang ke rumah sakit dengan keluhan nyeri pada sendi pergelangan kaki kanan bagian belakang akibat terjatuh ketika sedang berlari kencang. Dokter yang melakukan pemeriksaan menduga tendon Achilles penderita mengalami ruptur. Uji yang sesuai dengan kasus tersebut adalah...","o":[["a","Tes sag posterior"],["b","Tes Thompson"],["c","Tes Lachman"],["d","Tes recurvatum rotasi eksternal"],["e","Tes Apley"]],"k":"b","e":"Tes Thompson: pasien tengkurap, betis diremas. Normalnya kaki plantar fleksi; bila tidak ada gerakan, tendon Achilles ruptur.","w":"a: Sag posterior untuk ligamentum cruciatum posterior.|c: Lachman untuk ligamentum cruciatum anterior.|d: Recurvatum rotasi eksternal untuk sudut posterolateral lutut.|e: Tes Apley untuk meniskus.","s":"PPT Fraktur sl. 73"},{"n":71,"t":"far","q":"Salah satu obat pelemas otot yang bekerja secara kompetitif di transmisi neuromuskular yang diekskresi utuh melalui ginjal adalah...","o":[["a","Pancuronium"],["b","Gallamine"],["c","Vecuronium"],["d","Atrakurium"],["e","d-tubocurarine"]],"k":"b","e":"Galamin adalah pelemas otot nondepolarisasi (kompetitif) yang diekskresi utuh seluruhnya lewat ginjal, sehingga dikontraindikasikan pada gagal ginjal.","w":"a: Pankuronium sebagian dimetabolisme hati, sebagian besar diekskresi ginjal.|c: Vekuronium terutama diekskresi lewat empedu/hati.|d: Atrakurium terurai spontan di plasma (eliminasi Hofmann).|e: d-tubokurarin diekskresi ginjal dan empedu.","s":"Buku teks: Katzung · tidak dibahas di PPT"},{"n":72,"t":"ort","q":"Seorang pria usia 60 tahun datang ke poli Anda dengan keluhan kebas di tapak kaki kanan dan kiri. Pemeriksaan yang Anda lakukan dalam bidang radiologi adalah...","o":[["a","PET CT"],["b","X-ray"],["c","MRI"],["d","USG"],["e","CT scan"]],"k":"c","e":"Kebas di kedua tapak kaki pada usia lanjut → curiga kelainan tulang belakang (mielopati atau radikulopati). Pemeriksaan radiologi pilihan untuk menilai saraf dan diskus adalah MRI.","w":"a: PET CT untuk mencari keganasan/metastasis.|b: X-ray tidak dapat menilai saraf dan diskus.|d: USG tidak menembus tulang belakang.|e: CT scan baik untuk tulang, kurang baik untuk jaringan saraf.","s":"PPT Tulang Belakang sl. 4"},{"n":73,"t":"rem","q":"Gejala nyeri yang membedakan antara reumatoid artritis dengan osteoartritis adalah...","o":[["a","Kaku pada pagi hari yang berlangsung lebih dari 1 jam atau memburuk dengan aktivitas"],["b","Kaku pada siang hari yang berlangsung lebih dari 1 jam atau membaik dengan beraktivitas"],["c","Kaku pada pagi hari yang berlangsung lebih dari 1 jam atau membaik dengan beraktivitas"],["d","Kaku pada pagi saat istirahat yang berlangsung lebih dari 1 jam atau memburuk dengan beraktivitas"],["e","Terdapat gejala konstitusional seperti kelemahan"]],"k":"c","e":"Pembeda utama RA dan OA adalah kaku pagi: RA >1 jam dan membaik dengan aktivitas; OA <30 menit dan nyeri memburuk dengan aktivitas.","w":"a: \"Memburuk dengan aktivitas\" adalah ciri OA.|b: Kekakuan khas di pagi hari, bukan siang.|d: \"Memburuk dengan aktivitas\" adalah ciri OA.|e: Gejala konstitusional juga dapat membedakan, tapi bukan gejala nyeri (lihat catatan).","s":"PPT Penyakit Tulang & Sendi (RA, Gout) sl. 13; Buku teks: IPD","c":"Gejala konstitusional (opsi {e}) juga membedakan RA dari OA, tetapi soal menanyakan gejala nyeri, sehingga kaku pagi >1 jam yang membaik dengan aktivitas ({c}) lebih tepat.","amb":1},{"n":74,"t":"osp","q":"Seorang perempuan usia 38 tahun menderita lupus eritematosus sistemik disertai komplikasi ginjal. Ia kemudian mendapat pengobatan kortikosteroid jangka panjang. Penyakit tulang apakah yang paling besar kemungkinannya akan timbul akibat pengobatan kortikosteroid itu?","o":[["a","Osteomielitis"],["b","Paget disease of bone"],["c","Rakitis"],["d","Osteomalasia"],["e","Osteoporosis"]],"k":"e","e":"Kortikosteroid jangka panjang adalah penyebab tersering osteoporosis sekunder: menghambat osteoblas, meningkatkan resorpsi, dan menurunkan absorpsi kalsium usus.","w":"a: Osteomielitis disebabkan infeksi.|b: Penyakit Paget tidak dipicu steroid.|c: Rakitis disebabkan defisiensi vitamin D pada anak, bukan kortikosteroid.|d: Osteomalasia disebabkan defisiensi vitamin D/fosfat.","s":"PPT Osteoporosis sl. 12, 16"},{"n":75,"t":"ort","q":"Hal-hal yang penting pada saat memeriksa pasien yang akan di-MRI adalah...","o":[["a","Kesadaran"],["b","Usia"],["c","Ada fiksasi interna"],["d","Jenis kelamin"],["e","Hubungan saudara dengan Anda"]],"k":"c","e":"Sebelum MRI wajib ditanyakan adanya logam di tubuh (fiksasi interna, pacemaker, klip aneurisma) karena medan magnet kuat dapat menggeser atau memanaskan logam dan menimbulkan artefak.","w":"a: Kesadaran tidak menentukan bisa atau tidaknya MRI.|b: Usia tidak menjadi kontraindikasi.|d: Jenis kelamin tidak relevan.|e: Hubungan keluarga tidak relevan.","s":"Buku teks: radiologi (kontraindikasi MRI) · tidak dibahas di PPT"},{"n":76,"t":"osp","q":"Seorang wanita usia 56 tahun sering mengeluh nyeri pada pinggang terutama saat membungkuk. Dari hasil pemeriksaan BMD dijumpai nilai T = -3. Wanita tersebut juga telah mengalami menopause selama 7 tahun. Penatalaksanaan yang paling sesuai pada kasus tersebut adalah...","o":[["a","Pemberian vitamin D"],["b","Terapi sulih hormon estrogen"],["c","Melakukan aktivitas fisik"],["d","Pemberian fosfor"],["e","Berjemur sinar matahari"]],"k":"b","e":"Perempuan pascamenopause dengan T-score −3 (osteoporosis). Slide menyebut terapi osteoporosis pascamenopause: estrogen (terapi sulih hormon), bisfosfonat, kalsium, dan vitamin D. Dari opsi, yang paling sesuai mekanisme defisiensi estrogen adalah terapi sulih hormon.","w":"a: Vitamin D hanya terapi pendukung.|c: Aktivitas fisik hanya pencegahan/pendukung.|d: Fosfor tidak diberikan untuk osteoporosis.|e: Berjemur hanya membantu sintesis vitamin D.","s":"PPT Osteoporosis sl. 28","c":"Slide menyebut estrogen (masih pro-kontra), bisfosfonat, kalsium, dan vitamin D. Buku teks dan pedoman terkini mengutamakan bisfosfonat sebagai lini pertama, tetapi bisfosfonat tidak ada di opsi.","amb":1},{"n":77,"t":"bio","q":"Untuk menyerap kalsium diperlukan sintesis protein pengikat kalsium intrasel yang diinduksi oleh vitamin D. Apakah protein pengikat kalsium tersebut?","o":[["a","Kalmodulin"],["b","Troponin"],["c","7-dehidrokolesterol"],["d","Kalbindin"],["e","Asetilkolin"]],"k":"d","e":"Kalsitriol (vitamin D aktif) menginduksi sintesis kalbindin, protein pengikat kalsium di enterosit yang membawa Ca2+ dari apikal ke basolateral sel usus.","w":"a: Kalmodulin protein pengikat kalsium di otot polos, bukan diinduksi vitamin D untuk absorpsi.|b: Troponin protein regulator otot rangka.|c: 7-dehidrokolesterol adalah prekursor vitamin D di kulit.|e: Asetilkolin adalah neurotransmiter.","s":"PPT Biokimia Otot sl. 28"},{"n":78,"t":"osp","q":"Hormon yang berperan saat kadar kalsium tinggi di darah adalah...","o":[["a","Vitamin D"],["b","Kalsekuestrin"],["c","Rianodin"],["d","Hormon paratiroid"],["e","Kalsitonin"]],"k":"e","e":"Kalsitonin dari sel C (parafolikular) tiroid disekresi saat Ca2+ darah tinggi; kerjanya menghambat osteoklas sehingga kalsium darah turun.","w":"a: Vitamin D meningkatkan kalsium darah.|b: Kalsekuestrin pengikat Ca2+ di retikulum sarkoplasma.|c: Reseptor rianodin adalah kanal pelepas Ca2+ di retikulum sarkoplasma.|d: PTH disekresi saat kalsium darah rendah.","s":"PPT Farmakologi Homeostasis Tulang sl. 35"},{"n":79,"t":"osp","q":"Salah satu yang dapat menghambat osteoblas adalah...","o":[["a","1,25-dihidroksikolekalsiferol"],["b","Kortikosteroid"],["c","PGE2"],["d","Kalsitonin"],["e","Estrogen"]],"k":"b","e":"Kortikosteroid menghambat proliferasi dan fungsi osteoblas serta memicu apoptosisnya, sehingga pembentukan tulang turun.","w":"a: Kalsitriol justru merangsang diferensiasi osteoblas.|c: PGE2 merangsang osteoblas pada dosis tertentu.|d: Kalsitonin menghambat osteoklas, bukan osteoblas.|e: Estrogen melindungi tulang.","s":"PPT Osteoporosis sl. 12"},{"n":80,"t":"bio","q":"Seorang mahasiswa melakukan fitness dengan intensitas tinggi tanpa melakukan pemanasan. Keesokan harinya ia merasa otot kaki dan tangannya nyeri. Mengapa hal ini bisa terjadi?","o":[["a","Mahasiswa tersebut menggunakan sumber ATP dari kreatin fosfat, sehingga terjadi penumpukan kreatinin yang menyebabkan nyeri otot"],["b","Mahasiswa tersebut telah kehilangan semua sumber energi, sehingga terjadi penumpukan kreatinin, asam laktat, dan fosforilasi oksidatif"],["c","Mahasiswa tersebut mengalami cedera otot akibat kehabisan ATP"],["d","Mahasiswa tersebut menggunakan sumber ATP dari fosforilasi oksidatif karena melakukan olahraga intensitas tinggi tanpa oksigen (anaerob), sehingga terjadi penumpukan laktat"],["e","Mahasiswa tersebut menggunakan sumber ATP dari glikolisis karena melakukan olahraga intensitas tinggi tanpa oksigen (anaerob), sehingga terjadi penumpukan laktat"]],"k":"e","e":"Olahraga intensitas tinggi tanpa pemanasan memakai sumber ATP dari glikolisis anaerob. Piruvat diubah menjadi laktat yang menumpuk, ditambah mikrotrauma serat otot menimbulkan nyeri (DOMS).","w":"a: Kreatin fosfat menghasilkan kreatin, bukan penumpukan kreatinin yang menyebabkan nyeri.|b: Fosforilasi oksidatif bukan zat yang menumpuk.|c: Otot tidak kehabisan ATP total.|d: Fosforilasi oksidatif justru membutuhkan oksigen (aerob).","s":"PPT Biokimia Otot sl. 24"},{"n":81,"t":"trm","q":"Seorang laki-laki usia 38 tahun dibawa temannya ke IGD rumah sakit dengan keluhan tungkai kanan sakit dan sulit digerakkan. Dokter yang memeriksa menemukan adanya luka pada tungkai kanan ukuran 3 cm x 4 cm (terlihat pada gambar), NVD baik. Penatalaksanaan yang sesuai dengan kasus tersebut adalah...","o":[["a","Reposisi dan internal fiksasi"],["b","Debridement dan internal fiksasi"],["c","Reposisi, kompres, dan imobilisasi"],["d","Reposisi dan rehabilitasi"],["e","Debridement dan traksi"]],"k":"b","e":"Luka 3 × 4 cm dengan fraktur di bawahnya dan NVD baik → fraktur terbuka derajat II (luka >1 cm tanpa kerusakan jaringan lunak luas). Penanganannya debridement dan stabilisasi/fiksasi.","w":"a: Fraktur terbuka harus didebridement dulu, bukan langsung reposisi.|c: Kompres dan imobilisasi tidak cukup untuk fraktur terbuka.|d: Rehabilitasi dilakukan setelah fraktur stabil.|e: Traksi bukan pilihan definitif fraktur terbuka derajat II.","s":"PPT Fraktur sl. 10, 21","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCADMBCUDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAQIAAwQGBQf/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/aAAwDAQACEAMQAAAB7GjRnlgkDn0Z6vDCDAcpCarJaAGkqkgMgGEKSBhH
