}
function reviewItem(q, chosen){
  const st = !chosen ? '<span class="st skip">Kosong</span>' : chosen === q.k ? '<span class="st ok">Benar</span>' : '<span class="st bad">Salah</span>';
  return '<details><summary>' + st + '<span class="mono">No. ' + q.n + '</span><span class="txt">' + esc(q.q) + '</span></summary>' +
         '<div style="margin-top:12px">' + qcardHTML(q, chosen, true, 'review') + '</div></details>';
}

/* ---------- simulation ---------- */
function drawSim(){
  const byT = {}; for (const q of Q) (byT[q.t] = byT[q.t] || []).push(q.n);
  const alloc = TOPICS.map(([c]) => { const exact = byT[c].length * SIM_N / Q.length; return { c, k: Math.floor(exact), r: exact - Math.floor(exact) }; });
  let left = SIM_N - alloc.reduce((a, x) => a + x.k, 0);
  alloc.slice().sort((a, b) => b.r - a.r).slice(0, left).forEach(x => x.k++);
  let ids = []; for (const a of alloc) ids = ids.concat(shuffle(byT[a.c]).slice(0, a.k));
  return shuffle(ids);
}
function startSim(){
  const now = Date.now();
  const ids = drawSim();
  store.sim = { ids, ans: {}, flag: {}, ord: Object.fromEntries(ids.map(n => [n, makeOrd(n)])), i: 0, start: now, deadline: now + SIM_MIN * 60000 };
  save(); go({ view: 'sim' });
}
function renderSim(){
  const s = store.sim; if (!s){ go({ view: 'home', rnd: ui.rnd }); return; }
  if (Date.now() >= s.deadline){ finishSim(true); return; }
  const n = s.ids[s.i], q = byN.get(n);
  const done = Object.keys(s.ans).length;
  let h = '<div class="bar"><button class="btn sm ghost" data-act="sim-exit">Keluar</button><div class="title">Simulasi · <span class="mono">' + (s.i + 1) + '/' + s.ids.length + '</span></div>' +
          '<div class="timer" id="timer">' + fmtTime(s.deadline - Date.now()) + '</div><button class="btn sm primary" data-act="sim-submit">Kumpulkan</button></div>';
  h += '<div class="thin"><i style="width:' + (done / s.ids.length * 100) + '%"></i></div>';
  h += '<article class="qcard"><div class="qmeta"><span class="chip">' + esc(TNAME[q.t]) + '</span><span class="chip mono">Soal ' + (s.i + 1) + '</span>' + (s.flag[n] ? '<span class="chip flagged">Ragu</span>' : '') + '</div>' +
       '<p class="stem">' + esc(q.q) + '</p>' + (q.img ? '<img class="qimg" src="' + q.img + '" alt="Gambar untuk soal ini" data-zoom="1"><p class="qimg-hint">Ketuk gambar untuk memperbesar.</p>' : '') + '<div class="opts">' +
       (() => { const txt = Object.fromEntries(q.o); return ordOf(n).map((l, i) => { const t = txt[l]; return '<button class="opt' + (s.ans[n] === l ? ' sel' : '') + '" data-opt="' + l + '" aria-pressed="' + (s.ans[n] === l) + '" aria-label="Opsi ' + DL[i] + ': ' + esc(t) + '"><span class="L">' + DL[i] + '</span><span>' + esc(t) + '</span></button>'; }).join(''); })() +
       '</div></article>';
  h += '<div class="nav"><button class="btn" data-act="sim-prev"' + (s.i ? '' : ' disabled') + '>← Sebelumnya</button>' +
       '<button class="btn flag" data-act="sim-flag" aria-pressed="' + !!s.flag[n] + '">' + (s.flag[n] ? 'Ditandai ragu' : 'Tandai ragu') + '</button><span class="spacer"></span>' +
       (s.i < s.ids.length - 1 ? '<button class="btn primary" data-act="sim-next">Berikutnya →</button>' : '<button class="btn primary" data-act="sim-submit">Kumpulkan</button>') + '</div>';
  h += '<details class="panel" open><summary>Navigasi soal · ' + done + ' dari ' + s.ids.length + ' dijawab</summary><div class="qgrid">' +
       s.ids.map((x, i) => '<button data-jump="' + i + '" class="' + (s.ans[x] ? 'done ' : '') + (s.flag[x] ? 'flag ' : '') + (i === s.i ? 'cur' : '') + '" aria-label="Soal ' + (i + 1) + (s.ans[x] ? ', sudah dijawab' : '') + (s.flag[x] ? ', ragu' : '') + '">' + (i + 1) + '</button>').join('') +
       '</div></details>';
  h += '<p class="hint">Tombol keyboard: A–E untuk menjawab (bisa diganti), ← → untuk pindah soal, R untuk tandai ragu.</p>';
  app.innerHTML = h;
  startTimer();
}
function startTimer(){
  stopTimer();
  timerId = setInterval(() => {
    const s = store.sim; if (!s){ stopTimer(); return; }
    const left = s.deadline - Date.now();
    const el = document.getElementById('timer');
    if (el){ el.textContent = fmtTime(left); el.classList.toggle('low', left < 5 * 60000); }
    if (left <= 0){ stopTimer(); finishSim(true); }
  }, 1000);
}
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }
function finishSim(auto){
  const s = store.sim; if (!s) return;
  stopTimer();
  const res = { ids: s.ids, ans: s.ans, flag: s.flag, ord: s.ord || {}, used: Math.min(Date.now(), s.deadline) - s.start, at: Date.now(), auto: !!auto };
  let ok = 0;
  for (const n of s.ids){
    const a = s.ans[n];
    if (a){ record(n, a); if (a === byN.get(n).k) ok++; }
    if (s.flag[n] && !isFlag(n)) toggleFlag(n);
  }
  store.hist.push({ at: res.at, ok, total: s.ids.length, used: res.used });
  if (store.hist.length > 12) store.hist = store.hist.slice(-12);
  store.sim = null; store.lastSim = res; save();
  go({ view: 'simresult', filter: 'all', rnd: ui.rnd });
  if (auto) toast('Waktu habis. Jawaban otomatis dikumpulkan.');
}
function renderSimResult(){
  const r = store.lastSim; if (!r){ go({ view: 'home', rnd: ui.rnd }); return; }
  const ok = r.ids.filter(n => r.ans[n] === byN.get(n).k).length;
  const skip = r.ids.filter(n => !r.ans[n]).length;
  let h = '<div class="bar"><button class="btn sm ghost" data-act="home">← Beranda</button><div class="title">Hasil simulasi</div></div>';
  h += '<div class="score"><div class="big">' + ok + '<small> / ' + r.ids.length + '</small></div><div><h3>' + pct(ok, r.ids.length) + '% benar</h3>' +
       '<p class="muted">Waktu terpakai <span class="mono">' + fmtTime(r.used) + '</span> dari ' + SIM_MIN + ' menit · ' + (r.ids.length - ok - skip) + ' salah · ' + skip + ' tidak dijawab</p></div></div>';
  h += '<h2 style="margin-top:28px">Per topik</h2><div style="margin-top:8px">';
  for (const [c, name] of TOPICS){
    const ids = r.ids.filter(n => byN.get(n).t === c); if (!ids.length) continue;
    const k = ids.filter(n => r.ans[n] === byN.get(n).k).length, p = pct(k, ids.length);
    h += '<div class="tbar"><span>' + esc(name) + '</span><span class="mono">' + k + '/' + ids.length + '</span><div class="meter"><i class="ok" style="width:' + p + '%"></i><i class="bad" style="width:' + (100 - p) + '%"></i></div></div>';
  }
  h += '</div><h2 style="margin-top:28px">Pembahasan</h2><div class="filters" role="group" aria-label="Saring pembahasan">' +
       [['all', 'Semua'], ['bad', 'Salah'], ['skip', 'Tidak dijawab'], ['flag', 'Ditandai ragu']].map(([k, l]) => '<button class="btn sm" data-filter="' + k + '" aria-pressed="' + (ui.filter === k) + '"' + (ui.filter === k ? ' style="border-color:var(--lfb);color:var(--lfb)"' : '') + '>' + l + '</button>').join('') + '</div>';
  const list = r.ids.filter(n => {
    const a = r.ans[n], q = byN.get(n);
    if (ui.filter === 'bad') return a && a !== q.k;
    if (ui.filter === 'skip') return !a;
    if (ui.filter === 'flag') return r.flag[n];
    return true;
  });
  h += list.length ? '<div class="review">' + list.map(n => reviewItem(byN.get(n), r.ans[n])).join('') + '</div>' : '<p class="empty">Tidak ada soal di kategori ini.</p>';
  h += '<div class="nav"><button class="btn primary" data-act="sim-start">Simulasi baru</button><button class="btn" data-act="home">Kembali ke beranda</button></div>';
  app.innerHTML = h;
}

/* ---------- flashcards ---------- */
function deckCards(){
  let cs = ui.topic === 'all' ? CARDS : CARDS.filter(c => c.t === ui.topic);
  if (ui.hideKnown) cs = cs.filter(c => !store.fc[c.id]);
  if (ui.order) { const pos = new Map(ui.order.map((id, i) => [id, i])); cs = cs.slice().sort((a, b) => (pos.get(a.id) ?? 0) - (pos.get(b.id) ?? 0)); }
  return cs;
}
function renderFlash(){
  stopTimer();
  const cs = deckCards();
  if (ui.i >= cs.length) ui.i = Math.max(0, cs.length - 1);
  const c = cs[ui.i];
  let h = '<div class="bar"><button class="btn sm ghost" data-act="home">← Beranda</button><div class="title">Flashcard · ' + esc(ui.topic === 'all' ? 'Semua topik' : TNAME[ui.topic]) + '</div>' +
          '<div class="count">' + (cs.length ? (ui.i + 1) + ' / ' + cs.length : '0') + '</div></div>';
  h += '<div class="deck" role="group" aria-label="Pilih topik kartu"><button data-deck="all" aria-pressed="' + (ui.topic === 'all') + '">Semua</button>' +
       TOPICS.map(([k, n]) => '<button data-deck="' + k + '" aria-pressed="' + (ui.topic === k) + '">' + esc(n) + '</button>').join('') + '</div>';
  if (!c){
    h += '<p class="empty">Semua kartu di dek ini sudah ditandai hafal. Matikan "Sembunyikan yang sudah hafal" untuk mengulang.</p>';
  } else {
    h += '<button class="card' + (ui.flip ? ' flipped' : '') + (store.fc[c.id] ? ' known' : '') + '" data-act="flip" aria-label="' + (ui.flip ? 'Kartu sisi belakang. Klik untuk melihat sisi depan.' : 'Kartu sisi depan. Klik untuk melihat jawabannya.') + '">' +
         '<span class="side">' + esc(TNAME[c.t]) + ' · ' + (ui.flip ? 'Jawaban' : 'Pertanyaan') + '</span>' +
         (ui.flip ? '<span class="front" style="font-size:18px;color:var(--muted)">' + esc(c.f) + '</span><span class="back">' + esc(c.b) + '</span><span class="src"><b>Sumber:</b> PPT ' + esc(c.s) + '</span>'
                  : '<span class="front">' + esc(c.f) + '</span><span class="muted" style="margin-top:auto;font-size:15px">Ketuk kartu atau tekan Spasi untuk membalik.</span>') + '</button>';
  }
  h += '<div class="nav"><button class="btn" data-act="fc-prev"' + (ui.i > 0 ? '' : ' disabled') + '>← Sebelumnya</button>' +
       (c ? '<button class="btn" data-act="fc-known" aria-pressed="' + !!store.fc[c.id] + '">' + (store.fc[c.id] ? 'Batal tandai hafal' : 'Sudah hafal') + '</button>' : '') +
       '<span class="spacer"></span><button class="btn primary" data-act="fc-next"' + (ui.i < cs.length - 1 ? '' : ' disabled') + '>Berikutnya →</button></div>';
  h += '<div class="nav"><button class="btn sm" data-act="fc-shuffle">' + (ui.order ? 'Urutan asli' : 'Acak urutan') + '</button>' +
       '<label class="check"><input type="checkbox" id="hideKnown"' + (ui.hideKnown ? ' checked' : '') + '> Sembunyikan yang sudah hafal</label></div>';
  h += '<p class="hint">Tombol keyboard: Spasi untuk membalik, ← → untuk pindah, H untuk tandai hafal.</p>';
  app.innerHTML = h;
}

/* ---------- image zoom ---------- */
function openZoom(src, alt){
  const m = document.createElement('div'); m.className = 'modal lightbox'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', 'Gambar diperbesar');
  m.innerHTML = '<button class="close" type="button">Tutup ✕</button><img alt="">';
  m.querySelector('img').src = src; m.querySelector('img').alt = alt || '';
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); e.preventDefault(); close(); } };
  document.addEventListener('keydown', onKey, true);
  m.addEventListener('click', close);
  m.querySelector('.close').focus();
}
app.addEventListener('click', e => {
  const img = e.target.closest('img[data-zoom]'); if (img) openZoom(img.src, img.alt);
});

/* ---------- render ---------- */
function render(){
  if (ui.view === 'practice') renderPractice();
  else if (ui.view === 'practiceResult') renderPracticeResult();
  else if (ui.view === 'sim') renderSim();
  else if (ui.view === 'simresult') renderSimResult();
  else if (ui.view === 'flash') renderFlash();
  else renderHome();
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const t = e.target.closest('button, input'); if (!t || t.disabled) return;
  if (t.dataset.rnd !== undefined){ ui.rnd = +t.dataset.rnd; render(); return; }
  if (t.dataset.opt){
    if (ui.view === 'practice') answerPractice(t.dataset.opt);
    else if (ui.view === 'sim'){ const s = store.sim, n = s.ids[s.i]; s.ans[n] = t.dataset.opt; save(); renderSim(); }
    return;
  }
  if (t.dataset.jump !== undefined){ store.sim.i = +t.dataset.jump; save(); renderSim(); window.scrollTo(0, 0); return; }
  if (t.dataset.filter){ ui.filter = t.dataset.filter; render(); return; }
  if (t.dataset.deck){ ui.topic = t.dataset.deck; ui.i = 0; ui.flip = false; render(); return; }
  if (t.id === 'hideKnown'){ ui.hideKnown = t.checked; ui.i = 0; ui.flip = false; render(); return; }
  const act = t.dataset.act; if (!act) return;
  switch (act){
    case 'home': go({ view: 'home', rnd: ui.rnd ?? 20 }); break;
    case 'topic-start': { const c = t.dataset.topic; startPractice('Latihan · ' + TNAME[c], Q.filter(q => q.t === c).map(q => q.n), 'home'); break; }
    case 'rnd-start': { const all = shuffle(Q.map(q => q.n)); startPractice('Soal acak', ui.rnd ? all.slice(0, ui.rnd) : all); break; }
    case 'rev-start': startPractice('Ulang yang salah & ragu', shuffle(reviewIds())); break;
    case 'prev': if (ui.i > 0){ ui.i--; render(); window.scrollTo(0, 0); } break;
    case 'next': if (ui.i < ui.ids.length - 1){ ui.i++; render(); window.scrollTo(0, 0); } break;
    case 'flag': { const on = toggleFlag(ui.ids[ui.i]); render(); toast(on ? 'Ditandai ragu.' : 'Tanda ragu dihapus.'); break; }
    case 'finish-practice': go(Object.assign({}, ui, { view: 'practiceResult' })); break;
    case 'redo-wrong': startPractice('Ulang yang salah', ui.wrong.slice()); break;
    case 'sim-start':
      if (store.sim){ confirmBox('Simulasi masih berjalan', 'Mulai simulasi baru akan membatalkan simulasi yang sedang berjalan.', 'Mulai baru', startSim); }
      else startSim();
      break;
    case 'sim-resume': go({ view: 'sim', rnd: ui.rnd }); break;
    case 'sim-cancel': confirmBox('Batalkan simulasi?', 'Jawaban di simulasi ini akan dihapus dan tidak masuk riwayat.', 'Batalkan simulasi', () => { store.sim = null; save(); render(); }); break;
    case 'sim-exit': stopTimer(); go({ view: 'home', rnd: ui.rnd ?? 20 }); toast('Simulasi disimpan. Timer tetap berjalan.'); break;
    case 'sim-prev': if (store.sim.i > 0){ store.sim.i--; save(); renderSim(); window.scrollTo(0, 0); } break;
    case 'sim-next': if (store.sim.i < store.sim.ids.length - 1){ store.sim.i++; save(); renderSim(); window.scrollTo(0, 0); } break;
    case 'sim-flag': { const s = store.sim, n = s.ids[s.i]; s.flag[n] = !s.flag[n]; save(); renderSim(); break; }
    case 'sim-submit': {
      const s = store.sim, left = s.ids.length - Object.keys(s.ans).length;
      confirmBox('Kumpulkan jawaban?', left ? 'Masih ada ' + left + ' soal yang belum dijawab. Soal kosong dihitung salah.' : 'Semua soal sudah dijawab.', 'Kumpulkan', () => finishSim(false));
      break;
    }
    case 'fc-open': go({ view: 'flash', topic: t.dataset.topic || 'all', i: 0, flip: false, hideKnown: false, order: null, rnd: ui.rnd }); break;
    case 'flip': ui.flip = !ui.flip; render(); break;
    case 'fc-prev': if (ui.i > 0){ ui.i--; ui.flip = false; render(); } break;
    case 'fc-next': { const cs = deckCards(); if (ui.i < cs.length - 1){ ui.i++; ui.flip = false; render(); } break; }
    case 'fc-known': { const c = deckCards()[ui.i]; if (!c) break; if (store.fc[c.id]) delete store.fc[c.id]; else store.fc[c.id] = 1; save();
      if (ui.hideKnown && store.fc[c.id]) ui.flip = false; render(); break; }
    case 'fc-shuffle': ui.order = ui.order ? null : shuffle(CARDS.map(c => c.id)); ui.i = 0; ui.flip = false; render(); break;
    case 'reset': confirmBox('Hapus semua progres?', 'Jawaban, tanda ragu, kartu hafal dan riwayat simulasi di browser ini akan dihapus.', 'Hapus progres', () => { store = def(); save(); render(); toast('Progres dihapus.'); }); break;
  }
});

document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.querySelector('.modal')) return;
  const k = e.key.toLowerCase();
  const letters = ['a', 'b', 'c', 'd', 'e'], nums = ['1', '2', '3', '4', '5'];
  if (ui.view === 'practice' || ui.view === 'sim'){
    const idx = letters.indexOf(k) >= 0 ? letters.indexOf(k) : nums.indexOf(k);
    const q = byN.get(ui.view === 'sim' ? store.sim.ids[store.sim.i] : ui.ids[ui.i]);
    const ord = ordOf(q.n);
    if (idx >= 0 && ord[idx]){ const b = app.querySelector('[data-opt="' + ord[idx] + '"]'); if (b && !b.disabled) b.click(); e.preventDefault(); return; }
    if (k === 'arrowright'){ const b = app.querySelector('[data-act="next"],[data-act="sim-next"]'); if (b && !b.disabled){ b.click(); e.preventDefault(); } return; }
    if (k === 'arrowleft'){ const b = app.querySelector('[data-act="prev"],[data-act="sim-prev"]'); if (b && !b.disabled){ b.click(); e.preventDefault(); } return; }
    if (k === 'r'){ const b = app.querySelector('[data-act="flag"],[data-act="sim-flag"]'); if (b){ b.click(); e.preventDefault(); } return; }
  }
  if (ui.view === 'flash'){
    if (k === ' '){ if (e.target.closest('button')) return; const b = app.querySelector('[data-act="flip"]'); if (b){ b.click(); e.preventDefault(); } return; }
    if (k === 'arrowright'){ const b = app.querySelector('[data-act="fc-next"]'); if (b && !b.disabled){ b.click(); e.preventDefault(); } return; }
    if (k === 'arrowleft'){ const b = app.querySelector('[data-act="fc-prev"]'); if (b && !b.disabled){ b.click(); e.preventDefault(); } return; }
    if (k === 'h'){ const b = app.querySelector('[data-act="fc-known"]'); if (b){ b.click(); e.preventDefault(); } return; }
  }
});

/* ---------- boot ---------- */
function deepLink(){
  const m = /^#(latihan|kartu)-([a-z]+)$/.exec(location.hash || '');
  if (!m || !TNAME[m[2]]) return false;
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  const c = m[2];
  if (m[1] === 'latihan') startPractice('Latihan · ' + TNAME[c], Q.filter(q => q.t === c).map(q => q.n), 'home');
  else go({ view: 'flash', topic: c, i: 0, flip: false, hideKnown: false, order: null, rnd: ui.rnd });
  return true;
}
window.addEventListener('hashchange', deepLink);
function start(snap){
  if (snap && snap.view && snap.view !== 'sim') ui = snap;
  else if (snap && snap.view === 'sim' && store.sim) ui = snap;
  if (!deepLink()) render();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot(() => ui); } catch(e){}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
